 f:'Fristenkarte zum Auswendiglernen.',rel:['n_wid','n_wieder','n_ueberpr','n_eil','n_genfikt','n_bekanntgabe'],l:[]});

N('n_pfaend','t_rechtsschutz','Pfändungsschutz',{p:'§ 54 SGB I, § 42 SGB II, §§ 850k ff. ZPO',k:['SGB I|54','SGB II|42'],m:[9],src:'Weitere',sum:'Laufende Geldleistungen wie Arbeitseinkommen pfändbar; Grundsicherungsgeld unpfändbar; P-Konto.',
 b:`<p>Ansprüche auf laufende Geldleistungen können wie Arbeitseinkommen gepfändet werden (§ 54 Abs. 4 SGB I). Unpfändbar sind u. a. Elterngeld bis zur Höhe der Freibeträge, Mutterschaftsgeld, Wohngeld (mit Ausnahmen) und Leistungen zum Ausgleich von Mehraufwand wegen Körper- oder Gesundheitsschäden (§ 54 Abs. 3). Ansprüche auf <b>Grundsicherungsgeld</b> sind nach § 42 Abs. 4 SGB II nicht pfändbar.</p>
<p>Für den Schutz auf dem Konto ist das <b>Pfändungsschutzkonto</b> (§§ 850k ff. ZPO) maßgeblich. Der Grundfreibetrag wird jährlich zum 1. Juli angepasst; Erhöhungsbeträge (Unterhaltspflichten, Sozialleistungen) werden durch Bescheinigung nachgewiesen (Jobcenter, Familienkasse, Schuldnerberatung). Vor dem Kurs den aktuellen Freibetrag einsetzen.</p>`,
 f:'P-Konto; § 54 SGB I; Grundsicherungsgeld unpfändbar.',rel:['n_wid','f9_2'],l:LK(['SGB I',54],['SGB II',42])});

N('f9_1','t_faelle','Fall 9.1: Die liegengebliebene Post',{p:'Fall',m:[9],src:'SGG',sum:'Versagungsbescheid, Fristversäumnis, Wiedereinsetzung, Überprüfung.',
 b:`<h4>Sachverhalt</h4><p>Herr P., 49, Depression, Betreuung (Vermögenssorge, Behörden) neu seit Oktober 2026. In der Wohnung liegen ungeöffnet: Aufforderung zur Vorlage von Kontoauszügen (Frist 15.8.2026), ein Versagungsbescheid vom 3.9.2026 (mit ordnungsgemäßer Rechtsbehelfsbelehrung, am 3.9. zur Post gegeben) und eine Mahnung des Vermieters. Die Aufforderung enthielt keinen Hinweis auf die Rechtsfolgen.</p>
<details><summary>Lösungshinweise</summary><ol><li><b>Bekanntgabe:</b> Zugangsfiktion am vierten Tag nach Aufgabe zur Post (§ 37 Abs. 2 SGB X) = 7.9.2026 (Montag); Widerspruchsfrist endete am 7.10.2026 → versäumt.</li><li><b>Wiedereinsetzung</b> (§ 67 SGG): krankheitsbedingte Unfähigkeit, Post zu öffnen, glaubhaft machen (Attest); Antrag binnen eines Monats nach Kenntnis der Betreuerin.</li><li><b>Überprüfungsantrag</b> nach § 44 SGB X: Die Versagung ist rechtswidrig, weil der schriftliche Hinweis auf die Rechtsfolge (§ 66 Abs. 3 SGB I) fehlte.</li><li>Parallel: Mitwirkung nachholen (Kontoauszüge), Antrag nach § 67 SGB I, vorsorglich neuer Leistungsantrag (wirkt auf den Monatsersten zurück, § 37 Abs. 2 SGB II).</li><li><b>Mietschulden:</b> Antrag auf Übernahme nach § 22 Abs. 8 SGB II; bei drohender Kündigung Eilantrag nach § 86b Abs. 2 SGG beim Sozialgericht Dresden.</li></ol></details>`,
 rel:['n_versagung','n_wieder','n_ueberpr','n_eil','n_mitw'],l:[]});
N('f9_2','t_faelle','Fall 9.2: Die Rückforderung wegen Erbschaft',{p:'Fall',m:[9],src:'SGBX',sum:'Aufhebung nach § 48 Abs. 1 S. 2 Nr. 3, Erstattung, Verteidigung bei Demenz.',
 b:`<h4>Sachverhalt</h4><p>Frau L., 63, mittelgradige Demenz, Betreuung erst seit September 2026, bezieht Grundsicherungsgeld. Im Januar 2026 erbte sie 8.000 €, ohne es mitzuteilen. Im Oktober 2026 hebt das Jobcenter die Bewilligung für Februar–Juli 2026 auf und fordert 6.900 € zurück.</p>
<details><summary>Lösungshinweise</summary><ol><li><b>Rechtsgrundlage:</b> § 48 Abs. 1 S. 2 Nr. 3 SGB X (Einkommenszufluss nach Erlass) i. V. m. § 40 Abs. 2 SGB II, § 330 Abs. 3 SGB III; Verschulden spielt hier keine Rolle.</li><li><b>Berechnung prüfen:</b> Erbschaft ist nach § 11a Abs. 1 Nr. 7 SGB II kein Einkommen, sondern Vermögen – <a data-go="n_nichteink">Einheit 6</a>; Freibeträge und Verwertbarkeit prüfen. (Das Skript behandelt sie als einmalige Einnahme auf sechs Monate verteilt, § 11 Abs. 3; Einordnung im Einzelfall prüfen.)</li><li><b>Erstattung</b> nach § 50 SGB X; Aufrechnung nach § 43 SGB II möglich.</li><li><b>Verteidigung:</b> Bei Demenz und fehlender Einsichtsfähigkeit ggf. Geschäftsunfähigkeit → frühere Bekanntgaben unwirksam (§ 11 SGB X). Ordnungswidrigkeitenverfahren wegen fehlenden Vorsatzes einstellen lassen.</li><li>Bei berechtigter Rückforderung: prüfen, ob noch Erbschaftsreste vorhanden sind; Stundung oder Erlass nach § 44 SGB II beantragen.</li></ol></details>`,
 rel:['n_aufheb','n_vermoegen','n_nichteink','n_bekanntgabe'],l:[]});
N('f9_3','t_faelle','Fall 9.3: Das Jobcenter entscheidet nicht',{p:'Fall',m:[9],src:'SGG',sum:'Untätigkeitsklage und einstweilige Anordnung.',
 b:`<h4>Sachverhalt</h4><p>Herr K. beantragte am 2.4.2026 die Übernahme einer Betriebskostennachzahlung. Bis 10.11.2026 keine Entscheidung; der Vermieter droht mit Klage.</p>
<details><summary>Lösungshinweise</summary><ol><li>Untätigkeitsklage zulässig nach Ablauf von sechs Monaten (seit 3.10.2026), § 88 Abs. 1 SGG.</li><li>Wegen der drohenden Vermieterklage: einstweilige Anordnung nach § 86b Abs. 2 SGG; Anordnungsgrund glaubhaft machen (Schreiben des Vermieters).</li><li>Gerichtskostenfrei; bei Bedarf Prozesskostenhilfe.</li></ol></details>`,
 rel:['n_wid','n_eil'],l:[]});
N('f9_4','t_faelle','Fall 9.4: Der Entziehungsbescheid bei der Rente',{p:'Fall',m:[9],src:'Weitere',sum:'Grenzen der Mitwirkung bei stationärer Begutachtung.',
 b:`<h4>Sachverhalt</h4><p>Die Rentenversicherung fordert Frau D. (befristete Erwerbsminderungsrente, Psychose) zu einer fünftägigen stationären Begutachtung auf. Sie lehnt aus Angst ab; die Rente wird nach § 66 SGB I entzogen.</p>
<details><summary>Lösungshinweise</summary><ol><li>Mitwirkungspflicht nach § 62 SGB I grundsätzlich gegeben.</li><li>Grenzen: § 65 Abs. 1 Nr. 2 (wichtiger Grund) und Verhältnismäßigkeit; mildere Mittel – ambulante Begutachtung, Auswertung vorhandener Befunde (Nr. 3).</li><li>Formelle Voraussetzungen nach § 66 Abs. 3 prüfen.</li><li>Widerspruch; Antrag auf Anordnung der aufschiebenden Wirkung, falls sofort vollziehbar.</li><li><b>Betreuungsrechtlich:</b> Der Wille von Frau D. ist zu respektieren; Zwang zur Untersuchung gibt es im Sozialrecht nicht. Die Betreuerin unterstützt sie beim Verstehen der Folgen und schlägt Alternativen vor (§ 1821 Abs. 2 BGB).</li></ol></details>`,
 rel:['n_versagung','n_mitw','n_rente'],l:LK(['BGB',1821])});

EH[10]={z:'Vernetzte Fallarbeit: Prüfreihenfolge für komplexe Fälle, vier Abschlussfälle (Familie W., Herr F. im Heim, Frau Y., Herr S.) und Aktualitätshinweise.',
 ks:['Lebenslage erfassen, Bedarfe benennen, vorrangige vor nachrangigen Leistungen prüfen.','Anträge, Fristen, Mitwirkung und Bekanntgabe an den Betreuer im Blick behalten.','Rechtsschutz und Eilbedürftigkeit prüfen; Wünsche des Betreuten, Aufgabenkreis und Genehmigungserfordernisse beachten.'],
 kq:[['Nenne die sieben Schritte der Prüfreihenfolge komplexer Fälle.','Lebenslage – Bedarfe – vorrangige Leistungen – nachrangige Leistungen (SGB II/XII) – Verfahren – Rechtsschutz – Betreuungsrecht.'],
 ['Gehört ein 20-jähriger Auszubildender zur Bedarfsgemeinschaft der Eltern?','Ja, als unverheiratetes Kind unter 25, soweit er seinen Bedarf nicht aus eigenem Einkommen deckt (§ 7 Abs. 3 Nr. 4 SGB II).'],
 ['Wie hoch ist bei einem Heimbewohner mit Sozialhilfe der Mindestbarbetrag 2026?','152,01 € (§ 27b Abs. 3 SGB XII).']]};

N('n_faelleprf','t_faelle','Prüfreihenfolge für komplexe Fälle',{p:'Methodik',m:[10],src:'Weitere',sum:'Sieben Schritte von der Lebenslage bis zum Betreuungsrecht.',
 b:`<ol><li><b>Lebenslage erfassen:</b> Wer lebt mit wem zusammen? Welche Einkünfte, welches Vermögen, welche Gesundheitssituation?</li><li><b>Bedarfe benennen:</b> Lebensunterhalt, Wohnen, Gesundheit, Pflege, Teilhabe.</li><li><b>Vorrangige Leistungen:</b> Versicherungsleistungen (SGB V, VI, XI, III), Unterhalt, Wohngeld, Kinderzuschlag.</li><li><b>Nachrangige Leistungen:</b> SGB II oder SGB XII; Abgrenzung nach Erwerbsfähigkeit und Alter.</li><li><b>Verfahren:</b> Anträge mit Fristen, Mitwirkung, Bekanntgabe an den Betreuer.</li><li><b>Rechtsschutz:</b> laufende Fristen, Eilbedürftigkeit.</li><li><b>Betreuungsrecht:</b> Wünsche des Betreuten, Aufgabenkreis, Genehmigungserfordernisse, Dokumentation.</li></ol>`,
 f:'Prüfreihenfolge 1–7 auswendig.',rel:['n_sgb12_abgr','n_fristen','n_antrag','f10_1','f10_2','f10_3','f10_4'],l:[]});

N('f10_1','t_faelle','Abschlussfall 10.1: Familie W.',{p:'Fall',m:[10],src:'SGBII',sum:'Bedarfsgemeinschaft, Krankengeld, § 51-Aufforderung, Mietschulden.',
 b:`<h4>Sachverhalt</h4><p>Herr W. (52) und Frau W. (50), verheiratet, leben mit Tochter Mia (15) und Sohn Jonas (20, Auszubildender, 1.000 € brutto/790 € netto) in Dresden (Bruttowarmmiete 980 €). Herr W. (Berufskraftfahrer, 3.100 € brutto) ist seit sechs Monaten nach Bandscheibenvorfall und depressiver Episode arbeitsunfähig, Krankengeld 1.750 € netto; Betreuung für Gesundheitssorge und Behörden. Frau W. arbeitet in Teilzeit (1.200 € brutto/960 € netto). Kindergeld für Mia. Die Krankenkasse fordert zum Reha-Antrag binnen zehn Wochen auf. Mietrückstand zwei Monatsmieten, fristlose Kündigung angedroht.</p>
<p><b>Aufgaben:</b> (1) Beteiligte Träger? (2) Aufforderung der Krankenkasse? (3) SGB-II-Anspruch, Bedarfsgemeinschaft? (4) Mietschulden? (5) Handlungsplan?</p>
<details><summary>Lösungshinweise</summary><ol>
<li><b>Träger:</b> Krankenkasse (Krankengeld, Heilbehandlung), Rentenversicherung (Reha, später ggf. EM-Rente), Familienkasse, Wohngeldstelle oder Jobcenter (ergänzend), Agentur für Arbeit (nach Aussteuerung, Nahtlosigkeit § 145 SGB III), Jobcenter für Mietschulden (§ 22 Abs. 8 SGB II).</li>
<li><b>Aufforderung nach § 51 SGB V:</b> Verwaltungsakt; die Zehnwochenfrist einhalten, sonst entfällt das Krankengeld. Der Reha-Antrag kann als Rentenantrag gelten (§ 116 Abs. 2 SGB VI). Krankengeld (1.750 €) ist voraussichtlich höher als eine EM-Rente; Widerspruch kann sinnvoll sein, wenn die Voraussetzungen der Aufforderung (ärztliches Gutachten zur erheblichen Gefährdung der Erwerbsfähigkeit) fehlen. Die Reha selbst kann im Interesse von Herrn W. liegen – Entscheidung mit ihm besprechen (§ 1821 Abs. 2 BGB).</li>
<li><b>Bedarfsgemeinschaft:</b> Herr und Frau W. und Mia (§ 7 Abs. 3). Jonas (20, unverheiratet) gehört als Kind unter 25 dazu, soweit er seinen Bedarf nicht aus eigenem Einkommen decken kann (§ 7 Abs. 3 Nr. 4); als Auszubildender in betrieblicher Ausbildung nicht nach § 7 Abs. 5 ausgeschlossen; vorrangig Berufsausbildungsbeihilfe prüfen. <b>Grobe Rechnung (Regelbedarfe 2026):</b> Herr W. 506 €, Frau W. 506 €, Mia 471 €, Jonas 451 €, Unterkunft 980 € (Kopfteil je 245 €) → Gesamtbedarf 2.914 €. Einkommen: Krankengeld 1.750 € (abzüglich Versicherungspauschale), Frau W. 960 € abzüglich Freibeträge (§ 11b), Kindergeld Mia 259 €, Ausbildungsvergütung Jonas abzüglich Freibeträge. Das bereinigte Einkommen liegt in der Größenordnung des Bedarfs; ein kleiner Restanspruch ist möglich und konkret zu berechnen. Wohngeld mit Kinderzuschlag als vorrangige Alternative prüfen (§ 12a SGB II).</li>
<li><b>Mietschulden:</b> Übernahme nach § 22 Abs. 8 SGB II (auch wenn nur deshalb Hilfebedürftigkeit entsteht). Bei Räumungsklage Schonfristzahlung nach § 569 Abs. 3 Nr. 2 BGB binnen zwei Monaten nach Zustellung; das Amtsgericht informiert den Träger (§ 22 Abs. 9 SGB II). Bei Eilbedürftigkeit einstweilige Anordnung beim Sozialgericht Dresden.</li>
<li><b>Handlungsplan:</b> (a) Fristen notieren; (b) ärztliche Stellungnahme; (c) Reha-Antrag oder Widerspruch nach Abstimmung; (d) Jobcenter-Antrag für die Bedarfsgemeinschaft in Abstimmung mit Frau W., die nicht betreut ist und für sich handelt (§ 38 SGB II); (e) Vermieter kontaktieren; (f) Versicherungsverlauf anfordern; (g) Aufgabenkreis prüfen: Vermögenssorge ist nicht übertragen – Erweiterung beim Betreuungsgericht anregen oder Herrn W. beim eigenen Handeln unterstützen.</li></ol></details>`,
 rel:['n_krg','n_bg','n_einkommen','n_kdu','n_eil','n_faelleprf'],l:[]});

N('f10_2','t_faelle','Abschlussfall 10.2: Herr F. zieht ins Heim',{p:'Fall',m:[10],src:'SGBXII',sum:'Pflegegrad 4, Eigenanteil, Immobilie, Unterhalt, Barbetrag.',
 b:`<h4>Sachverhalt</h4><p>Herr F., 84, verwitwet, Eigentumswohnung (210.000 €, 62 m²), Altersrente 1.450 € netto, Betriebsrente 180 €, Erspartes 18.000 €, Sterbegeldversicherung (Rückkaufswert 4.500 €). Nach Sturz und Demenz Umzug ins Pflegeheim, Pflegegrad 4. Eigenanteil nach Abzug der Pflegeversicherung und des Leistungszuschlags 2.900 €/Monat. Tochter ist Betreuerin (Vermögenssorge, Gesundheitssorge, Aufenthaltsbestimmung, Wohnungsangelegenheiten) und verdient 65.000 € jährlich.</p>
<details><summary>Lösungshinweise</summary><ol>
<li><b>Pflegeversicherung:</b> Pflegegrad 4: 1.855 € monatlich bei vollstationärer Pflege; zusätzlich Leistungszuschlag zum Eigenanteil nach § 43c SGB XI, steigend mit der Verweildauer.</li>
<li><b>Selbst tragen?</b> Einkommen 1.630 € gegen Eigenanteil 2.900 € → Fehlbetrag 1.270 €/Monat. Erspartes 18.000 € über dem Schonbetrag von 10.000 € einzusetzen; die Sterbegeldversicherung ist als angemessene Bestattungsvorsorge regelmäßig geschützt (§ 90 Abs. 3 SGB XII). Danach Hilfe zur Pflege (§§ 61 ff. SGB XII, Modul 9) und Grundsicherung im Alter für den Lebensunterhalt im Heim (§ 27b). Zuständiger Träger (örtlicher Träger oder Kommunaler Sozialverband Sachsen) klären.</li>
<li><b>Wohnung:</b> Nach dem Umzug entfällt der Schutz nach § 90 Abs. 2 Nr. 8 SGB XII, sofern nicht Angehörige dort wohnen; grundsätzlich zu verwerten, bis dahin Sozialhilfe als Darlehen (§ 91 SGB XII). <b>Betreuungsrechtlich:</b> Aufgabe des selbstgenutzten Wohnraums dem Betreuungsgericht anzeigen (§ 1833 Abs. 2 BGB); Verkauf und Vermietung des Wohnraums genehmigungsbedürftig (§ 1833 Abs. 3), Verkauf des Wohnungseigentums zusätzlich nach § 1850 BGB. Den Wunsch von Herrn F., zurückzukehren, ermitteln und berücksichtigen, solange realistisch; Vermietung als Alternative zum Verkauf.</li>
<li><b>Unterhalt:</b> Die Tochter verdient unter 100.000 € – Rückgriff ausgeschlossen (§ 94 Abs. 1a SGB XII). Interessenkonflikte beachten (z. B. Verkauf an sich selbst; § 1824 BGB, Ergänzungsbetreuung).</li>
<li><b>Zuzahlungen/Barbetrag:</b> Mit Hilfe zur Pflege gilt für die Belastungsgrenze die Regelbedarfsstufe 1 (§ 62 Abs. 2 S. 6 SGB V): 135,12 € bzw. 67,56 €. Barbetrag mindestens 152,01 € (§ 27b Abs. 3 SGB XII) plus Bekleidungspauschale. Ab 2027 höhere Zuzahlungen beachten.</li></ol></details>`,
 rel:['n_pvleist','n_sgb12_verm','n_sgb12_regel','n_zuz','n_sgb12_weitere'],l:LK(['BGB',1833],['BGB',1850],['BGB',1824],['SGB XII',91],['SGB XI','43c'])});

N('f10_3','t_faelle','Abschlussfall 10.3: Die junge Mutter mit Psychose',{p:'Fall',m:[10],src:'SGBII',sum:'Erwerbsfähigkeit, Klinikaufenthalt, rechtswidrige Aufhebung, Krankenversicherung.',
 b:`<h4>Sachverhalt</h4><p>Frau Y., 27, alleinerziehend (Kind 2 Jahre), paranoide Schizophrenie, zuletzt drei Monate stationär; das Kind lebte bei der Großmutter. Das Jobcenter hob die Leistungen für die Klinikzeit auf („nicht erreichbar“) und fordert 2.400 € zurück. Amtsärztliches Gutachten: unter drei Stunden für voraussichtlich zwölf Monate.</p>
<details><summary>Lösungshinweise</summary><ol>
<li><b>Erwerbsfähigkeit:</b> Volle Erwerbsminderung für mehr als sechs Monate bedeutet fehlende Erwerbsfähigkeit (§ 8 Abs. 1 SGB II). Bei Widerspruch gegen die Feststellung entscheidet der Rentenversicherungsträger (§ 44a SGB II); bis dahin zahlt das Jobcenter weiter.</li>
<li><b>Lebensunterhalt danach:</b> Nicht dauerhaft voll erwerbsgemindert → Hilfe zum Lebensunterhalt, 3. Kapitel SGB XII; Sozialgeld für das Kind im SGB II nur bei erwerbsfähigem Mitglied der Bedarfsgemeinschaft → voraussichtlich SGB XII für Mutter und Kind (Einsatzgemeinschaft § 27 Abs. 2). Unterhaltsvorschuss und Kindergeld vorrangig.</li>
<li><b>Aufhebung:</b> Ein Krankenhausaufenthalt unter sechs Monaten schließt Leistungen nicht aus (§ 7 Abs. 4 S. 3 Nr. 1 SGB II); stationäre Behandlung ist ein wichtiger Grund bei der Erreichbarkeit. Aufhebung voraussichtlich rechtswidrig: Widerspruch, bei Fristversäumnis Wiedereinsetzung oder Überprüfungsantrag nach § 44 SGB X; Aussetzung der Aufrechnung beantragen. Temporäre Bedarfsgemeinschaft bzw. Bedarf bei der Großmutter für die Zeit des Aufenthalts des Kindes prüfen.</li>
<li><b>Krankenversicherung:</b> Beim Wechsel aus dem SGB II endet die Pflichtversicherung nach § 5 Abs. 1 Nr. 2a SGB V; Absicherung über Auffangversicherung oder § 264 SGB V klären.</li>
<li><b>Betreuung/Kinderschutz:</b> Hilfen zur Erziehung (SGB VIII), Elternassistenz (SGB IX) besprechen; Wünsche von Frau Y. zur Gestaltung der Unterstützung haben Vorrang.</li></ol></details>`,
 rel:['n_erwerbsf','n_aufheb','n_ueberpr','n_vprinzip','n_sgb12_abgr'],l:[]});

N('f10_4','t_faelle','Abschlussfall 10.4: Der Wechsel in die Altersrente',{p:'Fall',m:[10],src:'SGBII',sum:'Aufforderung zur vorzeitigen Altersrente, Unbilligkeitsverordnung, Abschläge, Vermögen im SGB XII.',
 b:`<h4>Sachverhalt</h4><p>Herr S., geboren Mai 1962, lebt allein, Grundsicherungsgeld, 41 Beitragsjahre, 16.000 € Abfindung (im SGB II geschützt). Im Oktober 2026 fordert das Jobcenter ihn auf, eine vorzeitige Altersrente für langjährig Versicherte mit Abschlägen zu beantragen.</p>
<details><summary>Lösungshinweise</summary><ol>
<li><b>Aufforderung (§ 12a SGB II):</b> grundsätzlich ab dem 63. Lebensjahr zulässig; Ausnahmen nach der Unbilligkeitsverordnung prüfen (z. B. wenn die Rente voraussichtlich zu Hilfebedürftigkeit im Alter führt). Widerspruch möglich, aber ohne aufschiebende Wirkung (§ 39 SGB II); Eilantrag prüfen.</li>
<li><b>Folgen:</b> Ausschluss vom SGB II (§ 7 Abs. 4). Bei zu niedriger Rente vor der Regelaltersgrenze (66 Jahre 8 Monate = Januar 2029) keine Grundsicherung im Alter, sondern nur Hilfe zum Lebensunterhalt, 3. Kapitel SGB XII.</li>
<li><b>Vermögen:</b> Im SGB XII Freibetrag 10.000 €; 6.000 € wären einzusetzen – deutlicher Nachteil gegenüber dem SGB II.</li>
<li><b>Abschläge:</b> 0,3 % je Monat der vorzeitigen Inanspruchnahme (§ 77 SGB VI), dauerhaft.</li>
<li><b>Betreuung:</b> weitreichende Entscheidung; ausführliche Information und Unterstützung, Wunsch dokumentieren.</li></ol></details>`,
 rel:['n_altersrente','n_sgb12_verm','n_sgb12_abgr','n_wid'],l:LK(['SGB II','12a'],['SGB VI',77])});

N('n_aktuell','t_pfad','Aktualitätshinweise (Stand November 2026)',{p:'Anhang',m:[10],src:'Weitere',sum:'Was sich 2026/2027 ändert und vor jedem Kurs zu prüfen ist.',
 b:`<ul><li>Die Beträge der Sozialen Entschädigung werden jährlich zum 1. Juli angepasst (§ 110 SGB XIV) – vor jedem Kursdurchlauf prüfen.</li><li>Die Umgestaltung der Grundsicherung für Arbeitsuchende ist seit 1.7.2026 in Kraft; einzelne Teile treten nach Art. 12 des Änderungsgesetzes erst später in Kraft (u. a. 1.8.2027) (BGBl. 2026 I Nr. 107). Formulare und Bescheide werden bis Ende 2026 schrittweise umgestellt.</li><li>Die Zuzahlungen in der Krankenversicherung steigen ab 1.1.2027 (BGBl. 2026 I Nr. 228).</li><li>Das Pflegeneuordnungsgesetz befindet sich im parlamentarischen Verfahren und soll zum 1.1.2027 in Kraft treten; bis zur Verkündung gilt das dargestellte Recht.</li><li>Rentenwert und Hinzuverdienstgrenzen ändern sich jährlich zum 1. Juli bzw. 1. Januar.</li><li>Regelbedarfe 2027 vor dem jeweiligen Kurs gesondert prüfen; 2026 gilt für Alleinstehende 563 €.</li></ul>`,
 f:'Reform 1.7.2026, Zuzahlungen 2027, Pflegeneuordnung geplant.',rel:['n_reform26','n_zuz','n_pvleist'],l:[]});

N('root',null,'Sozialrecht 1 · Kenntnisse des Sozialrechts',{th:'root',m:[],sum:'Modul 8 des Sachkundelehrgangs für berufliche Betreuer – 10 Einheiten, thematisch geordnet, verlinkt und mit Lernpfad. Rechtsstand: 10. November 2026.',
 b:`<div class="box"><h3>So arbeitest du damit</h3><ul>
<li><b>Lernpfad:</b> Der Zweig „Lernpfad“ führt in zehn Einheiten durch das Skript – mit Lernziel, Kernsätzen, Kontrollfragen, den zugehörigen Inhalten und der Schaltfläche „Weiter lernen“.</li>
<li><b>Filter:</b> Thema, Quelle und Status wirken in jeder Zeile als ODER, die Zeilen untereinander als UND.</li>
<li><b>Suche:</b> findet Paragrafen (z. B. „§ 11b“ oder „82“), Begriffe und Wortteile, auch mit kleinen Tippfehlern. Mit <kbd>/</kbd> springst du ins Suchfeld.</li>
<li><b>Tasten:</b> <kbd>T</kbd> blendet die Themen-/Filterleiste ein oder aus, <kbd>B</kbd> den Baum. Beide Tasten gelten nicht, solange du in ein Eingabefeld tippst.</li>
<li><b>Verlinkung:</b> Paragrafen im Text springen – wo vorhanden – zur erläuternden Seite; sonst zum Gesetzestext. Verwandte Themen stehen unter „Verwandte Normen“.</li>
<li><b>Lernen:</b> „Als gelernt markieren“ und „Merken“ speichern deinen Stand im Browser.</li></ul></div>
<div class="box focus"><h3>Prüfungsfokus</h3><p>Denke in dieser Reihenfolge: <b>1.</b> Wer ist leistungsberechtigt (Erwerbsfähigkeit, Alter, Bedürftigkeit)? <b>2.</b> Welche Leistung ist vorrangig (Versicherung vor Fürsorge)? <b>3.</b> Welcher Bedarf, welches Einkommen, welches Vermögen? <b>4.</b> Welche Verfahrensschritte und Fristen (Antrag, Mitwirkung, Bekanntgabe)? <b>5.</b> Welche Rechtsschutzmöglichkeiten? <b>6.</b> Was folgt für die Betreuung (Wille, Aufgabenkreis, Genehmigung)?</p></div>`,
 f:'',l:[['SGB I bis XII und XIV (gesetze-im-internet.de)',G],['Sozialgerichtsgesetz (SGG)',G+'sgg/'],['Grundgesetz',G+'gg/']]});

const TI=(id,th,title,p,sum,leit,txt)=>N(id,'root',title,{th,p,sum,f:leit,b:txt});
TI('t_grund','grund','Verfassung und Grundlagen','Art. 1, 3, 6, 19, 20, 23, 28, 74 GG','Sozialstaatsprinzip, Menschenwürde, Gleichheit, Gesetzesvorbehalt, EU-Recht.','Welche verfassungsrechtlichen Vorgaben prägen das Sozialrecht?','<p>Das Sozialrecht beruht auf dem Sozialstaatsprinzip (Art. 20 GG) und dem Grundrecht auf ein menschenwürdiges Existenzminimum (Art. 1 Abs. 1 i. V. m. Art. 20 Abs. 1 GG). Hinzu kommen Gleichheit und Diskriminierungsverbot für Menschen mit Behinderung, der Vorbehalt des Gesetzes, die Rechtsschutzgarantie und europäisches Recht.</p>');
TI('t_system','system','System und Soziale Rechte','SGB I, SGB XIV','Sozialgesetzbücher, Grundtypen der Sozialleistungen, soziale Rechte, Träger, Ermessen.','Wie ist das Sozialrecht aufgebaut und wer ist wofür zuständig?','<p>Das Sozialgesetzbuch gliedert sich in Bücher; sie folgen den Grundtypen Vorsorge, Entschädigung, Hilfe (Fürsorge) und Förderung. Das SGB I enthält allgemeine Regeln, soziale Rechte und Zuständigkeiten.</p>');
TI('t_verfahren','verfahren','Verwaltungsverfahren','SGB I, SGB X','Beratung, Antrag, Verwaltungsakt, Anhörung, Bekanntgabe, Datenschutz.','Wie läuft ein Verwaltungsverfahren und was ist formell zu beachten?','<p>Das Verwaltungsverfahren ist im SGB X geregelt. Entscheidend sind Beratungs- und Auskunftspflichten, der Antrag, die Anhörung, die Bestimmtheit und Begründung des Verwaltungsakts und seine wirksame Bekanntgabe an den Betreuer.</p>');
TI('t_zugang','zugang','SGB II: Zugang und Bedarfsgemeinschaft','§§ 7–9 SGB II','Reform 2026, Erwerbsfähigkeit, Ausschlüsse, Bedarfsgemeinschaft.','Wer erhält Grundsicherungsgeld und wer gehört zur Bedarfsgemeinschaft?','<p>Leistungsberechtigt sind erwerbsfähige hilfebedürftige Personen und die Mitglieder ihrer Bedarfsgemeinschaft. Seit 1. Juli 2026 gilt die umgestaltete Grundsicherung (Grundsicherungsgeld).</p>');
TI('t_leist','leist','SGB II: Leistungen','§§ 19–29 SGB II','Regelbedarf, Mehrbedarfe, Unterkunft, Kooperationsplan.','Welche Bedarfe werden gedeckt und wie wird die Unterkunft behandelt?','<p>Das Grundsicherungsgeld deckt Regelbedarf, Mehrbedarfe sowie Kosten für Unterkunft und Heizung; hinzu kommen Bildung und Teilhabe sowie Kooperation und Mitwirkung am Arbeitsmarkt.</p>');
TI('t_eink','eink','Einkommen und Vermögen (SGB II)','§§ 11–12 SGB II','Zuflussprinzip, anrechenbares Einkommen, Freibeträge, Vermögen nach neuem Recht.','Was wird angerechnet, was ist geschützt?','<p>Entscheidend ist der Zeitpunkt des Zuflusses. Einkommen wird bereinigt, Vermögen seit 1. Juli 2026 ohne Karenzzeit, aber mit altersabhängigen Freibeträgen berücksichtigt.</p>');
TI('t_sozhilfe','sozhilfe','Sozialhilfe (SGB XII)','SGB XII','Abgrenzung, Grundsicherung im Alter und bei Erwerbsminderung, Bedarfe, Einkommen, Vermögen.','Wann greift das SGB XII statt des SGB II?','<p>Nicht Erwerbsfähige und Personen ab der Altersgrenze erhalten Leistungen nach dem SGB XII. Es gilt der Nachrang der Sozialhilfe (§ 2 SGB XII).</p>');
TI('t_entsch','entsch','Soziale Entschädigung (SGB XIV)','§§ 1–30 SGB XIV','Entschädigung bei Gewalttaten und anderen Schädigungen.','Wann besteht ein Anspruch auf Soziale Entschädigung?','<p>Das SGB XIV bündelt die Soziale Entschädigung; typische Leistungen sind Schnelle Hilfen, Heilbehandlung und Entschädigungszahlungen.</p>');
TI('t_kv','kv','Krankenversicherung (SGB V)','SGB V','Versicherungsschutz, Leistungen, Krankengeld, Zuzahlungen.','Ist der Betreute versichert und was leistet die Kasse?','<p>Die Krankenversicherung sichert Krankheit und Arbeitsunfähigkeit ab; Leistungen und Fristen entscheiden oft über den Erfolg von Anträgen.</p>');
TI('t_rv','rv','Rentenversicherung (SGB VI)','SGB VI','Erwerbsminderungsrente, Altersrente, Rentenbeginn.','Welche Rente kommt in Betracht und wann beginnt sie?','<p>Die Rentenversicherung sichert Alter und Erwerbsminderung; ihre Feststellungen wirken auf SGB II und SGB XII.</p>');
TI('t_pv','pv','Pflegeversicherung (SGB XI)','SGB XI','Pflegegrade, Antrag, Leistungen.','Wie wird der Pflegegrad bestimmt und was zahlt die Pflegekasse?','<p>Die Pflegeversicherung leistet nach Pflegegraden 1 bis 5; der Antrag wirkt ab Antragstellung.</p>');
TI('t_mitwirkung','mitwirkung','Mitwirkung und Korrektur von Bescheiden','§§ 60–67 SGB I, §§ 44–50 SGB X','Mitwirkungspflichten, Versagung, Überprüfung, Aufhebung, Erstattung.','Was muss mitgewirkt werden und wie werden Bescheide korrigiert?','<p>Mitwirkungspflichten haben Grenzen; Versagungen und Aufhebungen sind nur unter formellen Voraussetzungen rechtmäßig und lassen sich überprüfen.</p>');
TI('t_rechtsschutz','rechtsschutz','Rechtsschutz','SGG','Widerspruch, Klage, Eilverfahren, Fristen, Pfändungsschutz.','Welche Frist läuft, welcher Rechtsbehelf passt?','<p>Fristen entscheiden: Widerspruch und Klage je ein Monat; bei Eilbedürftigkeit einstweiliger Rechtsschutz.</p>');
TI('t_faelle','faelle','Fälle und Übungen','Fälle 1.1–10.4','Alle Fälle des Skripts mit Lösungshinweisen.','Wende das Gelernte in Fällen an.','<p>Alle Fälle der zehn Einheiten, jeweils mit Lösungshinweisen zum Aufklappen. Wo das Skript keine Lösung enthielt, sind die Hinweise aus den Kernsätzen und Normen entwickelt.</p>');

function lev1(a,b){ // true, wenn Editierabstand <= 1
  if(a===b)return true;const la=a.length,lb=b.length;if(Math.abs(la-lb)>1)return false;
  let i=0,j=0,e=0;while(i<la&&j<lb){if(a[i]===b[j]){i++;j++;continue;}if(++e>1)return false;if(la>lb)i++;else if(lb>la)j++;else{i++;j++;}}
  return e+(la-i)+(lb-j)<=1;
}
function parseQ(q){
  const nums=[];
  const rest=q.replace(/§+\s*(\d{2,4})(?:\s*[-–]\s*(\d{2,4}))?|\b(\d{2,4})(?:\s*[-–]\s*(\d{2,4}))?\b/g,(m,a,b,c,d)=>{const x=+(a||c),y=+(b||d||a||c);nums.push([Math.min(x,y),Math.max(x,y)]);return ' ';});
  const words=fold(rest).split(/[^a-z0-9]+/).filter(w=>w.length>=2);
  return {nums,words,raw:q};
}
const tokRe=t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/a/g,'(?:a|ä|ae)').replace(/o/g,'(?:o|ö|oe)').replace(/u/g,'(?:u|ü|ue)').replace(/ss/g,'(?:ss|ß)');
function buildHl(){
  hlRe=hlTest=null;if(!pq)return;
  const toks=[...pq.words.map(tokRe),...pq.nums.flatMap(([x,y])=>y-x<=1?[String(x),String(y)]:[String(x)])];
  const uniq=[...new Set(toks)].filter(Boolean);if(!uniq.length)return;
  const src=uniq.sort((a,b)=>b.length-a.length).join('|');
  hlRe=new RegExp(src,'gi');hlTest=new RegExp(src,'i');
}
function hlText(t){
  if(!hlRe)return esc(t);let out='',last=0;
  t.replace(hlRe,(m,...a)=>{const i=a[a.length-2];out+=esc(t.slice(last,i))+'<mark>'+esc(m)+'</mark>';last=i+m.length;return m;});
  return out+esc(t.slice(last));
}
function score(n){
  if(!pq)return 1;let s=0;
  for(const [x,y] of pq.nums){
    if(n.nums.some(v=>v>=x&&v<=y)){s+=100;if(n.nums.length===1&&n.nums[0]===x)s+=60;if(hasKids(n.id))s-=30;}
    else if(n.tB.includes(String(x))||n.tF.includes(String(x)))s+=2;
    else return 0;
  }
  for(const w of pq.words){
    let ws=0;
    if(n.tTitle.includes(w)){ws+=10;if(n.tTitle.startsWith(w))ws+=4;}
    if(n.tP.includes(w))ws+=6;
    if(n.tSum.includes(w))ws+=5;
    if(n.tF.includes(w))ws+=3;
    if(n.tQ.includes(w))ws+=2;
    if(n.tB.includes(w))ws+=1;
    if(!ws&&w.length>=5){for(const x of n.words){if(lev1(w,x)){ws=1;break;}}}
    if(!ws)return 0;
    s+=ws;
  }
  return s||1;
}
function filterOk(n){
  if(F.themes.size&&!F.themes.has(n.th))return false;
  if(F.src.size&&!F.src.has(srcOf(n)))return false;
  if(F.stat==='open'&&learned.has(n.id))return false;
  if(F.stat==='done'&&!learned.has(n.id))return false;
  if(F.stat==='fav'&&!fav.has(n.id))return false;
  if(F.stat==='quiz'&&!n.q)return false;
  return true;
}

const KEY={};
function addKey(k,id){if(!KEY[k])KEY[k]=id;}
NODES.forEach(n=>{if(n.p==='Fall')return;(n.k||[]).forEach(k=>addKey(k,n.id));});
NODES.forEach(n=>{ // Zusatz: Schlüssel aus der Paragrafenangabe ableiten

  const re=/(§§?|Art\.)\s*([0-9a-z ,–-]+?)\s+(SGB [IVX]+|GG|SGG|BGB)\b/g;let m;
  while((m=re.exec(n.p))){const bk=m[3];m[2].split(/\s*,\s*/).forEach(part=>{const r=part.split(/\s*[–-]\s*/);if(r.length===2&&/^\d+$/.test(r[0])&&/^\d+$/.test(r[1])&&+r[1]-+r[0]<12){for(let x=+r[0];x<=+r[1];x++)addKey(bk+'|'+x,n.id);}else r.forEach(x=>{if(/^\d+[a-z]?$/.test(x))addKey(bk+'|'+x,n.id);});});}
});
const BOOKS='SGB\\s+[IVX]+|SGG|BGB|GG|ZPO|WoGG';
const SLUG={'SGB I':'sgb_1','SGB II':'sgb_2','SGB III':'sgb_3','SGB IV':'sgb_4','SGB V':'sgb_5','SGB VI':'sgb_6','SGB VII':'sgb_7','SGB VIII':'sgb_8','SGB IX':'sgb_9','SGB X':'sgb_10','SGB XI':'sgb_11','SGB XII':'sgb_12','SGB XIV':'sgb_14','SGG':'sgg','BGB':'bgb','GG':'gg','ZPO':'zpo','WoGG':'wogg'};
function extHref(bk,num){const s=SLUG[bk];if(!s)return null;return 'https://www.gesetze-im-internet.de/'+s+'/'+(bk==='GG'?'art_':'__')+num+'.html';}
function linkNum(bk,num,txt,cur){
  const id=KEY[bk+'|'+num];
  if(id&&id!==cur)return `<a data-go="${id}" role="button" tabindex="0" title="Zur Erläuterung">${txt}</a>`;
  if(id===cur)return txt;
  const h=extHref(bk,num);return h?`<a class="ext" href="${h}" target="_blank" rel="noopener" title="Gesetzestext (gesetze-im-internet.de)">${txt}</a>`:txt;
}
function autolinkText(t,cur,dflt){
  t=t.replace(new RegExp('(§§?\\s*)((?:\\d+[a-z]?)(?:\\s*(?:Abs\\.|S\\.|Satz|Nr\\.)\\s*\\d+[a-z]?)*(?:\\s*(?:,|und|bis|–|-)\\s*\\d+[a-z]?(?:\\s*(?:Abs\\.|S\\.|Satz|Nr\\.)\\s*\\d+[a-z]?)*)*)(?:\\s+('+BOOKS+')(?![A-Za-z]))?','g'),(m,pre,list,bk)=>{
    if(!bk&&!dflt)return m;
    const bkn=(bk||dflt).replace(/\s+/g,' ');
    const out=list.split(/(\d+[a-z]?)/).map((part,i,arr)=>{
      if(i%2===0)return part;
      const prev=arr[i-1];if(/(Abs\.|S\.|Satz|Nr\.)\s*$/.test(prev))return part;
      return linkNum(bkn,part,part,cur);
    }).join('');
    return pre+out+(bk?' '+bk:'')+(list.match(/\s+$/)?'':'');});
  t=t.replace(/(Art\.\s*)(\d+[a-z]?)((?:\s*Abs\.\s*\d+)?\s+GG)\b/g,(m,pre,num,post)=>pre+linkNum('GG',num,num,cur)+post);
  t=t.replace(/\b(Abschlussfall|Fall)\s+(\d+)\.(\d+)/g,(m,w,a,b)=>{const id='f'+a+'_'+b;return byId[id]&&id!==cur?`<a data-go="${id}" role="button" tabindex="0" title="Zum Fall">${m}</a>`:m;});
  t=t.replace(/\bEinheit\s+(\d+)\b/g,(m,a)=>{const id='e'+a;return byId[id]&&id!==cur?`<a data-go="${id}" role="button" tabindex="0" title="Zur Einheit">${m}</a>`:m;});
  return t;
}
const SRCBOOK={SGBI:'SGB I',SGBII:'SGB II',SGBV:'SGB V',SGBVI:'SGB VI',SGBX:'SGB X',SGBXI:'SGB XI',SGBXII:'SGB XII',SGBXIV:'SGB XIV',SGG:'SGG',GG:'GG'};
function autolink(html,cur){
  const cn=byId[cur],dflt=(cn&&cn.p!=='Fall'&&SRCBOOK[cn.src])||null;let depthA=0;
  return html.split(/(<[^>]+>)/).map(tok=>{
    if(tok[0]==='<'){if(/^<a[\s>]/i.test(tok))depthA++;else if(/^<\/a>/i.test(tok))depthA=Math.max(0,depthA-1);return tok;}
    return depthA?tok:autolinkText(tok,cur,dflt);
  }).join('');
}

function orderIds(){const seen=new Set(),out=[];MODS.forEach(m=>CONTENT.filter(n=>n.m.includes(m.n)).forEach(n=>{if(!seen.has(n.id)){seen.add(n.id);out.push(n.id);}}));CONTENT.forEach(n=>{if(!seen.has(n.id)){seen.add(n.id);out.push(n.id);}});return out;}
function nextUnlearned(from){const o=orderIds(),i=from?o.indexOf(from):-1;for(let k=1;k<=o.length;k++){const id=o[(i+k+o.length)%o.length];if(!learned.has(id))return id;}return null;}

  renderLeft();renderDetail(id);
  try{history.replaceState(null,'','#'+id);}catch(e){}
  if(scroll){const el=document.querySelector('#tree [data-id="'+id+'"]');if(el)el.scrollIntoView({block:'nearest'});}
}
$('tree').addEventListener('click',e=>{
  const row=e.target.closest('[data-id]');if(!row)return;const id=row.dataset.id;
  if(e.target.closest('[data-caret="1"]')){tog(expanded,id);renderLeft();return;}
  if(hasKids(id)&&view==='tree'&&!query){if(sel===id)tog(expanded,id);else expanded.add(id);}
  select(id,false);
});
$('tree').addEventListener('keydown',e=>{
  const row=e.target.closest('[data-id]');if(!row)return;const id=row.dataset.id;
  const focusId=i=>{const el=document.querySelector('#tree [data-id="'+i+'"]');if(el)el.focus();};
  if(e.key==='Enter'||e.key===' '){e.preventDefault();row.click();setTimeout(()=>focusId(id),0);}
  else if(e.key==='ArrowRight'&&hasKids(id)){expanded.add(id);renderLeft();focusId(id);}
  else if(e.key==='ArrowLeft'){expanded.delete(id);renderLeft();focusId(id);}
  else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const rows=[...document.querySelectorAll('#tree [data-id]')];const i=rows.indexOf(row)+(e.key==='ArrowDown'?1:-1);if(rows[i])rows[i].focus();}
});
$('detail').addEventListener('click',e=>{
  const sc=e.target.closest('[data-sc]');if(sc){const el=document.getElementById(sc.dataset.sc);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return;}
  const ld=e.target.closest('[data-lid]');if(ld){const id=ld.dataset.lid;tog(learned,id);saveSets();renderLeft();renderDetail(sel,true);toast(learned.has(id)?'Als gelernt markiert':'Markierung entfernt');return;}
  const g=e.target.closest('[data-go]');if(g){select(g.dataset.go,true);return;}
  const th=e.target.closest('[data-th]');if(th){F.themes.clear();F.themes.add(th.dataset.th);refresh();return;}
  const a=e.target.closest('[data-act]');if(!a)return;
  if(a.dataset.act==='learn'){tog(learned,sel);saveSets();renderLeft();renderDetail(sel,true);toast(learned.has(sel)?'Als gelernt markiert':'Markierung entfernt');}
  if(a.dataset.act==='fav'){tog(fav,sel);saveSets();renderLeft();renderDetail(sel,true);toast(fav.has(sel)?'Gemerkt':'Merkung entfernt');}
  if(a.dataset.act==='rev'){const q=a.closest('.quiz');q.classList.toggle('open');a.textContent=q.classList.contains('open')?'Antwort verbergen':'Antwort zeigen';}
});
$('detail').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-go],a[data-go]')){e.preventDefault();select(e.target.dataset.go,true);}});
$('expAll').onclick=()=>{view='tree';NODES.forEach(n=>{if(hasKids(n.id))expanded.add(n.id);});renderLeft();};
$('colAll').onclick=()=>{view='tree';expanded=new Set(['root']);renderLeft();};
$('vTree').onclick=()=>{view='tree';LS.set('m8-view','tree');renderLeft();};
$('vList').onclick=()=>{view='list';LS.set('m8-view','list');renderLeft();};

/* Suche */
let qt=null;
$('q').addEventListener('input',e=>{
  clearTimeout(qt);qt=setTimeout(()=>{
    query=e.target.value.trim();pq=query?parseQ(query):null;
    if(pq&&!pq.nums.length&&!pq.words.length){pq=null;query='';}
    buildHl();$('qclr').hidden=!query;$('kbd').hidden=!!query;refresh();
  },90);
});
function clearSearch(){$('q').value='';query='';pq=null;buildHl();$('qclr').hidden=true;$('kbd').hidden=false;refresh();}
$('qclr').onclick=()=>{clearSearch();$('q').focus();};
$('q').addEventListener('keydown',e=>{
  if(e.key==='Escape'){clearSearch();$('q').blur();}
  if(e.key==='Enter'){const f=document.querySelector('#tree .res');if(f){select(f.dataset.id,false);}}
  if(e.key==='ArrowDown'){const f=document.querySelector('#tree [data-id]');if(f){e.preventDefault();f.focus();}}
});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!/^(INPUT|TEXTAREA)$/.test((e.target.tagName||''))){e.preventDefault();$('q').focus();$('q').select();}
});


document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const tg=e.target,tn=(tg&&tg.tagName)||'';
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(tn)||(tg&&tg.isContentEditable))return;
  if(e.key==='t'||e.key==='T'){e.preventDefault();toggleFilters();}
  else if(e.key==='b'||e.key==='B'){e.preventDefault();setCollapsed(!mainEl.classList.contains('collapsed'));}
});
function toggleFilters(){
  const f=document.querySelector('.filters');
  const mob=window.matchMedia&&window.matchMedia('(max-width:700px)').matches;
  if(mob){const o=!f.classList.contains('open');f.classList.toggle('open',o);f.classList.remove('off');$('fToggle').setAttribute('aria-expanded',String(o));toast(o?'Filter eingeblendet':'Filter ausgeblendet');}
  else{const off=f.classList.toggle('off');LS.set('m8-foff',off?'1':'0');toast(off?'Themenleiste ausgeblendet (T)':'Themenleiste eingeblendet (T)');}
}

/* Spalte ausblenden und Breite */
const mainEl=$('main'),split=$('split');
function setLW(px){const w=Math.round(Math.max(260,Math.min(px,mainEl.clientWidth-360)));mainEl.style.setProperty('--lw',w+'px');return w;}
function setCollapsed(c){mainEl.classList.toggle('collapsed',c);const t=$('toggleTree');t.setAttribute('aria-pressed',String(!c));t.textContent=c?'☰ Baum einblenden':'☰ Baum ausblenden';LS.set('m8-collapsed',c?'1':'0');}
$('toggleTree').onclick=()=>setCollapsed(!mainEl.classList.contains('collapsed'));
$('hideTree').onclick=()=>setCollapsed(true);
let dragging=false;
split.addEventListener('pointerdown',e=>{dragging=true;split.setPointerCapture(e.pointerId);split.classList.add('on');document.body.classList.add('resizing');});
split.addEventListener('pointermove',e=>{if(dragging)setLW(e.clientX-mainEl.getBoundingClientRect().left-6);});
const endDrag=()=>{if(!dragging)return;dragging=false;split.classList.remove('on');document.body.classList.remove('resizing');const v=parseInt(mainEl.style.getPropertyValue('--lw'));if(v)LS.set('m8-lw',String(v));};
split.addEventListener('pointerup',endDrag);split.addEventListener('pointercancel',endDrag);
split.addEventListener('dblclick',()=>{mainEl.style.removeProperty('--lw');LS.set('m8-lw','');});
split.addEventListener('keydown',e=>{if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;e.preventDefault();const cur=document.querySelector('.pane.tree').getBoundingClientRect().width;LS.set('m8-lw',String(setLW(cur+(e.key==='ArrowRight'?24:-24))));});

/* Hell oder dunkel */
$('themeBtn').onclick=()=>{
  const r=document.documentElement,cur=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const nx=cur==='dark'?'light':'dark';r.setAttribute('data-theme',nx);LS.set('m8-theme',nx);
};

/* Start */
buildFilters();
{const t=LS.get('m8-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);
 const w=parseInt(LS.get('m8-lw'));if(w)setLW(w);if(LS.get('m8-collapsed')==='1')setCollapsed(true);if(LS.get('m8-foff')==='1')document.querySelector('.filters').classList.add('off');
 if(LS.get('m8-view')==='list')view='list';}
expanded=new Set(['root']);
let start='root';try{const h=(location.hash||'').slice(1);if(h&&byId[h])start=h;}catch(e){}
sel=start;parentsOf(start).forEach(p=>expanded.add(p));
renderLeft();renderDetail(start);
</script>
