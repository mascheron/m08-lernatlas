<details><summary>Lösungshinweise</summary><ol><li><b>Ja:</b> psychische Gewalttat, <a data-go="n_sgb14_13">§ 13 Abs. 1 Nr. 2, Abs. 2</a> – Nachstellung nach § 238 Abs. 2 und 3 StGB ist ein Regelbeispiel. Kausalität: Vermutung bei psychischen Störungen (§ 4 Abs. 5).</li><li>Das schädigende Ereignis kann ein <b>wiederkehrendes oder über längere Zeit einwirkendes</b> Ereignis sein (<a data-go="n_sgb14_1">§ 1 Abs. 3</a>); ein einzelnes Datum ist nicht erforderlich. Für den Antrag Zeitraum und Verlauf darstellen (Jahresfrist bezogen auf das Ereignis; Verhinderung wegen Erkrankung vortragen).</li></ol></details>`,
 rel:['n_sgb14_13','n_sgb14_4','n_sgb14_1'],l:[]});
N('f2_4','t_faelle','Fall 2.4: Der Streit vor der Kneipe',{p:'Fall',m:[2],src:'SGBXIV',sum:'Ausschluss bei vorwerfbarer Verursachung und fehlende Mitwirkung bei der Aufklärung.',
 b:`<h4>Sachverhalt</h4><p>Herr V., 47 Jahre, alkoholabhängig, beleidigt vor einer Gaststätte einen anderen Gast, stößt ihn und erhält einen Faustschlag mit Kieferbruch. Er will nicht, dass „die Polizei sich einmischt“, und verweigert Angaben zum ihm bekannten Täter.</p>
<h4>Fragen</h4><ol><li>Ist ein Anspruch nach dem SGB XIV ausgeschlossen?</li><li>Wie gehen Sie mit der Weigerung um?</li></ol>
<details><summary>Lösungshinweise</summary><ol><li>Möglich nach <a data-go="n_sgb14_13">§ 16</a> (vorwerfbare Verursachung) – es kommt auf Provokation, Verhältnismäßigkeit und Verschulden an; Beleidigung und Stoßen allein rechtfertigen den Faustschlag nicht zwingend. Zudem Versagung nach § 17 Abs. 2 wegen fehlender Aufklärung möglich („kann“, Ermessen). Einzelfallprüfung; Antrag trotzdem prüfen.</li><li>Willen respektieren, <b>Folgen verständlich erklären</b> (Versagung bei fehlender Aufklärung), Gründe erfragen (Angst, Misstrauen), Alternativen aufzeigen (Anzeige durch Dritte, Beratung, Opferhilfe), Entscheidung dokumentieren; kein Zwang (§ 1821 BGB).</li></ol></details>`,
 rel:['n_sgb14_13','n_mitw'],l:[]});

/* ===== Einheit 3 ===== */
EH[3]={z:'Wie kommt man an die Leistung? Beratung, Auskunft, Antrag, Handlungsfähigkeit betreuter Menschen, Grundsätze des Verwaltungsverfahrens und der Verwaltungsakt samt Bekanntgabe und Fristberechnung.',
 ks:['Beratung ist ein Rechtsanspruch; Beratungsfehler können über den Herstellungsanspruch korrigiert werden.','Anträge sind formfrei und können bei jeder Gemeinde und jedem Sozialleistungsträger fristwahrend gestellt werden.','Die Betreuung beseitigt die Handlungsfähigkeit nicht; nur Einwilligungsvorbehalt oder Geschäftsunfähigkeit schränken sie ein.','Ein Verwaltungsakt ist auch dann wirksam, wenn er falsch ist; er muss rechtzeitig angefochten werden.','Fristen beginnen mit der Bekanntgabe, nicht mit dem Lesen.'],
 kq:[['Worin unterscheiden sich Beratung und Auskunft?','Beratung durch den zuständigen Träger über die eigenen Rechte und Pflichten (§ 14 SGB I); Auskunft durch die Auskunftsstellen über Zuständigkeiten und Sach- und Rechtsfragen (§ 15 SGB I).'],
 ['Ein betreuter Mensch stellt beim Rentenversicherungsträger einen Antrag auf Grundsicherung im Alter. Was geschieht?','Der Rentenversicherungsträger nimmt den Antrag entgegen und leitet ihn unverzüglich an den Sozialhilfeträger weiter; der Antrag gilt als am Eingangstag gestellt (§ 16 Abs. 1, 2 SGB I).'],
 ['Welche drei Voraussetzungen hat der sozialrechtliche Herstellungsanspruch?','Pflichtverletzung des Trägers (meist Beratungsfehler), dadurch verursachter Nachteil, Ausgleich durch zulässige Amtshandlung möglich.'],
 ['Ist eine Betreuerin verpflichtet, ein Antragsformular zu verwenden?','Nein. Formulare sollen benutzt werden (§ 60 Abs. 2 SGB I), der Antrag ist aber auch formlos wirksam.'],
 ['Ein Bescheid wird am Freitag, 27. November 2026, zur Post gegeben. Wann endet die Widerspruchsfrist?','Bekanntgabe am Dienstag, 1. Dezember 2026 (vierter Tag, § 37 Abs. 2 SGB X). Fristende nach Monatsberechnung wäre Freitag, 1. Januar 2027 – ein Feiertag; die Frist endet am Montag, 4. Januar 2027 (§ 64 Abs. 3 SGG).'],
 ['Wann kann ein betreuter Mensch keinen wirksamen Widerspruch einlegen?','Bei Geschäftsunfähigkeit oder wenn ein Einwilligungsvorbehalt den Bereich erfasst und keine Einwilligung vorliegt; ferner nach einer Ausschließlichkeitserklärung der Betreuerin oder des Betreuers.']]};

N('n_beratung','t_verfahren','Aufklärung, Beratung und Auskunft',{p:'§§ 13–15 SGB I',k:['SGB I|13','SGB I|14','SGB I|15'],m:[3],src:'SGBI',sum:'Dreistufenmodell der Information; Beratung ist ein Rechtsanspruch, bei Fehlern greift der Herstellungsanspruch.',
 b:`<div class="tw"><table><thead><tr><th>Stufe</th><th>Norm</th><th>Adressat</th><th>Inhalt</th></tr></thead><tbody>
<tr><td>Aufklärung</td><td>§ 13 SGB I</td><td>Allgemeinheit</td><td>Allgemeine Information über Rechte und Pflichten (Broschüren, Internet)</td></tr>
<tr><td>Beratung</td><td>§ 14 SGB I</td><td>Einzelne Person</td><td>Individuelle Beratung über eigene Rechte und Pflichten durch den zuständigen Träger</td></tr>
<tr><td>Auskunft</td><td>§ 15 SGB I</td><td>Einzelne Person</td><td>Benennung des zuständigen Trägers, Auskunft über Sach- und Rechtsfragen durch Landesstellen sowie Kranken- und Pflegekassen</td></tr></tbody></table></div>
<p><b>§ 14 SGB I:</b> Jeder hat Anspruch auf Beratung über seine Rechte und Pflichten nach dem SGB; zuständig sind die Leistungsträger, denen gegenüber die Rechte geltend zu machen oder die Pflichten zu erfüllen sind. Der Anspruch ist ein echter Rechtsanspruch; die Beratung muss <b>richtig, vollständig und verständlich</b> sein. Aus § 14 in Verbindung mit § 2 Abs. 2 und § 17 Abs. 1 SGB I leitet die Rechtsprechung eine Pflicht zur <b>Spontanberatung</b> ab: Drängt sich bei konkretem Anlass eine naheliegende Gestaltungsmöglichkeit auf, muss der Träger auch ungefragt hinweisen.</p>
<h4>Praxis für Betreuerinnen und Betreuer</h4>
<ul><li>Beratung verlangen, möglichst schriftlich dokumentiert.</li><li>Verständliche Form: § 17 Abs. 1 Nr. 4 und Abs. 2 SGB I verpflichten zu barrierefreier Kommunikation einschließlich Gebärdensprache.</li><li>Wichtige telefonische Auskünfte mit Datum, Uhrzeit, Gesprächspartner und Inhalt in der Betreuungsakte vermerken.</li></ul>`,
 f:'Beratung (zuständiger Träger, eigene Rechte) ≠ Auskunft (Zuständigkeit, Sach- und Rechtsfragen). Dokumentation von Auskünften.',
 q:['Was folgt aus der „Spontanberatung“?','Drängt sich bei einem konkreten Anlass eine naheliegende Gestaltungsmöglichkeit auf, muss der Träger auch ungefragt darauf hinweisen (§ 14 SGB I i. V. m. § 2 Abs. 2, § 17 Abs. 1 SGB I); Verletzung kann einen Herstellungsanspruch begründen.'],
 rel:['n_herstellung','n_antrag','n_gg3'],l:LK(['SGB I',13],['SGB I',14],['SGB I',15],['SGB I',17])});
N('n_herstellung','t_verfahren','Sozialrechtlicher Herstellungsanspruch',{p:'Richterrecht (BSG)',m:[3],src:'SGBI',sum:'Wer wegen eines Beratungsfehlers einen Nachteil erleidet, wird so gestellt, als hätte der Träger richtig gehandelt.',
 b:`<p>Der Herstellungsanspruch ist nicht ausdrücklich geregelt, sondern von der Rechtsprechung des Bundessozialgerichts entwickelt. <b>Drei Voraussetzungen:</b></p>
<ol><li>Pflichtverletzung eines Sozialleistungsträgers, typischerweise unterlassene oder fehlerhafte Beratung,</li><li>ein dadurch verursachter sozialrechtlicher Nachteil (z. B. verspäteter Antrag),</li><li>der Nachteil lässt sich durch eine zulässige Amtshandlung ausgleichen.</li></ol>
<p><b>Rechtsfolge:</b> Der Betroffene wird so gestellt, als hätte der Träger richtig gehandelt – z. B. durch Fiktion eines früheren Antrags. Der Anspruch hilft <b>nicht</b>, wenn tatsächliche Voraussetzungen fehlen, die nicht durch Verwaltungshandeln ersetzt werden können (etwa eine tatsächlich nicht ausgeübte Beschäftigung).</p>`,
 f:'Drei Voraussetzungen auswendig; Gegenbeispiel: fehlende tatsächliche Voraussetzungen.',
 q:['Wann hilft der Herstellungsanspruch nicht?','Wenn tatsächliche Voraussetzungen fehlen, die nicht durch eine zulässige Verwaltungshandlung ersetzt werden können, etwa eine tatsächlich nicht erzielte Beschäftigung.'],
 rel:['n_beratung','n_antrag','f3_1','f3_2'],l:[]});
N('n_antrag','t_verfahren','Der Antrag',{p:'§ 16 SGB I',k:['SGB I|16','SGB I|36a','SGB II|37','SGB XII|44','SGB XII|18','SGB VI|99','SGB XI|33'],m:[3],src:'SGBI',sum:'Formfrei, bei jedem Träger und jeder Gemeinde fristwahrend möglich; Bedeutung und Rückwirkung unterscheiden sich je Leistungsgesetz.',
 b:`<p><b>§ 16 Abs. 1 SGB I:</b> Anträge sind beim zuständigen Träger zu stellen, werden aber auch von allen anderen Leistungsträgern und allen Gemeinden entgegengenommen. <b>Abs. 2:</b> Anträge bei unzuständigen Stellen sind <b>unverzüglich weiterzuleiten</b>; ist die Leistung antragsabhängig, gilt der Antrag als zum Zeitpunkt des Eingangs bei einer dieser Stellen gestellt. <b>Abs. 3:</b> Die Träger müssen darauf hinwirken, dass klare und sachdienliche Anträge gestellt und unvollständige Angaben ergänzt werden.</p>
<p>Der Antrag ist eine einseitige, empfangsbedürftige öffentlich-rechtliche Willenserklärung und <b>formfrei</b>; es genügt, dass erkennbar eine Sozialleistung begehrt wird. Formulare dienen der Sachverhaltsaufklärung (§ 60 Abs. 2 SGB I), sind aber keine Wirksamkeitsvoraussetzung. Anträge werden nach dem <b>Meistbegünstigungsprinzip</b> ausgelegt.</p>
<h4>Bedeutung des Antrags je Leistungsbereich</h4>
<div class="tw"><table><thead><tr><th>Leistungsbereich</th><th>Bedeutung</th><th>Norm</th></tr></thead><tbody>
<tr><td>SGB II</td><td>konstitutiv; wirkt auf den Ersten des Monats zurück</td><td>§ 37 SGB II</td></tr>
<tr><td>SGB XII Grundsicherung im Alter/bei Erwerbsminderung</td><td>konstitutiv; Wirkung auf den Ersten des Antragsmonats</td><td>§ 44 SGB XII</td></tr>
<tr><td>SGB XII Hilfe zum Lebensunterhalt</td><td>kein Antrag nötig; Kenntnis des Trägers genügt</td><td>§ 18 SGB XII</td></tr>
<tr><td>Gesetzliche Rentenversicherung</td><td>Antrag; bei Antrag nach Ablauf des dritten Kalendermonats nach Erfüllung der Voraussetzungen beginnt die Rente erst mit dem Antragsmonat</td><td>§ 99 SGB VI</td></tr>
<tr><td>Pflegeversicherung</td><td>Antrag; Leistungen ab Antragstellung, frühestens ab Vorliegen der Voraussetzungen</td><td>§ 33 SGB XI</td></tr></tbody></table></div>
<p><b>§ 37 SGB II:</b> Leistungen werden auf Antrag erbracht; Leistungen nach § 24 Abs. 1 und 3 und für Bedarfe nach § 28 Abs. 5 sind gesondert zu beantragen; für Zeiten vor der Antragstellung wird nicht geleistet, der Antrag auf Lebensunterhalt wirkt aber auf den Monatsersten zurück.</p>
<h4>Elektronische Kommunikation</h4>
<p>Nach § 36a SGB I zulässig, soweit der Empfänger einen Zugang eröffnet. Für zum Abruf bereitgestellte Verwaltungsakte (Online-Postfach) verlangt § 37 Abs. 2a SGB X die <b>Einwilligung</b> des Beteiligten.</p>`,
 f:'Typische Frage: Antrag beim falschen Träger – verloren? Nein: weiterleiten, Eingangsdatum zählt (§ 16 Abs. 2 SGB I). Rückwirkung: SGB II/XII auf den Monatsersten.',
 q:['Ein Antrag auf Grundsicherung wird bei der Gemeinde eingeworfen und liegt dort wochenlang. Was gilt?','Gemeinden müssen Anträge entgegennehmen und unverzüglich an den zuständigen Träger weiterleiten; der Antrag gilt als zum Zeitpunkt des Eingangs bei der Gemeinde gestellt (§ 16 Abs. 1, 2 SGB I). Der Antrag wirkt im SGB II auf den Monatsersten zurück (§ 37 SGB II).'],
 rel:['n_traeger','n_herstellung','n_handlung','f3_1','n_zugang'],l:LK(['SGB I',16],['SGB II',37],['SGB XII',44],['SGB VI',99],['SGB XI',33])});
N('n_handlung','t_verfahren','Handlungsfähigkeit und Vertretung betreuter Menschen',{p:'§ 36 SGB I, § 11 SGB X',k:['SGB I|36','SGB X|11','SGB X|13','BGB|1823','BGB|1825'],m:[3],src:'SGBX',sum:'Betreuung ändert die Handlungsfähigkeit nicht; Einwilligungsvorbehalt oder Geschäftsunfähigkeit schränken sie ein.',
 b:`<p>Nach <b>§ 11 Abs. 1 Nr. 1 SGB X</b> sind geschäftsfähige natürliche Personen handlungsfähig; <b>§ 36 SGB I</b> erweitert das: Wer das 15. Lebensjahr vollendet hat, kann Anträge stellen und verfolgen sowie Leistungen entgegennehmen.</p>
<h4>Betreute Menschen</h4>
<ul><li>Die Bestellung ändert an der Geschäftsfähigkeit nichts. Betreute bleiben grundsätzlich handlungsfähig: eigene Anträge, Widerspruch, Entgegennahme von Bescheiden.</li><li>Bei <b>Einwilligungsvorbehalt</b> (§ 1825 BGB) für den Bereich ist der betreute Mensch nur handlungsfähig, soweit er nach bürgerlichem Recht ohne Einwilligung handeln kann (§ 11 Abs. 2 SGB X).</li><li>Bei <b>Geschäftsunfähigkeit</b> (§ 104 Nr. 2 BGB) fehlt die Handlungsfähigkeit; dann handelt allein die Betreuerin bzw. der Betreuer.</li></ul>
<p>Die Betreuerin vertritt im Aufgabenkreis gerichtlich und außergerichtlich (§ 1823 BGB); Maßstab sind die Wünsche des Betreuten (§ 1821 Abs. 2–4 BGB), Vertretungsmacht nur soweit erforderlich (§ 1821 Abs. 1 Satz 2 BGB).</p>
<p><b>Doppelzuständigkeit:</b> Betreuter und Betreuer können nebeneinander handeln, auch widersprechend. Für das Gerichtsverfahren kann der Betreuer erklären, das Verfahren ausschließlich zu führen (§ 53 Abs. 2 ZPO); über § 11 Abs. 3 SGB X gilt das für das Verwaltungsverfahren entsprechend.</p>
<h4>Betreuer, Bevollmächtigte, Beistände</h4>
<div class="tw"><table><thead><tr><th></th><th>Betreuer</th><th>Bevollmächtigter</th><th>Beistand</th></tr></thead><tbody><tr><td>Grundlage</td><td>Gerichtlicher Beschluss, § 1823 BGB</td><td>Vollmacht, § 13 SGB X</td><td>§ 13 Abs. 4 SGB X</td></tr><tr><td>Nachweis</td><td>Betreuerausweis (§ 290 FamFG)</td><td>Schriftliche Vollmacht auf Verlangen</td><td>kein Nachweis</td></tr><tr><td>Behörde wendet sich an ihn?</td><td>im Aufgabenkreis als gesetzliche Vertretung</td><td>Ja (§ 13 Abs. 3 SGB X), wenn nicht unverzüglich widersprochen</td><td>Nein; Vortrag gilt als vom Beteiligten vorgebracht</td></tr></tbody></table></div>
<div class="mark"><b>Entscheidungsbaum:</b> Geschäftsfähig? Nein (§ 104 Nr. 2 BGB) → nur Betreuer handelt. Ja → Einwilligungsvorbehalt im Bereich? Nein → beide handlungsfähig (Doppelzuständigkeit); Ja → Betreute nur mit Einwilligung handlungsfähig.</div>`,
 f:'Wer handelt im Verfahren? Entscheidungsbaum: Geschäftsfähigkeit → Einwilligungsvorbehalt → Doppelzuständigkeit.',
 q:['Verliert ein betreuter Mensch durch die Bestellung eines Betreuers die Möglichkeit, Widerspruch einzulegen?','Nein. Die Betreuung ändert die Handlungsfähigkeit nicht. Sie fehlt nur bei Geschäftsunfähigkeit (§ 104 Nr. 2 BGB) oder – ohne Einwilligung – bei einem Einwilligungsvorbehalt im betreffenden Bereich (§ 11 Abs. 2 SGB X).'],
 rel:['n_bekanntgabe','n_antrag','f3_4','n_wid'],l:LK(['SGB I',36],['SGB X',11],['SGB X',13])});
N('n_grundsaetze','t_verfahren','Grundsätze des Verwaltungsverfahrens',{p:'§§ 9, 20, 21, 24, 25 SGB X',k:['SGB X|9','SGB X|20','SGB X|21','SGB X|25'],m:[3],src:'SGBX',sum:'Nichtförmlichkeit, Untersuchungsgrundsatz, Beweismittel, Anhörung, Akteneinsicht und Sozialgeheimnis.',
 b:`<div class="tw"><table><thead><tr><th>Grundsatz</th><th>Norm</th><th>Inhalt</th></tr></thead><tbody>
<tr><td>Nichtförmlichkeit</td><td>§ 9 SGB X</td><td>einfach, zweckmäßig und zügig</td></tr>
<tr><td>Untersuchungsgrundsatz</td><td>§ 20 SGB X</td><td>Ermittlung von Amts wegen, auch günstige Umstände</td></tr>
<tr><td>Beweismittel</td><td>§ 21 SGB X</td><td>Auskünfte, Urkunden, Sachverständige, Augenschein</td></tr>
<tr><td>Anhörung</td><td>§ 24 SGB X</td><td>vor belastendem Verwaltungsakt Gelegenheit zur Äußerung</td></tr>
<tr><td>Akteneinsicht</td><td>§ 25 SGB X</td><td>soweit zur Geltendmachung rechtlicher Interessen erforderlich</td></tr>
<tr><td>Sozialgeheimnis</td><td>§ 35 SGB I, §§ 67 ff. SGB X</td><td>Schutz der Sozialdaten</td></tr></tbody></table></div>`,
 f:'Amtsermittlung ≠ Entlastung von Mitwirkung (siehe Einheit 9).',rel:['n_anhoerung','n_datenschutz','n_mitw'],l:LK(['SGB X',9],['SGB X',20],['SGB X',21],['SGB X',25])});
N('n_anhoerung','t_verfahren','Anhörung',{p:'§ 24 SGB X',k:['SGB X|24','SGB X|41'],m:[3],src:'SGBX',sum:'Vor jedem belastenden Verwaltungsakt ist Gelegenheit zur Äußerung zu geben – das Anhörungsschreiben nie unbeantwortet lassen.',
 b:`<p><b>§ 24 Abs. 1 SGB X:</b> Bevor ein Verwaltungsakt erlassen wird, der in Rechte eines Beteiligten eingreift, ist diesem Gelegenheit zu geben, sich zu den entscheidungserheblichen Tatsachen zu äußern. Eine unterbliebene Anhörung kann bis zur letzten Tatsacheninstanz des sozialgerichtlichen Verfahrens <b>nachgeholt</b> werden (§ 41 Abs. 1 Nr. 3, Abs. 2 SGB X).</p>
<div class="mark"><b>Praxis:</b> Das Anhörungsschreiben ist die erste und oft beste Gelegenheit, eine Rückforderung oder Leistungsminderung abzuwenden. Es sollte nie unbeantwortet bleiben.</div>`,
 f:'Anhörung ≠ Verwaltungsakt; Heilung bis zur letzten Tatsacheninstanz möglich.',rel:['n_va','n_pflv','n_aufheb','f1_1'],l:LK(['SGB X',24],['SGB X',41])});
N('n_va','t_verfahren','Verwaltungsakt: Begriff, Form, Wirksamkeit',{p:'§§ 31–42 SGB X',k:['SGB X|31','SGB X|33','SGB X|35','SGB X|36','SGB X|39','SGB X|40','SGB X|42'],m:[3],src:'SGBX',sum:'Regelung eines Einzelfalls mit Außenwirkung; auch ein falscher Bescheid wird wirksam und bestandskräftig, wenn er nicht rechtzeitig angefochten wird.',
 b:`<p><b>§ 31 Satz 1 SGB X:</b> Verwaltungsakt ist jede Verfügung, Entscheidung oder andere hoheitliche Maßnahme, die eine Behörde zur Regelung eines Einzelfalles auf dem Gebiet des öffentlichen Rechts trifft und die auf unmittelbare Rechtswirkung nach außen gerichtet ist. <b>Kein</b> Verwaltungsakt sind bloße Informationsschreiben, Terminerinnerungen ohne Rechtsfolgenbelehrung oder Anhörungsschreiben. Dauerverwaltungsakte (Bewilligung laufender Leistungen) sind für §§ 45, 48 SGB X wichtig (Einheit 9).</p>
<h4>Formelle Anforderungen – Prüffragen</h4>
<div class="tw"><table><thead><tr><th>Anforderung</th><th>Norm</th><th>Prüffrage</th></tr></thead><tbody>
<tr><td>Bestimmtheit</td><td>§ 33 Abs. 1 SGB X</td><td>Wer erhält/schuldet was, in welcher Höhe, für welchen Zeitraum?</td></tr>
<tr><td>Form</td><td>§ 33 Abs. 2, 3 SGB X</td><td>Schriftlich, elektronisch, mündlich; Behörde erkennbar</td></tr>
<tr><td>Begründung</td><td>§ 35 SGB X</td><td>Wesentliche tatsächliche und rechtliche Gründe; bei Ermessen: Gesichtspunkte der Ermessensausübung</td></tr>
<tr><td>Rechtsbehelfsbelehrung</td><td>§ 36 SGB X, § 66 SGG</td><td>Widerspruch, Stelle, Form, Frist? Fehlt sie oder ist falsch: Jahresfrist</td></tr>
<tr><td>Bekanntgabe</td><td>§ 37 SGB X</td><td>Wann und wem gegenüber?</td></tr></tbody></table></div>
<h4>Wirksamkeit, Nichtigkeit, Heilung</h4>
<p>Wirksam mit Bekanntgabe (§ 39 Abs. 1). Auch ein <b>rechtswidriger</b> Verwaltungsakt bleibt wirksam, bis er aufgehoben wird; nur ein <b>nichtiger</b> ist unwirksam (§ 39 Abs. 3, § 40). Verfahrens- und Formfehler können geheilt (§ 41) oder unbeachtlich (§ 42) sein.</p>
<div class="mark"><b>Wichtigster Merksatz der Einheit:</b> Ein falscher Bescheid wird bestandskräftig, wenn er nicht rechtzeitig angefochten wird.</div>`,
 f:'Formelle Prüfung eines Bescheids in fünf Punkten: Bestimmtheit, Form, Begründung, Rechtsbehelfsbelehrung, Bekanntgabe.',
 q:['Ist ein rechtswidriger Bescheid unwirksam?','Nein. Ein Verwaltungsakt wird mit Bekanntgabe wirksam und bleibt es, auch wenn er rechtswidrig ist, bis er aufgehoben wird; nur nichtige Verwaltungsakte sind unwirksam (§ 39 SGB X). Deshalb muss er rechtzeitig angefochten werden.'],
 rel:['n_bekanntgabe','n_wid','n_s35','f3_3'],l:LK(['SGB X',31],['SGB X',33],['SGB X',35],['SGB X',36],['SGB X',39]),});
N('n_s35','t_verfahren','Begründung und Rechtsbehelfsbelehrung',{p:'§§ 35, 36 SGB X',k:['SGB X|35','SGB X|36'],m:[3],src:'SGBX',sum:'Ein Bescheid muss seine wesentlichen Gründe nennen und über den Rechtsbehelf belehren.',
 b:`<p>Nach <b>§ 35 SGB X</b> sind die wesentlichen tatsächlichen und rechtlichen Gründe mitzuteilen; bei Ermessensentscheidungen auch die Gesichtspunkte der Ermessensausübung. <b>§ 36 SGB X</b> und <b>§ 66 SGG</b>: Die Rechtsbehelfsbelehrung muss Widerspruch, Stelle, Form und Frist nennen. Fehlt sie oder ist sie unrichtig, gilt die <b>Jahresfrist</b> (§ 66 Abs. 2 SGG). Siehe <a data-go="n_va">Verwaltungsakt</a> und <a data-go="n_wid">Widerspruch</a>.</p>`,
 f:'Fehlende Begründung ist ein Warnsignal (§ 31 SGB I); fehlende Belehrung verlängert die Frist auf ein Jahr.',rel:['n_va','n_s31','n_wid'],l:LK(['SGB X',35],['SGB X',36])});
N('n_bekanntgabe','t_verfahren','Bekanntgabe und Fristberechnung',{p:'§ 37 SGB X, § 64 SGG',k:['SGB X|37','SGG|64'],m:[3],src:'SGBX',sum:'Bescheid gilt am vierten Tag nach Aufgabe zur Post als bekannt gegeben; Fristen beginnen mit der Bekanntgabe, nicht mit dem Lesen.',
 b:`<p><b>§ 37 SGB X:</b> Ein Verwaltungsakt ist demjenigen bekannt zu geben, für den er bestimmt ist oder der von ihm betroffen wird; bei Bevollmächtigtem kann an diesen bekannt gegeben werden. Ein schriftlicher oder elektronisch übermittelter Verwaltungsakt gilt am <b>vierten Tag nach Aufgabe zur Post bzw. Absendung</b> als bekannt gegeben – nicht, wenn er nicht oder später zuging; <b>im Zweifel muss die Behörde den Zugang nachweisen</b>. Mit Einwilligung kann ein elektronischer Verwaltungsakt zum Abruf bereitgestellt werden (Abs. 2a): Bekanntgabe am vierten Tag nach Absendung der Benachrichtigung.</p>
<h4>Rechenbeispiel</h4>
<p>Bescheid am Donnerstag, 5. November 2026, zur Post → gilt am Montag, 9. November 2026 als bekannt gegeben → Widerspruchsfrist (ein Monat, § 84 Abs. 1 SGG) endet mit Ablauf des 9. Dezember 2026 (§ 64 SGG). Fällt das Fristende auf einen Samstag, Sonntag oder Feiertag, endet die Frist am nächsten Werktag (§ 64 Abs. 3 SGG).</p>
<h4>Bekanntgabe bei bestehender Betreuung</h4>
<p>Ist der betreute Mensch <b>geschäftsunfähig</b>, kann der Bescheid wirksam nur dem Betreuer bekannt gegeben werden. Ist er <b>handlungsfähig</b>, ist die Bekanntgabe an ihn selbst wirksam, auch wenn die Betreuung den Bereich umfasst – die Frist läuft dann ab dieser Bekanntgabe.</p>
<div class="mark"><b>Checkliste „Bescheid-Eingang“:</b> 1. Eingangsdatum vermerken, Umschlag aufbewahren. 2. Bekanntgabetag berechnen. 3. Fristende im Fristenkalender, Vorfrist eine Woche vorher. 4. Bescheid auf Bestimmtheit, Begründung, Berechnung, Belehrung prüfen. 5. Mit dem betreuten Menschen besprechen (§ 1821 BGB). 6. Im Zweifel fristwahrend Widerspruch einlegen, Begründung nachreichen.</div>`,
 f:'Rechenaufgaben zur Bekanntgabe (+3 Tage) und Fristende (Monat, Wochenende/Feiertag) sind prüfungsrelevant.',
 q:['Bescheid am Donnerstag, 5.11.2026, zur Post gegeben: Wann endet die Widerspruchsfrist?','Bekanntgabe am 9.11.2026 (vierter Tag); Fristende mit Ablauf des 9.12.2026 (§ 84 Abs. 1 SGG, § 64 SGG); bei Wochenende/Feiertag am nächsten Werktag.'],
 rel:['n_wid','n_handlung','n_va','f3_4'],l:LK(['SGB X',37],['SGG',64],['SGG',84])});
N('n_datenschutz','t_verfahren','Sozialdatenschutz',{p:'§ 35 SGB I, §§ 67 ff. SGB X',k:['SGB I|35'],m:[3],src:'SGBI',sum:'Sozialdaten dürfen nicht unbefugt verarbeitet werden; Weitergabe an Dritte braucht Rechtsgrundlage oder Einwilligung.',
 b:`<p><b>§ 35 Abs. 1 Satz 1 SGB I:</b> Jeder hat Anspruch darauf, dass seine Sozialdaten von den Leistungsträgern nicht unbefugt verarbeitet werden (Sozialgeheimnis).</p>
<ul><li>Der Betreuer erhält Auskunft über Sozialdaten als gesetzliche Vertretung im Rahmen des Aufgabenkreises.</li><li>Weitergabe an Dritte (Vermieter, Angehörige, Einrichtung) braucht Rechtsgrundlage oder Einwilligung; Entbindungen von der Schweigepflicht auf den konkreten Zweck beschränken.</li><li>Die Mitwirkungspflichten (§§ 60 ff. SGB I) gehen nicht weiter, als für die Leistung erforderlich (Einheit 9).</li></ul>`,
 f:'Entbindung von der Schweigepflicht zweckgebunden und eng formulieren.',rel:['n_mitw','n_grundsaetze'],l:LK(['SGB I',35])});

N('f3_1','t_faelle','Fall 3.1: Der Antrag im Briefkasten des Rathauses',{p:'Fall',m:[3],src:'SGBI',sum:'Formloser Antrag bei der Gemeinde, Weiterleitungspflicht und Rückwirkung.',
 b:`<h4>Sachverhalt</h4><p>Herr P., 58 Jahre, Dresden-Gorbitz, seit einem Schlaganfall im März halbseitig gelähmt, Betreuung für Vermögenssorge, Behördenangelegenheiten und Gesundheitssorge. Noch vor der Bestellung hat die Nachbarin am 28. April ein formloses Schreiben „Ich brauche Geld zum Leben, Herr P.“ in den Briefkasten des Ortsamts geworfen. Das Ortsamt hat es bis heute (3. Juni) nicht weitergegeben. Das Jobcenter sagt: „Leistungen gibt es erst ab Antragseingang bei uns, also ab Juni.“ Herr P. hat seit April kein Einkommen und kein Vermögen.</p>
<h4>Leitfragen</h4><ol><li>Wurde am 28. April ein Antrag gestellt?</li><li>Bedeutung des Eingangs bei der Gemeinde?</li><li>Was hätte das Ortsamt tun müssen, was kann die Betreuerin jetzt tun?</li></ol>
<details><summary>Lösungshinweise</summary><ol><li><b>Ja.</b> Der Antrag ist formfrei; erkennbar wird Geld zum Lebensunterhalt begehrt. Auslegung nach dem Meistbegünstigungsprinzip (SGB-II-Antrag). <a data-go="n_antrag">§ 16 SGB I</a>.</li><li>Gemeinden müssen Anträge entgegennehmen (§ 16 Abs. 1) und <b>unverzüglich weiterleiten</b> (Abs. 2); der Antrag gilt als am 28. April gestellt. Im SGB II wirkt der Antrag auf den Ersten des Antragsmonats zurück, hier den <b>1. April</b> (§ 37 Abs. 2 SGB II).</li><li>Das Ortsamt hätte sofort weiterleiten müssen. Jetzt: Weiterleitung verlangen, beim Jobcenter Leistungen ab 1. April beantragen und die Unterlagen (Eingangsnachweis, Zeugin Nachbarin) vorlegen; ggf. Herstellungsanspruch (<a data-go="n_herstellung">Pflichtverletzung</a>), Eilantrag bei akuter Notlage.</li></ol></details>`,
 rel:['n_antrag','n_herstellung','n_zugang'],l:[]});
N('f3_2','t_faelle','Fall 3.2: „Wir haben Ihnen doch eine Broschüre gegeben“',{p:'Fall',m:[3],src:'SGBI',sum:'Beratungspflicht, Herstellungsanspruch und Rentenantrag.',
 b:`<h4>Sachverhalt</h4><p>Frau L., 63 Jahre, bezieht Grundsicherungsgeld und ist seit Jahren schwerbehindert (GdB 60). 2025 wird ihr beim Jobcenter erklärt, sie müsse „bis zur Rente durchhalten“. Niemand weist sie auf eine mögliche Altersrente für schwerbehinderte Menschen und eine Rentenauskunft hin. Die Betreuerin erfährt dies erst jetzt.</p>
<details><summary>Lösungshinweise</summary><ol><li><b>Beratungspflicht:</b> Das Jobcenter hat keine allgemeine Pflicht zur Rentenberatung, muss aber auf naheliegende Gestaltungsmöglichkeiten hinweisen, zumal es nach § 12a SGB II vorrangige Leistungen einfordern kann. Rentenberatung selbst: Deutsche Rentenversicherung (§ 14 Satz 2 SGB I).</li><li><b>Herstellungsanspruch:</b> richtet sich gegen den Träger, dem die Pflichtverletzung zuzurechnen ist; Beratungsfehler eines anderen Trägers werden zugerechnet, wenn dieser arbeitsteilig eingebunden ist – im Einzelfall zu prüfen; Prüfungsschritte benennen, kein sicheres Ergebnis erwartet. <a data-go="n_herstellung">Voraussetzungen</a>.</li><li><b>Vorgehen:</b> sofort Rentenantrag stellen (§ 16 SGB I, § 115 SGB VI), Rentenbeginn nach § 99 SGB VI prüfen lassen, im Antrag auf fehlende Beratung hinweisen und hilfsweise den Herstellungsanspruch geltend machen; Folgen für den SGB-II-Bezug prüfen (§ 7 Abs. 4 SGB II: Ausschluss bei Altersrente, dann SGB XII).</li></ol></details>`,
 rel:['n_herstellung','n_beratung','n_rente','n_ausschl'],l:[]});
N('f3_3','t_faelle','Fall 3.3: Der unklare Bescheid',{p:'Fall',m:[3],src:'SGBX',sum:'Mängel eines Bescheids ohne Datum, Begründung und Belehrung.',
 b:`<h4>Sachverhalt</h4><p>Die Betreuerin von Herrn D. erhält die Kopie eines Schreibens der Familienkasse: „Für Ihr Kind wird das Kindergeld ab sofort nicht mehr gezahlt. Mit freundlichen Grüßen.“ Datum, Begründung und Rechtsbehelfsbelehrung fehlen.</p>
<details><summary>Lösungshinweise</summary><ol><li><b>Verwaltungsakt:</b> Regelung eines Einzelfalls mit Außenwirkung. Hinweis: Kindergeld nach dem EStG ist steuerrechtlich geregelt (Familienkassen, Einspruch nach AO, Finanzgerichte); Kinderzuschlag nach dem BKGG unterliegt dagegen dem SGB X und dem Sozialrechtsweg.</li><li><b>Mängel:</b> fehlende Bestimmtheit („ab sofort“), fehlende Begründung, fehlende Belehrung → Jahresfrist (§ 66 Abs. 2 SGG; im Steuerrecht entsprechend § 356 Abs. 2 AO). <a data-go="n_va">Prüfpunkte</a>.</li><li><b>Vorgehen:</b> Rechtsbehelf vorsorglich einlegen, Akteneinsicht und Begründung verlangen.</li></ol></details>`,
 rel:['n_va','n_wid'],l:[]});
N('f3_4','t_faelle','Fall 3.4: Bescheid an den betreuten Menschen',{p:'Fall',m:[3],src:'SGBX',sum:'Wirksame Bekanntgabe an die handlungsfähige betreute Person und abgelaufene Frist.',
 b:`<h4>Sachverhalt</h4><p>Frau S. ist geschäftsfähig, aber in Behördenangelegenheiten betreut. Das Sozialamt Dresden schickt einen Aufhebungsbescheid nur an Frau S.; sie legt ihn ungeöffnet in eine Schublade. Die Betreuerin findet ihn sechs Wochen nach Aufgabe zur Post.</p>
<details><summary>Lösungshinweise</summary><ol><li><b>Bekanntgabe:</b> Frau S. ist handlungsfähig (§ 11 Abs. 1 Nr. 1 SGB X), die Bekanntgabe an sie ist wirksam und gilt am vierten Tag nach Aufgabe zur Post; die Widerspruchsfrist ist abgelaufen. <a data-go="n_bekanntgabe">Fristberechnung</a>.</li><li><b>Rettung:</b> Wiedereinsetzung (§ 67 SGG) nur bei fehlendem Verschulden – eng, z. B. wenn Frau S. krankheitsbedingt die Bedeutung nicht erkennen konnte; unabhängig davon <b>Überprüfungsantrag nach § 44 SGB X</b> (Einheit 9).</li><li><b>Prävention:</b> Träger bitten, Schreiben auch an die Betreuerin zu richten; mit Frau S. Weitergabe der Behördenpost vereinbaren.</li></ol></details>`,
 rel:['n_bekanntgabe','n_handlung','n_ueberpr','n_wieder'],l:[]});

/* ===== Einheit 4 ===== */
EH[4]={z:'Wer hat Zugang zum Grundsicherungsgeld? Die Einheit behandelt die Reform 2026, die Voraussetzungen des § 7 SGB II (Alter, Erwerbsfähigkeit, Hilfebedürftigkeit, Aufenthalt), Ausschlüsse, Bedarfsgemeinschaft sowie Fördern und Fordern: Kooperationsplan, Pflichtverletzungen und Nichterreichbarkeit.',
 ks:['Seit 1. Juli 2026 heißt die Leistung Grundsicherungsgeld; „Bürgergeld“ darf bis Ende 2026 noch verwendet werden.','Erwerbsfähig ist, wer mindestens drei Stunden täglich arbeiten kann; die Betreuung selbst sagt darüber nichts aus.','Minderungen betragen einheitlich 30 Prozent des Regelbedarfs; Unterkunftskosten werden nicht gemindert.','Drei verpasste Meldetermine können zum vollständigen Wegfall führen; eine persönliche Meldung heilt.','Psychische Erkrankungen müssen bei Anhörung und Prüfung des wichtigen Grundes berücksichtigt werden; Betreuer sollten sie mit Einverständnis des Betreuten frühzeitig einbringen.'],
 kq:[['Nennen Sie die vier Grundvoraussetzungen des § 7 Abs. 1 Satz 1 SGB II.','Alter (ab 15 bis zur Altersgrenze), Erwerbsfähigkeit, Hilfebedürftigkeit, gewöhnlicher Aufenthalt in Deutschland.'],
 ['Ein betreuter Mensch kann nach ärztlicher Einschätzung täglich zwei Stunden arbeiten, voraussichtlich ein Jahr. Welches System ist zuständig?','Nicht erwerbsfähig (§ 8 SGB II), aber nicht dauerhaft voll erwerbsgemindert: Hilfe zum Lebensunterhalt nach dem 3. Kapitel SGB XII, wenn keine Bedarfsgemeinschaft mit erwerbsfähigen Personen besteht; Feststellung nach § 44a SGB II.'],
 ['Wann wird der Einstandswille bei Partnern vermutet?','§ 7 Abs. 3a SGB II: mehr als ein Jahr Zusammenleben, gemeinsames Kind, Versorgung von Kindern oder Angehörigen im Haushalt, Befugnis zur Verfügung über Einkommen oder Vermögen des anderen.'],
 ['Wie hoch ist eine Minderung wegen Pflichtverletzung nach neuem Recht, wie lange dauert sie?','30 Prozent des Regelbedarfs für drei Monate; Aufhebung bei Nachholung oder ernsthafter Bereitschaftserklärung (§§ 31a Abs. 1, 31b Abs. 2 SGB II).'],
 ['Was geschieht mit den Unterkunftskosten bei Nichterreichbarkeit nach § 7b Abs. 4 SGB II?','Sie werden für einen Monat weitergezahlt, möglichst direkt an den Vermieter; danach entfallen sie, wenn keine persönliche Meldung erfolgt.'],
 ['Welches Gespräch muss nach neuem Recht persönlich im Jobcenter stattfinden?','Das erste Gespräch zur Potenzialanalyse und zum Kooperationsplan (§ 15 Abs. 4 SGB II).']]};

N('n_reform26','t_zugang','Reform 2026: Vom Bürgergeld zum Grundsicherungsgeld',{p:'13. SGB-II-ÄndG, § 65a SGB II',k:['SGB II|65a','SGB II|2','SGB II|3a','SGB II|10','SGB II|15','SGB II|15a'],m:[4],src:'SGBII',sum:'Das SGB II wurde zum 1. Juli 2026 umgestaltet: mehr Mitwirkung, Vermittlungsvorrang, 30-Prozent-Minderung, Nichterreichbarkeit, neues Vermögensrecht.',
 b:`<p>Mit dem Dreizehnten Gesetz zur Änderung des SGB II vom 16. April 2026 (BGBl. 2026 I Nr. 107) wurde das Buch zum <b>1. Juli 2026</b> grundlegend umgestaltet. Es heißt nun „Grundsicherung für Arbeitsuchende“, die Geldleistung „Grundsicherungsgeld“.</p>
<div class="tw"><table><thead><tr><th>Bereich</th><th>Neuregelung ab 1.7.2026</th><th>Norm</th></tr></thead><tbody>
<tr><td>Einsatz der Arbeitskraft</td><td>im Umfang, der zur vollständigen Überwindung der Hilfebedürftigkeit nötig ist; erforderlichenfalls und zumutbar auch Vollzeit</td><td>§ 2 Abs. 2</td></tr>
<tr><td>Vermittlungsvorrang</td><td>Vermittlung in Arbeit hat Vorrang vor Geldleistungen und grundsätzlich vor anderen Eingliederungsleistungen</td><td>§ 3a</td></tr>
<tr><td>Kinderbetreuung</td><td>Arbeit grundsätzlich ab dem 14. Lebensmonat des Kindes zumutbar (bisher drittes Lebensjahr)</td><td>§ 10 Abs. 1 Nr. 3</td></tr>
<tr><td>Kooperationsplan</td><td>persönliches Erstgespräch im Jobcenter; Mindest-Eigenbemühungen</td><td>§ 15</td></tr>
<tr><td>Verpflichtung</td><td>verbindliche Pflichten durch schriftlichen Verwaltungsakt</td><td>§ 15a</td></tr>
<tr><td>Nichterreichbarkeit</td><td>drei aufeinanderfolgende Meldeversäumnisse führen zum Wegfall des Anspruchs</td><td>§ 7b Abs. 4</td></tr>
<tr><td>Minderungen</td><td>einheitlich 30 % des Regelbedarfs für drei Monate</td><td>§§ 31a, 31b</td></tr>
<tr><td>Vermögen</td><td>keine Karenzzeit mehr; altersabhängige Freibeträge</td><td>§ 12</td></tr>
<tr><td>Unterkunft</td><td>Deckelung auch in der Karenzzeit auf das 1,5-Fache der abstrakt angemessenen Kosten</td><td>§ 22</td></tr></tbody></table></div>
<h4>Übergangsrecht (§ 65a SGB II)</h4>
<ul><li>Für Bewilligungszeiträume, die vor dem 1. Juli 2026 begonnen haben, gilt § 12 SGB II (Vermögen) in der alten Fassung weiter.</li><li>Für Pflichtverletzungen und Meldeversäumnisse vor dem 1. Juli 2026 gelten die alten Rechtsfolgen.</li><li>Bis 31. Dezember 2026 darf weiterhin der Begriff „Bürgergeld“ verwendet werden.</li></ul>
<p>Die Bundesregierung beschreibt die Reform als Ablösung des Bürgergelds durch eine „Neue Grundsicherung“ mit stärkerer Betonung von Mitwirkung und Vermittlung; die Bundesagentur für Arbeit hat das Inkrafttreten zum 1. Juli 2026 bestätigt. Verfassungsrechtlicher Hintergrund: <a data-go="n_gg1">Existenzminimum</a> und <a data-go="n_neu2026">aktueller Bezug</a>.</p>`,
 f:'Stand 10.11.2026: Übergangsrecht beachten – Bewilligungszeiträume vor dem 1.7.2026 laufen beim Vermögensrecht nach altem Recht weiter.',
 q:['Welche Folgen haben Pflichtverletzungen nach neuem Recht?','Einheitlich Minderung um 30 Prozent des Regelbedarfs für drei Monate (§§ 31a, 31b SGB II); bei willentlicher Arbeitsverweigerung kann der Regelbedarf entfallen; Unterkunftskosten werden nicht gemindert.'],
 rel:['n_neu2026','n_pflv','n_erreich','n_koop','n_vermoegen'],l:[['Bundesregierung','https://www.bundesregierung.de/'],['Bundesagentur für Arbeit','https://www.arbeitsagentur.de/']]});
N('n_zugang','t_zugang','Leistungsberechtigte: Alter, Erwerbsfähigkeit, Hilfebedürftigkeit',{p:'§§ 7–9 SGB II',k:['SGB II|7','SGB II|8','SGB II|9','SGB II|7a','SGB I|30'],m:[4],src:'SGBII',sum:'Leistungen erhält, wer 15 ist, die Altersgrenze nicht erreicht hat, erwerbsfähig und hilfebedürftig ist und seinen gewöhnlichen Aufenthalt in Deutschland hat.',
 b:`<p><b>§ 7 Abs. 1 SGB II:</b> Erwerbsfähige Leistungsberechtigte haben (1) das 15. Lebensjahr vollendet und die Altersgrenze (§ 7a) noch nicht erreicht, sind (2) erwerbsfähig, (3) hilfebedürftig und haben (4) ihren gewöhnlichen Aufenthalt in Deutschland. Abs. 2: Auch Personen in einer Bedarfsgemeinschaft mit erwerbsfähigen Leistungsberechtigten erhalten Leistungen.</p>
<p><b>§ 8 Abs. 1:</b> Erwerbsfähig ist, wer nicht wegen Krankheit oder Behinderung auf absehbare Zeit außerstande ist, unter den üblichen Bedingungen des allgemeinen Arbeitsmarktes mindestens <b>drei Stunden täglich</b> erwerbstätig zu sein. <b>§ 9 Abs. 1:</b> Hilfebedürftig ist, wer seinen Lebensunterhalt nicht oder nicht ausreichend aus Einkommen oder Vermögen sichern kann und die erforderliche Hilfe nicht von anderen – insbesondere Angehörigen oder anderen Sozialleistungsträgern – erhält.</p>
<h4>Prüfschema Leistungsberechtigung</h4>
<div class="tw"><table><thead><tr><th>Schritt</th><th>Inhalt</th><th>Norm</th></tr></thead><tbody>
<tr><td>1. Alter</td><td>ab 15 bis zur Altersgrenze (stufenweise auf 67, wie Regelaltersgrenze)</td><td>§§ 7 Abs. 1 Nr. 1, 7a</td></tr>
<tr><td>2. Erwerbsfähigkeit</td><td>mindestens drei Stunden täglich; bei Ausländern zusätzlich rechtliche Möglichkeit der Beschäftigung</td><td>§ 8</td></tr>
<tr><td>3. Hilfebedürftigkeit</td><td>Bedarf größer als zu berücksichtigendes Einkommen und Vermögen</td><td>§§ 9, 11–12</td></tr>
<tr><td>4. Gewöhnlicher Aufenthalt</td><td>Lebensmittelpunkt in Deutschland</td><td>§ 7 Abs. 1 Nr. 4, § 30 Abs. 3 SGB I</td></tr>
<tr><td>5. Kein Ausschluss</td><td>Ausländer-Fallgruppen, stationäre Einrichtung, Altersrente, förderungsfähige Ausbildung</td><td>§ 7 Abs. 1 S. 2, Abs. 4, 4a, 5</td></tr>
<tr><td>6. Erreichbarkeit</td><td>Erreichbarkeit nach § 7b</td><td>§ 7b</td></tr></tbody></table></div>`,
 f:'Vier Grundvoraussetzungen auswendig; Erwerbsfähigkeit = mindestens drei Stunden täglich, „auf absehbare Zeit“ = mehr als sechs Monate.',
 q:['Wann ist eine Person erwerbsfähig im Sinne des SGB II?','Wenn sie nicht wegen Krankheit oder Behinderung auf absehbare Zeit (mehr als sechs Monate) außerstande ist, unter üblichen Bedingungen des allgemeinen Arbeitsmarktes mindestens drei Stunden täglich zu arbeiten (§ 8 Abs. 1 SGB II).'],
 rel:['n_erwerbsf','n_ausschl','n_bg','n_zufluss','n_s30'],l:LK(['SGB II',7],['SGB II',8],['SGB II',9])});
N('n_erwerbsf','t_zugang','Erwerbsfähigkeit, Erwerbsminderung und Nahtlosigkeit',{p:'§§ 8, 44a SGB II · § 43 SGB VI',k:['SGB II|44a','SGB VI|43'],m:[4],src:'SGBII',sum:'Das Leistungsvermögen entscheidet über das System: ab drei Stunden SGB II, darunter SGB XII; die Agentur für Arbeit stellt fest, das Jobcenter zahlt bis zur Klärung.',
 b:`<p>Erwerbsfähigkeit (§ 8 SGB II) und volle Erwerbsminderung (§ 43 Abs. 2 SGB VI) sind spiegelbildlich: Wer weniger als drei Stunden täglich arbeiten kann, ist im SGB II nicht erwerbsfähig und im SGB VI voll erwerbsgemindert. „Auf absehbare Zeit“ bedeutet einen Zeitraum von mehr als sechs Monaten.</p>
<div class="tw"><table><thead><tr><th>Leistungsvermögen täglich</th><th>Ergebnis</th><th>System</th></tr></thead><tbody>
<tr><td>≥ 3 Stunden</td><td>erwerbsfähig</td><td>SGB II (Jobcenter)</td></tr>
<tr><td>&lt; 3 Stunden, &gt; 6 Monate, dauerhaft</td><td>nicht erwerbsfähig</td><td>SGB XII, 4. Kapitel (Grundsicherung bei Erwerbsminderung)</td></tr>
<tr><td>&lt; 3 Stunden, &gt; 6 Monate, nicht dauerhaft</td><td>nicht erwerbsfähig</td><td>SGB XII, 3. Kapitel (Hilfe zum Lebensunterhalt) – oder SGB II als Mitglied einer Bedarfsgemeinschaft</td></tr></tbody></table></div>
<p>Die Feststellung der Erwerbsfähigkeit trifft die <b>Agentur für Arbeit</b> (§ 44a Abs. 1 SGB II). Widerspricht ein anderer Träger (etwa der Sozialhilfeträger), holt sie ein Gutachten des Rentenversicherungsträgers ein. <b>Bis zur Entscheidung zahlt das Jobcenter</b> (Nahtlosigkeit) – damit niemand zwischen den Systemen ohne Leistungen bleibt.</p>`,
 f:'Abgrenzung SGB II / SGB XII nach Leistungsvermögen; Nahtlosigkeit nach § 44a SGB II.',
 q:['Wer zahlt, wenn zwischen Jobcenter und Sozialamt die Erwerbsfähigkeit streitig ist?','Das Jobcenter erbringt bis zur Entscheidung (des Rentenversicherungsträgers auf Gutachtenbasis) Leistungen (§ 44a Abs. 1 SGB II, Nahtlosigkeit).'],
 rel:['n_zugang','n_sgb12_abgr','n_rente','f10_3'],l:LK(['SGB II','44a'],['SGB VI',43])});
N('n_ausschl','t_zugang','Leistungsausschlüsse',{p:'§ 7 Abs. 1, 4, 5 SGB II',k:['SGB II|7'],m:[4],src:'SGBII',sum:'Ausländerfallgruppen, AsylbLG, stationäre Einrichtung, Altersrente und förderungsfähige Ausbildung schließen Leistungen aus.',
 b:`<div class="tw"><table><thead><tr><th>Ausschluss</th><th>Norm</th><th>Hinweis</th></tr></thead><tbody>
<tr><td>Ausländer in den ersten drei Monaten, ohne Aufenthaltsrecht oder nur zur Arbeitsuche</td><td>§ 7 Abs. 1 S. 2</td><td>Ausnahme nach fünf Jahren gewöhnlichem Aufenthalt (§ 7 Abs. 1 S. 4); ggf. Überbrückungsleistungen nach § 23 Abs. 3 SGB XII</td></tr>
<tr><td>Leistungsberechtigte nach AsylbLG</td><td>§ 7 Abs. 1 S. 2 Nr. 3</td><td>Zuständigkeit nach AsylbLG</td></tr>
<tr><td>Unterbringung in stationärer Einrichtung</td><td>§ 7 Abs. 4 S. 1</td><td>Ausnahmen: Krankenhaus voraussichtlich unter sechs Monaten; mindestens 15 Wochenstunden erwerbstätig</td></tr>
<tr><td>Bezug einer Altersrente</td><td>§ 7 Abs. 4 S. 1</td><td>auch vorgezogene Altersrente; Wechsel in SGB XII</td></tr>
<tr><td>Förderungsfähige Ausbildung (BAföG/SGB III)</td><td>§ 7 Abs. 5, 6</td><td>Ausnahmen in Abs. 6; Mehrbedarfe nach § 27 SGB II bleiben möglich</td></tr></tbody></table></div>`,
 f:'Krankenhausaufenthalt unter sechs Monaten schließt nicht aus; Altersrente (auch vorzeitig) schon.',rel:['n_zugang','f4_3','f10_4','n_sgb12_abgr'],l:LK(['SGB II',7])});
N('n_bg','t_zugang','Bedarfsgemeinschaft und Haushaltsgemeinschaft',{p:'§ 7 Abs. 3, 3a, § 9 Abs. 2, 5, § 38 SGB II',k:['SGB II|38'],m:[4],src:'SGBII',sum:'Einstandsgemeinschaft von Partnern und Eltern/Kindern; Einstandswille wird bei bestimmten Anhaltspunkten vermutet.',
 b:`<p><b>Zur Bedarfsgemeinschaft gehören (§ 7 Abs. 3):</b> die erwerbsfähigen Leistungsberechtigten; im Haushalt lebende Eltern(teile) eines unverheirateten erwerbsfähigen Kindes unter 25 und deren Partner; als <b>Partner</b> der nicht dauernd getrennt lebende Ehegatte, Lebenspartner oder eine Person, bei der nach verständiger Würdigung der wechselseitige <b>Wille anzunehmen ist, füreinander Verantwortung zu tragen und einzustehen</b>; sowie unverheiratete Kinder unter 25 im Haushalt, soweit sie ihren Lebensunterhalt nicht aus eigenem Einkommen oder Vermögen sichern können.</p>
<p><b>Vermutung des Einstandswillens (§ 7 Abs. 3a):</b> Zusammenleben länger als ein Jahr, gemeinsames Kind, Versorgung von Kindern oder Angehörigen im Haushalt oder Befugnis, über Einkommen oder Vermögen des anderen zu verfügen.</p>
<h4>Wirkung</h4>
<p>Einstandsgemeinschaft: Einkommen und Vermögen der Partner werden gegenseitig, das der Eltern zugunsten der Kinder berücksichtigt (§ 9 Abs. 2). Jedes Mitglied hat einen eigenen Anspruch; ist der Gesamtbedarf nicht gedeckt, gilt jede Person im Verhältnis ihres Bedarfs zum Gesamtbedarf als hilfebedürftig (horizontale Methode, § 9 Abs. 2 S. 3).</p>
<h4>Abgrenzung</h4>
<ul><li><b>Haushaltsgemeinschaft</b> mit Verwandten oder Verschwägerten: Es wird nur vermutet, dass sie Leistungen erbringen, soweit nach Einkommen und Vermögen erwartbar (§ 9 Abs. 5); widerlegbar.</li><li><b>Wohngemeinschaft:</b> bloßes Zusammenwohnen begründet weder Bedarfs- noch Haushaltsgemeinschaft.</li></ul>
<p><b>Vertretung (§ 38 SGB II):</b> Vermutet wird, dass die erwerbsfähige leistungsberechtigte Person bevollmächtigt ist, Leistungen für die Bedarfsgemeinschaft zu beantragen und entgegenzunehmen. Für den betreuten Menschen bleibt der Betreuer gesetzlicher Vertreter; gegenüber dem Jobcenter klarstellen, dass Schreiben für ihn an den Betreuer zu richten sind.</p>`,
 f:'Partnerschaft als Voraussetzung, dann Vermutung nach Abs. 3a; Widerlegung durch Darlegung getrennter Lebensbereiche.',
 q:['Ab wann wird ein Einstandswille vermutet?','Nach § 7 Abs. 3a SGB II, wenn Partner länger als ein Jahr zusammenleben, mit gemeinsamem Kind, Kinder oder Angehörige im Haushalt versorgen oder befugt sind, über Einkommen/Vermögen des anderen zu verfügen.'],
 rel:['n_zugang','n_zufluss','f4_2','f10_1'],l:LK(['SGB II',7],['SGB II',9],['SGB II',38])});
N('n_koop','t_leist','Kooperationsplan und Verpflichtung',{p:'§§ 15, 15a SGB II',k:['SGB II|15','SGB II|15a'],m:[4],src:'SGBII',sum:'Persönliches Erstgespräch, Kooperationsplan (kein Verwaltungsakt) und verbindliche Verpflichtung per Bescheid.',
 b:`<p>Nach <b>§ 15 SGB II</b> erstellt die Agentur für Arbeit nach einer Potenzialanalyse gemeinsam mit der leistungsberechtigten Person einen <b>Kooperationsplan</b>: Zieltätigkeiten, mindestens zu unternehmende und nachzuweisende Eigenbemühungen, Eingliederungsleistungen und – bei Teilhabebedarf – das Hinwirken auf eine Antragstellung nach § 5 SGB IX. <b>§ 15 Abs. 4:</b> Das erste Gespräch findet <b>persönlich im Jobcenter</b> statt; Ausnahmen nur in begründeten Fällen.</p>
<p>Der Kooperationsplan ist <b>kein Verwaltungsakt</b>. Verbindliche Pflichten entstehen durch den <b>Verpflichtungsbescheid nach § 15a</b>, wenn eine Einladung ohne wichtigen Grund nicht wahrgenommen wird, Schritte aus dem Plan nicht erbracht werden oder kein Plan zustande kommt. In der Verpflichtung zu Eigenbemühungen müssen Art, Häufigkeit, Form und Frist der Nachweise konkret und angemessen bestimmt sein (§ 15a Abs. 4).</p>`,
 f:'Plan ≠ Verwaltungsakt; Pflichten erst durch Verpflichtungsbescheid, der konkret und angemessen sein muss.',rel:['n_pflv','n_reform26','f4_4','n_wid'],l:LK(['SGB II',15],['SGB II','15a'])});
N('n_pflv','t_leist','Pflichtverletzungen und Minderungen',{p:'§§ 31–32 SGB II',k:['SGB II|31','SGB II|31a','SGB II|31b','SGB II|32'],m:[4],src:'SGBII',sum:'30 Prozent Minderung für drei Monate; strenger bei willentlicher Arbeitsverweigerung; Schutz durch wichtigen Grund, Härte und Anhörung.',
 b:`<p><b>§ 31 Abs. 1:</b> Pflichtverletzung, wenn trotz schriftlicher Belehrung über die Rechtsfolgen oder deren Kenntnis geforderte Eigenbemühungen nicht nachgewiesen, zumutbare Arbeit/Ausbildung/geförderte Beschäftigung verweigert oder verhindert, oder eine zumutbare Eingliederungsmaßnahme nicht angetreten oder abgebrochen wird. <b>Nicht</b>, wenn ein wichtiger Grund dargelegt und nachgewiesen wird. <b>§ 31a Abs. 1:</b> Minderung um 30 Prozent des Regelbedarfs; aufzuheben, sobald Pflichten erfüllt oder ernsthaft und nachhaltig zugesagt werden.</p>
<div class="tw"><table><thead><tr><th>Tatbestand</th><th>Rechtsfolge</th><th>Dauer</th><th>Norm</th></tr></thead><tbody>
<tr><td>Pflichtverletzung</td><td>Minderung 30 % des Regelbedarfs</td><td>drei Monate; Aufhebung bei Nachholung/Bereitschaftserklärung</td><td>§§ 31a Abs. 1, 31b Abs. 2</td></tr>
<tr><td>Willentliche Verweigerung einer tatsächlich und unmittelbar möglichen zumutbaren Arbeit</td><td>Regelbedarf entfällt; Unterkunftskosten sollen an den Vermieter gezahlt werden</td><td>Aufhebung nach einem Monat, wenn die Arbeitsmöglichkeit nicht mehr besteht, spätestens nach zwei Monaten</td><td>§§ 31a Abs. 7, 31b Abs. 3</td></tr>
<tr><td>Erstes Meldeversäumnis</td><td>keine Minderung</td><td>–</td><td>§ 32 Abs. 1</td></tr>
<tr><td>Wiederholtes Meldeversäumnis</td><td>Minderung 30 %</td><td>ein Monat</td><td>§ 32 Abs. 1, 2</td></tr>
<tr><td>Drei aufeinanderfolgende Meldeversäumnisse</td><td>Nichterreichbarkeit, Wegfall</td><td>bis Ende Bewilligungszeitraum oder persönliche Meldung</td><td>§ 7b Abs. 4</td></tr></tbody></table></div>
<h4>Schutzmechanismen</h4>
<ul><li><b>Wichtiger Grund</b> (§ 31 Abs. 1 S. 2, § 32 Abs. 1 S. 2): etwa Krankheit, akute psychische Krise, fehlende Kinderbetreuung.</li><li><b>Außergewöhnliche Härte</b> (§ 31a Abs. 3): keine Minderung.</li><li><b>Unterkunftskosten</b> dürfen durch Minderung nicht verringert werden (§ 31a Abs. 4 S. 2); ergibt sich nur wegen der Minderung kein Anspruch, werden 1 Euro monatlich bewilligt (Versicherungsschutz, § 31a Abs. 4 S. 3).</li><li><b>Persönliche Anhörung</b> soll erfolgen, wenn psychische Erkrankungen bekannt sind oder Anhaltspunkte bestehen, dass sich die Person schriftlich nicht äußern kann (§ 31a Abs. 2 S. 2).</li><li><b>Untersuchung:</b> bei Anhaltspunkten für eine psychische Erkrankung kann das Jobcenter schon beim ersten Meldeversäumnis zu einem ärztlichen oder psychologischen Termin verpflichten (§ 32 Abs. 4).</li></ul>
<p><b>Verfassungsrechtlich</b> hat das BVerfG 2019 Minderungen über 30 Prozent und starre Zeiträume ohne Härtefallprüfung beanstandet (1 BvL 7/16). Der vollständige Wegfall bei Arbeitsverweigerung (§ 31a Abs. 7) und die Nichterreichbarkeit (§ 7b Abs. 4) knüpfen an die vom Gericht offengelassene Fallgruppe der willentlichen Verweigerung einer tatsächlich möglichen Arbeit an; ihre Verfassungsmäßigkeit ist in der Literatur umstritten und nicht abschließend geklärt – als <b>offene Rechtsfrage</b> behandeln (siehe <a data-go="n_gg1">Existenzminimum</a>).</p>`,
 f:'Prüfung: Belehrung? Wichtiger Grund? Härte? Anhörung (persönlich bei psychischer Erkrankung)? Unterkunftskosten bleiben ungekürzt.',
 q:['Welche Schutzmechanismen gelten bei Minderungen auch nach neuem Recht?','Wichtiger Grund, außergewöhnliche Härte, keine Minderung der Unterkunftskosten (mit 1-Euro-Regel für Versicherungsschutz), persönliche Anhörung bei bekannten psychischen Erkrankungen und ärztliche Untersuchung statt vorschneller Sanktion.'],
 rel:['n_erreich','n_koop','n_anhoerung','n_gg1','n_neu2026','n_eil'],l:LK(['SGB II',31],['SGB II',32])});
N('n_erreich','t_leist','Nichterreichbarkeit nach drei Meldeversäumnissen',{p:'§ 7b Abs. 4 SGB II',k:['SGB II|7b'],m:[4],src:'SGBII',sum:'Drei aufeinanderfolgende Meldeversäumnisse ohne wichtigen Grund lassen den Anspruch entfallen – eine persönliche Meldung heilt.',
 b:`<p>Erwerbsfähige Leistungsberechtigte gelten als nicht erreichbar, wenn sie trotz schriftlicher Belehrung oder deren Kenntnis <b>drei aufeinanderfolgenden Meldeaufforderungen</b> ohne Darlegung und Nachweis eines wichtigen Grundes nicht nachkommen. Der Anspruch entfällt mit Beginn des Folgemonats nach Feststellung des dritten Versäumnisses und bis zum Ende des Bewilligungszeitraums – es sei denn, die Person meldet sich vorher persönlich.</p>
<h4>Ablauf in Stufen</h4>
<ol><li>Drei aufeinanderfolgende Meldeversäumnisse trotz Belehrung, ohne wichtigen Grund. Vor der Prüfung des dritten soll Gelegenheit zur persönlichen Anhörung gegeben werden (§ 31a Abs. 2 S. 3).</li><li>Wegfall des Anspruchs ab dem Folgemonat.</li><li>Für einen Kalendermonat werden noch die <b>Unterkunftskosten</b> (ohne Regelbedarf) gezahlt, sie sollen an den Vermieter gehen (§ 22 Abs. 7 S. 3 Nr. 5).</li><li><b>Persönliche Meldung innerhalb dieses Monats heilt:</b> Die Person gilt als durchgehend erreichbar.</li><li>Ohne Meldung entfällt der Anspruch bis zum Ende des Bewilligungszeitraums.</li></ol>
<div class="mark"><b>Betreuungspraxis:</b> Termine begleiten, wichtigen Grund (z. B. psychische Krise) mit ärztlicher Bescheinigung belegen, Einladungen auch an die Betreuerin lenken, persönliche Meldung binnen Monatsfrist organisieren, Widerspruch und ggf. Eilantrag (§ 39 SGB II: keine aufschiebende Wirkung).</div>`,
 f:'Heilung durch persönliche Meldung binnen des Monats; Unterkunft für einen Monat weiter, möglichst an den Vermieter.',
 q:['Wie wird die Nichterreichbarkeit nach § 7b Abs. 4 SGB II beendet?','Durch persönliche Meldung im zuständigen Jobcenter – innerhalb des Monats nach Wegfall gilt die Person als durchgehend erreichbar; später beendet die Meldung die Nichterreichbarkeit für die Zukunft.'],
 rel:['n_pflv','f4_1','n_eil','n_anhoerung'],l:LK(['SGB II','7b'])});

N('f4_1','t_faelle','Fall 4.1: Drei Briefe vom Jobcenter',{p:'Fall',m:[4],src:'SGBII',sum:'Nichterreichbarkeit bei psychischer Erkrankung: wichtiger Grund, Anhörung, Sofortmaßnahmen.',
 b:`<h4>Sachverhalt</h4><p>Herr T., 34 Jahre, Dresden-Prohlis, paranoide Schizophrenie; Betreuerin für Behördenangelegenheiten, Vermögenssorge und Wohnungsangelegenheiten. Er öffnet Behördenpost häufig nicht, weil er sich bedroht fühlt. Drei Einladungen des Jobcenters nahm er nicht wahr; ein Bescheid sagt, der Anspruch entfalle ab nächstem Monat vollständig, weil er „nicht erreichbar“ sei. Die Einladungen enthielten Rechtsfolgenbelehrung; eine persönliche Anhörung fand nicht statt. Die Betreuerin hatte den Betreuerausweis übersandt; die Einladungen gingen nur an Herrn T.</p>
<h4>Leitfragen</h4><ol><li>Darf das Jobcenter die Leistungen ganz einstellen, auch für die Miete?</li><li>Welche Rolle spielt die Erkrankung?</li><li>Was kann die Betreuerin sofort tun?</li></ol>
<details><summary>Lösungshinweise</summary><ol><li><b>Tatbestand</b> <a data-go="n_erreich">§ 7b Abs. 4</a> erfüllt (drei Meldeaufforderungen mit Belehrung). Zu prüfen: <b>wichtiger Grund</b> – die Erkrankung, die Herrn T. hindert, Post zu öffnen und Termine wahrzunehmen, kann einer sein; Nachweis durch fachärztliche Bescheinigung.</li><li><b>Verfahren:</b> Nach § 31a Abs. 2 S. 2, 3 soll eine persönliche Anhörung erfolgen, wenn psychische Erkrankungen bekannt sind, und vor Prüfung des dritten Versäumnisses Gelegenheit gegeben werden. Ob dem Jobcenter die Erkrankung bekannt war, ist zu klären (die Betreuung begründet die Kenntnis nicht zwingend). Beim ersten Versäumnis hätte eine Untersuchung nach § 32 Abs. 4 veranlasst werden können.</li><li><b>Rechtsfolge:</b> Für einen Monat wird die Unterkunft weitergezahlt – die Miete ist nicht sofort gefährdet.</li><li><b>Sofortmaßnahmen:</b> Herrn T. zur persönlichen Meldung begleiten (möglichst binnen des Monats → gilt als durchgehend erreichbar); Widerspruch mit Begründung (wichtiger Grund, fehlende Anhörung); da keine aufschiebende Wirkung (§ 39 SGB II), ggf. <a data-go="n_eil">Antrag auf Anordnung der aufschiebenden Wirkung</a> beim Sozialgericht Dresden (§ 86b Abs. 1 S. 1 Nr. 2 SGG).</li><li><b>Prävention/Grenzfrage:</b> Jobcenter bitten, Einladungen auch an die Betreuerin zu senden; mit Einverständnis auf die Erkrankung hinweisen; prüfen, ob Herr T. tatsächlich erwerbsfähig ist (§§ 8, 44a SGB II).</li></ol></details>`,
 rel:['n_erreich','n_pflv','n_eil','n_erwerbsf'],l:[]});
N('f4_2','t_faelle','Fall 4.2: Die neue Partnerin',{p:'Fall',m:[4],src:'SGBII',sum:'Bedarfsgemeinschaft oder Wohngemeinschaft? Vermutung des Einstandswillens.',
 b:`<h4>Sachverhalt</h4><p>Frau R., 41 Jahre, bezieht Grundsicherungsgeld. Seit acht Monaten wohnt Herr W. bei ihr; beide geben an, nur eine Wohngemeinschaft zu sein. Herr W. verdient netto 2.300 Euro und hat eine Kontovollmacht für ihr Konto, weil er Überweisungen erledigt. Das Jobcenter nimmt eine Bedarfsgemeinschaft an.</p>
<details><summary>Lösungshinweise</summary><ol><li>Bedarfsgemeinschaft nach § 7 Abs. 3 Nr. 3 Buchst. c setzt Partnerschaft, gemeinsamen Haushalt und Einstandswillen voraus (<a data-go="n_bg">Bedarfsgemeinschaft</a>).</li><li>Die Kontovollmacht begründet die <b>Vermutung</b> des Einstandswillens (§ 7 Abs. 3a Nr. 4); die einjährige Frist (Nr. 1) ist mit acht Monaten noch nicht erreicht.</li><li>Widerlegung durch Frau R.: keine Partnerschaft, getrennte Lebensbereiche und Kassen, Vollmacht nur zur praktischen Hilfe. Voraussetzung jeder Bedarfsgemeinschaft ist eine auf Dauer angelegte exklusive Partnerschaft; die Vermutung greift erst, wenn diese feststeht.</li><li>Ist Frau R. betreut: prüfen, ob die Betreuerin die Kontoverwaltung selbst übernehmen oder klarer regeln sollte.</li></ol></details>`,
 rel:['n_bg','n_zufluss'],l:[]});
N('f4_3','t_faelle','Fall 4.3: Krankenhaus oder Einrichtung?',{p:'Fall',m:[4],src:'SGBII',sum:'Leistungsausschluss bei stationärer Unterbringung – Krankenhaus und Rehabilitation.',
 b:`<h4>Sachverhalt</h4><p>Herr K., 52 Jahre, Grundsicherungsgeld, wird nach Alkoholintoxikation im Krankenhaus behandelt und soll anschließend voraussichtlich neun Monate in eine Einrichtung der Suchtrehabilitation.</p>
<details><summary>Lösungshinweise</summary><ol><li><b>Krankenhaus:</b> Leistungen bleiben erhalten bei voraussichtlich unter sechs Monaten (§ 7 Abs. 4 S. 3 Nr. 1).</li><li><b>Rehabilitationseinrichtung:</b> Ob eine stationäre Einrichtung vorliegt, hängt von der Gesamtverantwortung für die Lebensführung ab und davon, ob Erwerbstätigkeit am allgemeinen Arbeitsmarkt ausgeschlossen ist. Bei medizinischer Reha der Rentenversicherung ggf. Übergangsgeld; Miete klären (ggf. § 35 SGB XII oder fortbestehende Jobcenter-Leistungen, wenn kein Ausschluss eingreift). <a data-go="n_ausschl">Ausschlüsse</a>.</li><li><b>Praxis:</b> Wohnungserhalt ist zentral; früh mit Jobcenter, Rentenversicherung und Sozialamt klären, Anträge fristwahrend bei allen in Betracht kommenden Trägern stellen.</li></ol></details>`,
 rel:['n_ausschl','n_antrag'],l:[]});
N('f4_4','t_faelle','Fall 4.4: Die alleinerziehende Mutter',{p:'Fall',m:[4],src:'SGBII',sum:'Zumutbarkeit von Arbeit ab dem 14. Lebensmonat und persönliches Erstgespräch.',
 b:`<h4>Sachverhalt</h4><p>Frau H., 29 Jahre, betreut ihren 16 Monate alten Sohn. Das Jobcenter lädt sie zu einem Kooperationsgespräch ein und erwartet Teilzeitarbeit. Eine Kita-Betreuung ist ab dem Folgemonat zugesagt.</p>
<details><summary>Lösungshinweise</summary><ol><li><b>Zumutbarkeit:</b> Arbeit ist grundsätzlich ab dem 14. Lebensmonat des Kindes zumutbar, soweit die Betreuung sichergestellt ist (§ 10 Abs. 1 Nr. 3) – mit der zugesagten Kita ab dem Folgemonat.</li><li>Der Mehrbedarf für Alleinerziehende (§ 21 Abs. 3) bleibt unberührt (Einheit 5).</li><li>Erstgespräch persönlich im Jobcenter (§ 15 Abs. 4); Kinderbetreuung während des Termins ansprechen. <a data-go="n_koop">Kooperationsplan</a>.</li></ol></details>`,
 rel:['n_koop','n_mehrbedarf','n_reform26'],l:[]});

/* ===== Einheit 5 ===== */
EH[5]={z:'Wie setzt sich das Grundsicherungsgeld zusammen? Regelbedarf 2026, Mehrbedarfe, Unterkunft und Heizung mit Karenzzeit und neuer 1,5-fach-Grenze, Wohnungssicherung, abweichende Bedarfe sowie Bildung und Teilhabe.',
 ks:['Der Regelbedarf ist eine Pauschale; 2026 beträgt er für Alleinstehende 563 Euro.','Mehrbedarfe werden in Prozent des Regelbedarfs bemessen und gesondert geprüft; bei Alleinerziehung gilt die günstigere Variante.','Seit 1. Juli 2026 werden Unterkunftskosten auch in der Karenzzeit nur bis zum 1,5-Fachen der abstrakt angemessenen Kosten übernommen; Ausnahmen bei Unabweisbarkeit und Familien mit Kindern.','Mietschulden können übernommen werden; die Schonfrist von zwei Monaten nach Zustellung der Räumungsklage ist zu beachten.','Erstausstattungen sind Zuschüsse, Ersatzbeschaffungen in der Regel Darlehen.'],
 kq:[['Wie hoch ist der Regelbedarf 2026 für ein Paar ohne Kinder insgesamt?','2 × 506 Euro = 1.012 Euro.'],
 ['Eine Alleinerziehende lebt mit drei Kindern (8, 11, 14 Jahre). Wie hoch ist der Mehrbedarf?','36 Prozent: Nr. 1 (drei Kinder unter 16 Jahren) ergibt 36 %; Nr. 2: 3 × 12 = 36 %.'],
 ['Was bedeutet die Karenzzeit bei den Unterkunftskosten, und wo liegt seit Juli 2026 ihre Grenze?','Im ersten Jahr des Leistungsbezugs werden die tatsächlichen Kosten ohne Angemessenheitsprüfung anerkannt, jedoch höchstens bis zum 1,5-Fachen der abstrakt angemessenen Kosten (§ 22 Abs. 1 Satz 6 SGB II neu).'],
 ['Wann gilt eine Miete trotz Karenzzeit sofort als unangemessen?','Bei Überschreiten einer Quadratmeter-Obergrenze im Gebiet oder bei Verstoß gegen die Mietpreisbremse (§ 22 Abs. 1 Satz 8 SGB II neu).'],
 ['Welche zwei Instrumente schützen einen betreuten Menschen mit Suchterkrankung vor erneuten Mietschulden?','Direktzahlung an den Vermieter (§ 22 Abs. 7 SGB II) und ggf. Übernahme von Rückständen (§ 22 Abs. 8); betreuungsrechtlich zusätzlich geordnete Kontoverwaltung.'],
 ['Ist der Ersatz eines defekten Herds eine Erstausstattung?','Nein, Ersatzbeschaffung; ggf. Darlehen nach § 24 Abs. 1 SGB II.']]};

N('n_bausteine','t_leist','Bausteine des Grundsicherungsgeldes',{p:'§ 19 SGB II',k:['SGB II|19','SGB II|26'],m:[5],src:'SGBII',sum:'Regelbedarf, Mehrbedarfe, Unterkunft und Heizung, abweichende Bedarfe, Bildung und Teilhabe und Kranken-/Pflegeversicherungsbeiträge.',
 b:`<ul><li><b>Regelbedarf</b> (§ 20) – pauschal, monatlich</li><li><b>Mehrbedarfe</b> (§ 21) – in typisierten Lebenslagen</li><li><b>Bedarfe für Unterkunft und Heizung</b> (§ 22) – tatsächliche Kosten, soweit angemessen</li><li><b>abweichende Bedarfe</b> (§ 24) – Darlehen, Erstausstattungen</li><li>zusätzlich <b>Bildung und Teilhabe</b> (§§ 28 ff.) für Kinder, Jugendliche und junge Erwachsene</li><li>Beiträge zur <b>Kranken- und Pflegeversicherung</b> (§ 26; Versicherungspflicht nach § 5 Abs. 1 Nr. 2a SGB V)</li></ul>
<p>Vom Gesamtbedarf wird das zu berücksichtigende Einkommen abgezogen (Einheit 6). Die Höhe der Regelbedarfe blieb von der Umbenennung zum 1. Juli 2026 unberührt.</p>
<div class="mark"><b>Rechenschema:</b> Regelbedarf + Mehrbedarfe + Unterkunft (anzuerkennender Betrag) + Heizung = Gesamtbedarf − bereinigtes Einkommen = Grundsicherungsgeld.</div>`,
 f:'Rechenschema Gesamtbedarf minus bereinigtes Einkommen.',rel:['n_regel','n_mehrbedarf','n_kdu','n_einkommen'],l:LK(['SGB II',19],['SGB II',26])});
N('n_regel','t_leist','Der Regelbedarf und die Regelbedarfsstufen 2026',{p:'§ 20 SGB II',k:['SGB II|20'],m:[5],src:'SGBII',sum:'Pauschale für Ernährung, Kleidung, Hausrat, Haushaltsenergie u. a.; 2026 „Nullrunde“, Stufe 1: 563 Euro.',
 b:`<p>Der Regelbedarf umfasst insbesondere Ernährung, Kleidung, Körperpflege, Hausrat, Haushaltsenergie ohne Heizung und Warmwasser, Bedarfe des täglichen Lebens und in vertretbarem Umfang Teilhabe am sozialen und kulturellen Leben (§ 20 Abs. 1). Er ist eine <b>Pauschale</b>: Die Leistungsberechtigten verwenden ihn eigenverantwortlich und müssen unregelmäßige Bedarfe (z. B. eine Waschmaschine) daraus ansparen.</p>
<p>2026 wurden die Regelbedarfe nicht erhöht („Nullrunde“), weil die Fortschreibung rechnerisch niedrigere Beträge ergeben hätte und die Besitzschutzregel greift.</p>
<div class="tw"><table><thead><tr><th>Stufe</th><th>Personenkreis</th><th>Betrag 2026</th></tr></thead><tbody>
<tr><td>1</td><td>Alleinstehende und Alleinerziehende</td><td>563 €</td></tr>
<tr><td>2</td><td>Partner in einer Bedarfsgemeinschaft, je</td><td>506 €</td></tr>
<tr><td>3</td><td>Erwachsene unter 25 im Haushalt der Eltern; im SGB XII Erwachsene in besonderen Wohnformen</td><td>451 €</td></tr>
<tr><td>4</td><td>Jugendliche 14–17 Jahre</td><td>471 €</td></tr>
<tr><td>5</td><td>Kinder 6–13 Jahre</td><td>390 €</td></tr>
<tr><td>6</td><td>Kinder bis 5 Jahre</td><td>357 €</td></tr></tbody></table></div>
<p>Die Regelbedarfe für 2027 sind vor dem jeweiligen Kurs gesondert zu prüfen.</p>`,
 f:'Beträge 2026 sicher kennen: 563 / 506 / 451 / 471 / 390 / 357 Euro.',
 q:['Wie hoch ist der Regelbedarf für zwei Partner in der Bedarfsgemeinschaft?','Je Partner Regelbedarfsstufe 2 mit 506 Euro, zusammen 1.012 Euro (2026).'],
 rel:['n_bausteine','n_mehrbedarf','n_sgb12_regel','n_gg1'],l:LK(['SGB II',20])});
N('n_mehrbedarf','t_leist','Mehrbedarfe',{p:'§§ 21, 23 SGB II',k:['SGB II|21','SGB II|23'],m:[5],src:'SGBII',sum:'Prozentuale Zuschläge für typisierte Lebenslagen – Schwangerschaft, Alleinerziehung, Behinderung, Ernährung, besondere Bedarfe.',
 b:`<p>Mehrbedarfe decken Bedarfe, die der Regelbedarf nicht abdeckt (§ 21 Abs. 1). Beträge 2026 (Stufe 1 = 563 €):</p>
<div class="tw"><table><thead><tr><th>Mehrbedarf</th><th>Norm</th><th>Höhe</th><th>Betrag</th></tr></thead><tbody>
<tr><td>Schwangerschaft ab 13. Woche</td><td>Abs. 2</td><td>17 %</td><td>95,71 €</td></tr>
<tr><td>Alleinerziehung, ein Kind unter 7 (oder 2–3 Kinder unter 16)</td><td>Abs. 3 Nr. 1</td><td>36 %</td><td>202,68 €</td></tr>
<tr><td>Alleinerziehung, je Kind (wenn günstiger)</td><td>Abs. 3 Nr. 2</td><td>12 % je Kind, max. 60 %</td><td>67,56 € je Kind</td></tr>
<tr><td>Erwerbsfähige mit Behinderung bei Teilhabe am Arbeitsleben</td><td>Abs. 4</td><td>35 %</td><td>197,05 €</td></tr>
<tr><td>Kostenaufwändige Ernährung aus medizinischen Gründen</td><td>Abs. 5</td><td>angemessen (Orientierung an Empfehlungen des Deutschen Vereins)</td><td>individuell</td></tr>
<tr><td>Unabweisbarer besonderer Bedarf (z. B. Umgangskosten, Medikamente in Ausnahmefällen)</td><td>Abs. 6</td><td>tatsächlicher Bedarf</td><td>individuell</td></tr>
<tr><td>Schulbücher</td><td>Abs. 6a</td><td>tatsächliche Kosten</td><td>individuell</td></tr>
<tr><td>Dezentrale Warmwassererzeugung</td><td>Abs. 7</td><td>2,3 % bei Erwachsenen</td><td>12,95 €</td></tr></tbody></table></div>
<p>Nicht erwerbsfähige Leistungsberechtigte im SGB II (z. B. voll erwerbsgeminderter Partner) erhalten bei Merkzeichen <b>G oder aG</b> einen Mehrbedarf von 17 Prozent (§ 23 Nr. 4). Die Summe der Mehrbedarfe nach § 21 Abs. 2–5 darf den maßgebenden Regelbedarf nicht übersteigen (§ 21 Abs. 8).</p>
<p><b>Rechenbeispiel:</b> Drei Kinder (8, 11, 14): Nr. 1 → 36 %; Nr. 2 → 3 × 12 = 36 %; Ergebnis 36 %.</p>`,
 f:'Alleinerziehende: Vergleichsrechnung Nr. 1 / Nr. 2 – die günstigere Variante gilt.',rel:['n_regel','n_bausteine','f4_4','n_kdu'],l:LK(['SGB II',21],['SGB II',23])});
N('n_kdu','t_leist','Unterkunft und Heizung: Angemessenheit, Karenzzeit, Kappung',{p:'§ 22 Abs. 1–1a SGB II',k:['SGB II|22'],m:[5],src:'SGBII',sum:'Tatsächliche Kosten, soweit angemessen; Karenzzeit ein Jahr; seit 1.7.2026 auch dort Kappung auf das 1,5-Fache der abstrakt angemessenen Unterkunftskosten.',
 b:`<p><b>§ 22 Abs. 1:</b> Bedarfe für Unterkunft und Heizung werden in Höhe der tatsächlichen Aufwendungen anerkannt, soweit sie angemessen sind. Für die Unterkunft gilt eine <b>Karenzzeit von einem Jahr</b> ab dem ersten Leistungsmonat, in der tatsächliche Aufwendungen anerkannt werden. <b>Neu seit 1.7.2026:</b> Auch in der Karenzzeit werden Aufwendungen nicht anerkannt, soweit sie mehr als das <b>1,5-Fache</b> der abstrakt angemessenen betragen; im Einzelfall können höhere anerkannt werden, wenn sie <b>unabweisbar</b> sind oder in Bedarfsgemeinschaften <b>mit Kindern</b> anfallen. Keine Karenzzeit, soweit eine Quadratmeter-Obergrenze im Gebiet überschritten wird oder die Miete die nach §§ 556d–556g BGB zulässige Miete übersteigt (dann Aufforderung zur Rüge). <b>Abs. 1a:</b> Angemessenheit wird für den Bewilligungszeitraum geprüft; bei Überschreitung informiert der kommunale Träger über Dauer und Voraussetzungen.</p>
<h4>Prüfungsaufbau</h4>
<div class="tw"><table><thead><tr><th>#</th><th>Frage</th><th>Hinweise</th></tr></thead><tbody>
<tr><td>1</td><td>Welche tatsächlichen Aufwendungen bestehen?</td><td>Grundmiete, kalte Betriebskosten, Heizkosten, Warmwasser; bei Eigentum Schuldzinsen, Nebenkosten, unabweisbare Reparaturen (§ 22 Abs. 2)</td></tr>
<tr><td>2</td><td>Was ist abstrakt angemessen?</td><td>Örtliches „schlüssiges Konzept“ des kommunalen Trägers; Heizkosten gesondert, ggf. Gesamtangemessenheitsgrenze (§ 22 Abs. 10)</td></tr>
<tr><td>3</td><td>Läuft die Karenzzeit?</td><td>Ein Jahr ab erstmaligem Leistungsbezug; neue Karenzzeit erst nach drei Jahren ohne Bezug nach SGB II oder SGB XII</td></tr>
<tr><td>4</td><td>Greift die Kappungsgrenze?</td><td>1,5-fach auch in der Karenzzeit; Ausnahme Unabweisbarkeit oder Kinder</td></tr>
<tr><td>5</td><td>Sonderfälle?</td><td>Quadratmeter-Obergrenze oder Mietpreisbremse: dann keine Karenzzeit</td></tr>
<tr><td>6</td><td>Kostensenkung möglich und zumutbar?</td><td>Nach Karenzzeit i. d. R. sechs Monate Übergang; Unzumutbarkeit etwa bei schwerer Erkrankung, Pflegebedürftigkeit, Verwurzelung; nach Todesfall mindestens zwölf Monate keine Senkung</td></tr>
<tr><td>7</td><td>Wirtschaftlichkeit</td><td>Keine Senkung, wenn der Umzug unwirtschaftlich wäre (§ 22 Abs. 1 S. 12 neu)</td></tr></tbody></table></div>
<p>Bis 30. Juni 2026 wurden tatsächliche Kosten in der Karenzzeit unabhängig von der Höhe übernommen. Die <b>Heizkosten</b> sind von der Kappung nicht erfasst. Erste sozialgerichtliche Eilentscheidungen befassen sich mit Zweck und Anwendung (z. B. SG Duisburg, S 42 AS 2039/26 ER).</p>
<h4>Umzug und Wohnungsbeschaffung</h4>
<p>Bei Umzug in ein anderes Angemessenheitsgebiet sichert der neue kommunale Träger die Berücksichtigung zu, wenn die Kosten angemessen sind; höhere als angemessene Kosten werden nach Umzug nur bei vorheriger schriftlicher Zusicherung anerkannt; innerhalb des Gebiets höchstens der bisherige Bedarf, wenn der Umzug nicht erforderlich war (§ 22 Abs. 4 neu). Wohnungsbeschaffungs- und Umzugskosten bei vorheriger Zusicherung; Mietkaution und Genossenschaftsanteile sollen als Darlehen erbracht werden (Abs. 6); für unter 25-Jährige beim Auszug besonderes Zusicherungserfordernis (Abs. 5).</p>`,
 f:'Karenzzeit = ein Jahr, aber seit 1.7.2026 Kappung 1,5-fach; Ausnahmen Unabweisbarkeit/Kinder; Heizung nicht gekappt.',
 q:['Wie wirkt sich die Reform 2026 auf die Karenzzeit bei den Unterkunftskosten aus?','Auch in der Karenzzeit werden höchstens das 1,5-Fache der abstrakt angemessenen Unterkunftskosten anerkannt; Ausnahmen bei Unabweisbarkeit und in Bedarfsgemeinschaften mit Kindern; Heizkosten sind von der Kappung nicht erfasst.'],
 rel:['n_wohnsich','n_reform26','f5_1','f5_2'],l:LK(['SGB II',22])});
N('n_wohnsich','t_leist','Wohnungssicherung: Direktzahlung, Mietschulden, Schonfrist',{p:'§ 22 Abs. 7–9 SGB II · § 569 BGB',k:['BGB|569'],m:[5],src:'SGBII',sum:'Direktzahlung an den Vermieter, Übernahme von Rückständen und die Schonfrist von zwei Monaten nach Zustellung der Räumungsklage.',
 b:`<ul><li><b>Direktzahlung (§ 22 Abs. 7):</b> auf Antrag an den Vermieter; <i>soll</i> geschehen, wenn die zweckentsprechende Verwendung nicht sichergestellt ist – insbesondere bei Mietrückständen, die zur außerordentlichen Kündigung berechtigen, Energiekostenrückständen oder krankheits- oder suchtbedingtem Unvermögen (Nr. 3).</li><li><b>Schuldenübernahme (§ 22 Abs. 8):</b> zur Sicherung der Unterkunft oder Behebung einer vergleichbaren Notlage; <i>soll</i> geschehen, wenn gerechtfertigt, notwendig und sonst Wohnungslosigkeit droht; in der Regel als Darlehen.</li><li><b>Räumungsklage (§ 22 Abs. 9):</b> Das Gericht teilt dem Jobcenter den Eingang der Klage mit.</li><li><b>Schonfrist (§ 569 Abs. 3 Nr. 2 BGB):</b> Gleicht der Mieter innerhalb von <b>zwei Monaten nach Zustellung der Räumungsklage</b> die Rückstände aus oder verpflichtet sich eine öffentliche Stelle dazu, wird die fristlose Kündigung wegen Zahlungsverzugs unwirksam – das zentrale Zeitfenster für die Betreuerin.</li></ul>
<p>Die Schonfrist erfasst nicht eine zugleich ausgesprochene ordentliche Kündigung.</p>`,
 f:'Fristenkarte Wohnungssicherung: Räumungsklage zugestellt + zwei Monate.',
 q:['Welche Frist gilt für die Schonfristzahlung?','Zwei Monate nach Zustellung der Räumungsklage (§ 569 Abs. 3 Nr. 2 BGB); danach wird die fristlose Kündigung wegen Zahlungsverzugs unwirksam.'],
 rel:['n_kdu','f5_3','f10_1','n_eil'],l:LK(['SGB II',22],['BGB',569])});
N('n_abweichend','t_leist','Abweichende und einmalige Bedarfe, Bildung und Teilhabe',{p:'§§ 24, 28, 29 SGB II',k:['SGB II|24','SGB II|28','SGB II|29','SGB II|42a'],m:[5],src:'SGBII',sum:'Unabweisbare Bedarfe als Darlehen, Erstausstattungen als Zuschuss, Bildungs- und Teilhabeleistungen überwiegend als Sach- und Dienstleistung.',
 b:`<div class="tw"><table><thead><tr><th>Leistung</th><th>Norm</th><th>Form</th></tr></thead><tbody>
<tr><td>Unabweisbarer, vom Regelbedarf umfasster, nicht anders deckbarer Bedarf (z. B. defekter Kühlschrank)</td><td>§ 24 Abs. 1</td><td>Darlehen; Tilgung durch Aufrechnung mit 5 % des Regelbedarfs (§ 42a Abs. 2)</td></tr>
<tr><td>Erstausstattung der Wohnung einschließlich Haushaltsgeräte</td><td>§ 24 Abs. 3 S. 1 Nr. 1</td><td>Zuschuss, gesonderter Antrag</td></tr>
<tr><td>Erstausstattung Bekleidung, Schwangerschaft und Geburt</td><td>§ 24 Abs. 3 S. 1 Nr. 2</td><td>Zuschuss</td></tr>
<tr><td>Orthopädische Schuhe, Reparatur und Miete therapeutischer Geräte</td><td>§ 24 Abs. 3 S. 1 Nr. 3</td><td>Zuschuss</td></tr>
<tr><td>Bildung und Teilhabe (Ausflüge, Schulbedarf, Beförderung, Lernförderung, Mittagsverpflegung, Teilhabe)</td><td>§§ 28, 29</td><td>überwiegend Sach-/Dienstleistungen; teils gesonderter Antrag (§ 37 Abs. 1 S. 2)</td></tr></tbody></table></div>
<p><b>Beispiele:</b> Waschmaschine irreparabel defekt → Ersatzbeschaffung, Darlehen mit 5 % Tilgung; Wohnung nach Wohnungslosigkeit ohne Möbel → Erstausstattung als Zuschuss mit gesondertem Antrag.</p>`,
 f:'Ersatz = Darlehen (§ 24 Abs. 1), Erstausstattung = Zuschuss (§ 24 Abs. 3).',
 q:['Unterschied zwischen Erstausstattung und Ersatzbeschaffung?','Erstausstattung der Wohnung (§ 24 Abs. 3 Nr. 1) ist ein Zuschuss mit gesondertem Antrag; Ersatzbeschaffung gehört zum Regelbedarf und wird bei Unabweisbarkeit als Darlehen gewährt (§ 24 Abs. 1), getilgt mit 5 % des Regelbedarfs.'],
 rel:['n_bausteine','f5_4','n_antrag'],l:LK(['SGB II',24],['SGB II',28],['SGB II',29])});

N('f5_1','t_faelle','Fall 5.1: Die zu teure Wohnung',{p:'Fall',m:[5],src:'SGBII',sum:'Karenzzeit, 1,5-fach-Kappung und Kostensenkung bei depressiver Erkrankung (Rechenfall).',
 b:`<h4>Sachverhalt</h4><p>Frau M., 47 Jahre, lebt seit 15 Jahren in einer 72-m²-Wohnung in Dresden-Striesen, seit drei Jahren allein; rezidivierende depressive Störung, Betreuerin für Wohnungs- und Behördenangelegenheiten. Nach Verlust der Arbeit beantragt sie zum 1. September 2026 Grundsicherungsgeld. Bruttokaltmiete 980 Euro. Das Jobcenter will „nur das 1,5-Fache“ übernehmen. <i>Annahme für die Übung:</i> abstrakt angemessene Bruttokaltmiete 520 Euro; Heizkosten 95 Euro (angemessen); nie zuvor SGB-II/XII-Bezug. (Die tatsächlichen Dresdner Richtwerte sind vor dem Kurs zu ermitteln.)</p>
<details><summary>Lösungshinweise</summary><ol><li><b>Karenzzeit:</b> läuft ab 1. September 2026 ein Jahr (§ 22 Abs. 1 S. 2).</li><li><b>Kappung:</b> 1,5 × 520 = 780 €. Die Miete von 980 € übersteigt das; anerkannt werden grundsätzlich 780 € Unterkunft + 95 € Heizung.</li><li><b>Ausnahme:</b> höhere Aufwendungen bei <b>Unabweisbarkeit</b>, z. B. wenn ein kurzfristiger Umzug wegen der Depression nicht möglich und Untervermietung unzumutbar ist; fachärztliche Stellungnahme vorlegen.</li><li><b>Nach der Karenzzeit:</b> Kostensenkungsverfahren mit Mitteilung (§ 22 Abs. 1a); i. d. R. sechs Monate Übergang; Unzumutbarkeit (Erkrankung, Verwurzelung) prüfen.</li><li><b>Weitere Wege:</b> Untervermietung (mit Erlaubnis), Wohngeld prüfen (§ 12a SGB II), Wohnungstausch in der Genossenschaft.</li></ol></details>`,
 rel:['n_kdu','n_wohnsich','n_gg1'],l:[]});
N('f5_2','t_faelle','Fall 5.2: Die Mietpreisbremse',{p:'Fall',m:[5],src:'SGBII',sum:'Überhöhte Miete über der zulässigen Miete: Rüge und Angemessenheit.',
 b:`<h4>Sachverhalt</h4><p>Herr F., 38 Jahre, zieht mit Zusicherung des Jobcenters in eine Wohnung in einem Gebiet mit Mietpreisbremse. Später stellt das Jobcenter fest, dass die vereinbarte Miete die nach §§ 556d ff. BGB zulässige Miete um 60 Euro übersteigt.</p>
<details><summary>Lösungshinweise</summary><ol><li>Nach § 22 Abs. 1 S. 8 Nr. 2 (neu) gilt der übersteigende Teil als unangemessen; die Karenzzeit greift insoweit nicht.</li><li>Das Jobcenter muss Herrn F. auffordern, den Verstoß gegenüber dem Vermieter zu rügen (§ 556g Abs. 2 BGB); die Rüge wirkt grundsätzlich für die Zukunft.</li><li>Ob in Dresden eine Mietpreisbremse gilt, hängt von der Landesverordnung ab (vor dem Kurs prüfen); der Fall übt die Struktur.</li><li>Betreuungspraxis: Die Rüge ist eine Willenserklärung im Mietverhältnis; die Betreuerin mit Aufgabenbereich Wohnungsangelegenheiten kann sie in Textform abgeben, nach Rücksprache mit dem Betreuten (§ 1821 BGB).</li></ol></details>`,
 rel:['n_kdu','n_wohnsich'],l:[]});
N('f5_3','t_faelle','Fall 5.3: Die fristlose Kündigung',{p:'Fall',m:[5],src:'SGBII',sum:'Mietrückstand in manischer Phase, Räumungsklage, Schonfrist und Direktzahlung.',
 b:`<h4>Sachverhalt</h4><p>Herr Z., 55 Jahre, Grundsicherungsgeld, betreut. In einer manischen Phase leitete er drei Monatsmieten (1.650 Euro) nicht weiter. Der Vermieter hat fristlos gekündigt und Räumungsklage erhoben, zugestellt vor drei Wochen.</p>
<details><summary>Lösungshinweise</summary><ol><li><b>Schonfrist:</b> zwei Monate nach Zustellung (§ 569 Abs. 3 Nr. 2 BGB) – es bleiben etwa fünf Wochen.</li><li><b>Übernahme nach § 22 Abs. 8:</b> soll bei Rechtfertigung, Notwendigkeit und drohender Wohnungslosigkeit erfolgen; die Erkrankung spricht gegen vorwerfbares Verhalten; in der Regel Darlehen.</li><li><b>Künftig:</b> Direktzahlung an den Vermieter nach § 22 Abs. 7 S. 3 Nr. 3 (krankheitsbedingtes Unvermögen) beantragen.</li><li><b>Vorgehen:</b> sofort Antrag beim Jobcenter mit Bitte um Verpflichtungserklärung gegenüber Vermieter/Amtsgericht; Fachstelle Wohnungsnotfallhilfe der Landeshauptstadt Dresden; parallel eine ordentliche Kündigung prüfen, die von der Schonfrist nicht erfasst wird.</li></ol></details>`,
 rel:['n_wohnsich','n_kdu','n_eil'],l:[]});
N('f5_4','t_faelle','Fall 5.4: Die defekte Waschmaschine und die neue Wohnung',{p:'Fall',m:[5],src:'SGBII',sum:'Darlehen für Ersatz, Zuschuss für Erstausstattung.',
 b:`<h4>Sachverhalt</h4><p>a) Frau O. lebt seit Jahren in ihrer Wohnung; die Waschmaschine ist irreparabel defekt. b) Herr N. wird nach zwei Jahren Wohnungslosigkeit in eine Wohnung vermittelt, die er ohne Möbel bezieht.</p>
<details><summary>Lösungshinweise</summary><p>a) Ersatzbeschaffung gehört zum Regelbedarf; bei unabweisbarem Bedarf <b>Darlehen</b> nach § 24 Abs. 1, Tilgung 5 % des Regelbedarfs monatlich (§ 42a Abs. 2). b) <b>Erstausstattung</b> der Wohnung nach § 24 Abs. 3 S. 1 Nr. 1 als <b>Zuschuss</b>, gesonderter Antrag (§ 37 Abs. 1 S. 2); Pauschale oder Sachleistung nach örtlichen Regelungen. Siehe <a data-go="n_abweichend">abweichende Bedarfe</a>.</p></details>`,
 rel:['n_abweichend'],l:[]});

/* ===== Einheit 6 ===== */
EH[6]={z:'Was wird angerechnet, was ist geschützt? Zuflussprinzip, Einkommensarten, nicht zu berücksichtigendes Einkommen, Freibeträge für Erwerbstätige mit Rechenbeispielen und das neue Vermögensrecht seit 1. Juli 2026 samt Übergangsregel.',
 ks:['Einkommen ist, was nach der Antragstellung zufließt; Vermögen ist, was vorher schon vorhanden war.','Erbschaften, Schmerzensgeld und Aufwandspauschalen nach § 1878 BGB bleiben als Einkommen unberücksichtigt; Erbschaften werden als Vermögen geprüft.','Erwerbstätige behalten 100 Euro und gestaffelte Prozentsätze; bei einem Minijob von 600 Euro sind das 208 Euro.','Seit 1. Juli 2026 gibt es beim Vermögen keine Karenzzeit mehr; Freibeträge nach Alter (5.000 bis 20.000 Euro je Person).','Für Bewilligungszeiträume vor dem 1. Juli 2026 gilt noch das alte Vermögensrecht.'],
 kq:[['Erläutern Sie das Zuflussprinzip an einem Beispiel.','Antrag im Januar: Das Guthaben im Januar ist Vermögen; der Lohn, der im Februar zufließt, ist Einkommen.'],
 ['Eine Steuererstattung von 1.500 Euro im Mai; monatlicher Anspruch 900 Euro. Wie wird sie berücksichtigt?','Einmalige Einnahme; würde der Anspruch im Mai entfallen, Verteilung auf sechs Monate mit je einem Sechstel des bereinigten Betrags (§ 11 Abs. 3 SGB II).'],
 ['Welche drei Stufen hat der Erwerbstätigenfreibetrag?','20 % (100–520 €), 30 % (520–1.000 €), 10 % (1.000–1.200 €, bei Kind in der Bedarfsgemeinschaft bis 1.500 €).'],
 ['Welcher Vermögensfreibetrag gilt für eine 29-Jährige und für einen 51-Jährigen?','5.000 Euro und 20.000 Euro.'],
 ['Ab wann gilt das neue Vermögensrecht bei einem am 1. Mai 2026 begonnenen zwölfmonatigen Bewilligungszeitraum?','Ab dem nächsten Bewilligungszeitraum, also ab 1. Mai 2027 (§ 65a Abs. 1 SGB II).'],
 ['Wird eine selbstgenutzte Eigentumswohnung von 145 m² im ersten Leistungsjahr als Vermögen berücksichtigt?','Nein: In der Karenzzeit nach § 22 Abs. 1 S. 2 SGB II ist selbstgenutztes Wohneigentum unabhängig von der Größe geschützt; danach gilt die Grenze von 130 m² mit Härtefallprüfung.']]};

N('n_zufluss','t_eink','Einkommen oder Vermögen? Das Zuflussprinzip',{p:'§ 11 SGB II',k:['SGB II|11'],m:[6],src:'SGBII',sum:'Einkommen ist, was nach der Antragstellung zufließt; Vermögen, was schon vorher vorhanden war.',
