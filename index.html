<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Modul 8 Lernatlas · Sozialrecht 1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#EEF1F6; --bg2:#E4E9F1; --panel:#FFFFFF; --panel2:#F5F7FB; --fg:#141C2B; --muted:#586379; --line:#D8DEE9;
  --accent:#2750B8; --accent-fg:#FFFFFF; --accent-soft:#E0E8FA; --ok:#1E8A4C; --warn:#C27A0A;
  --shadow:0 1px 2px rgba(20,32,60,.06),0 12px 28px -16px rgba(20,32,60,.30);
  --c-grund:#2D6FD8; --c-system:#0E8A80; --c-kv:#D13F5A; --c-rechtsschutz:#A3267E; --c-mitwirkung:#C2780E;
  --c-zugang:#6B4DD3; --c-eink:#3A8A2A; --c-leist:#D1521C; --c-verfahren:#4F6489; --c-sozhilfe:#80644B;
  --c-entsch:#8A7A22; --c-pfad:#66707F; --c-rv:#3A3EB4; --c-pv:#2B7BA0; --c-faelle:#B0467A; --c-root:#141C2B;
  --f-display:'Fraunces',Georgia,serif; --f-body:'Hanken Grotesk',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B111B; --bg2:#101827; --panel:#131C2B; --panel2:#18233A; --fg:#E7EDF7; --muted:#9AA9C0; --line:#263551;
  --accent:#8EB0F5; --accent-fg:#0B111B; --accent-soft:#1B2B4B; --ok:#58C98B; --warn:#E8B04C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 30px -16px rgba(0,0,0,.8);
  --c-grund:#6FA3F5; --c-system:#3FC3B7; --c-kv:#F0788E; --c-rechtsschutz:#DD6BB8; --c-mitwirkung:#E6A33E;
  --c-zugang:#9E87F2; --c-eink:#76C25F; --c-leist:#F08A57; --c-verfahren:#8EA3C8; --c-sozhilfe:#B89A80;
  --c-entsch:#CDBB55; --c-pfad:#9AA5B5; --c-rv:#8C90F0; --c-pv:#6DB9DC; --c-faelle:#E27DB0; --c-root:#E7EDF7; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B111B; --bg2:#101827; --panel:#131C2B; --panel2:#18233A; --fg:#E7EDF7; --muted:#9AA9C0; --line:#263551;
  --accent:#8EB0F5; --accent-fg:#0B111B; --accent-soft:#1B2B4B; --ok:#58C98B; --warn:#E8B04C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 30px -16px rgba(0,0,0,.8);
  --c-grund:#6FA3F5; --c-system:#3FC3B7; --c-kv:#F0788E; --c-rechtsschutz:#DD6BB8; --c-mitwirkung:#E6A33E;
  --c-zugang:#9E87F2; --c-eink:#76C25F; --c-leist:#F08A57; --c-verfahren:#8EA3C8; --c-sozhilfe:#B89A80;
  --c-entsch:#CDBB55; --c-pfad:#9AA5B5; --c-rv:#8C90F0; --c-pv:#6DB9DC; --c-faelle:#E27DB0; --c-root:#E7EDF7; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14.5px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;overflow-x:hidden}
button,input{font:inherit;color:inherit}
a{color:var(--accent)}
mark{background:color-mix(in srgb,var(--warn) 40%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 1fr;gap:10px;height:100%;min-height:0}

/* Kopf */
.head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.brand{font-family:var(--f-display);font-weight:650;font-size:22px;letter-spacing:-.01em;line-height:1.1;margin:0;text-wrap:balance}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:11.5px;color:var(--muted);letter-spacing:.02em;margin-top:2px}
.sbox{position:relative;flex:1;min-width:220px;max-width:560px;margin-left:auto}
.sbox input{width:100%;padding:10px 70px 10px 38px;border:1px solid var(--line);border-radius:12px;background:var(--panel);outline:none;box-shadow:var(--shadow)}
.sbox input:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sbox .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.sbox kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--muted);background:var(--panel2)}
.sbox .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:var(--panel2);border-radius:8px;padding:2px 8px;cursor:pointer;color:var(--muted)}
.ring{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.ring svg{display:block}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:5px 11px;cursor:pointer;font-size:12.5px;font-weight:500;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.btn:focus-visible,.chip:focus-visible,.row:focus-visible,.res:focus-visible,.kid:focus-visible,.split:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

/* Filter */
.filters{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.fbar{display:none}
.fbody{display:flex;flex-direction:column;gap:6px}
.frow{display:flex;gap:8px;align-items:center;min-width:0}
.flab{flex:none;width:58px;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.fchips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:thin;min-width:0;flex:1}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:1px 10px;cursor:pointer;font-size:12.5px;white-space:nowrap;line-height:1.7;transition:all .15s}
.chip:hover{border-color:var(--c,var(--accent))}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--c,var(--accent)) 16%,var(--panel));border-color:var(--c,var(--accent));font-weight:600}
.chip.m{font-family:var(--f-mono);font-size:11.5px;padding:1px 8px}
.chip.m[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.fchips#fStat{flex:0 1 auto}
.fstat{display:flex;gap:10px;align-items:center;margin-left:auto;flex:none;font-size:12px;color:var(--muted)}
.fstat b{color:var(--fg)}

/* Haupt */
.main{display:grid;grid-template-columns:var(--lw,44%) 12px minmax(0,1fr);gap:0;min-height:0}
.main.collapsed{grid-template-columns:minmax(0,1fr)}
.main.collapsed .pane.tree,.main.collapsed .split{display:none}
.split{cursor:col-resize;position:relative;touch-action:none;outline:none}
.split::after{content:"";position:absolute;left:5px;top:20%;bottom:20%;width:2px;border-radius:2px;background:var(--line);transition:all .15s}
.split:hover::after,.split:focus-visible::after,.split.on::after{background:var(--accent);width:4px;left:4px}
body.resizing{cursor:col-resize;user-select:none}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel2);align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:4px 12px;cursor:pointer;font-size:12.5px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.scroll{flex:1;min-height:0;overflow:auto;padding:8px 8px 40px}

/* Baum */
.row{display:flex;align-items:center;min-height:34px;padding:0 10px 0 0;cursor:pointer;position:relative;white-space:nowrap;border-radius:9px;transition:background .12s,opacity .2s}
.row:hover{background:color-mix(in srgb,var(--c) 9%,transparent)}
.row.sel{background:color-mix(in srgb,var(--c) 16%,transparent);box-shadow:inset 3px 0 0 var(--c)}
.row.dim{opacity:.3}
.guides{display:flex;flex:none;align-self:stretch}
.guides i{width:18px;border-left:1px solid color-mix(in srgb,var(--fg) 12%,transparent)}
.caret{width:18px;flex:none;text-align:center;color:var(--muted);font-size:9px;transition:transform .15s}
.caret.open{transform:rotate(90deg)}
.orb{width:11px;height:11px;border-radius:50%;flex:none;margin:0 8px 0 2px;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.row.theme{min-height:40px}
.row.theme .orb{width:15px;height:15px;margin-right:9px}
.row.theme .lbl{font-weight:650;font-size:15px}
.pn{font-family:var(--f-mono);font-size:11px;color:var(--c);margin-right:8px;flex:none}
.lbl{overflow:hidden;text-overflow:ellipsis;max-width:46ch}
.row.lr{white-space:normal;align-items:flex-start;padding:6px 10px 6px 0}
.row.lr .orb{margin-top:5px}
.row.lr .pn{width:7.2em;white-space:normal;line-height:1.3;margin-top:2px;overflow-wrap:anywhere}
.row.lr .lbl{white-space:normal;overflow:visible;max-width:none;flex:1;min-width:0;line-height:1.35;padding-top:1px}
.row.lr .mm{margin-top:2px}.row.lr .stt{margin-top:1px}
.mm{display:inline-flex;gap:2px;margin-left:8px;flex:none}
.mm b{font-family:var(--f-mono);font-weight:500;font-size:9.5px;border:1px solid color-mix(in srgb,var(--fg) 18%,transparent);border-radius:5px;padding:0 4px;color:var(--muted)}
.mm b.hi{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.stt{margin-left:6px;font-size:12px;flex:none}
.stt .ok{color:var(--ok)} .stt .fav{color:var(--warn)}
.cnt{margin-left:auto;padding-left:10px;font-size:11px;color:var(--muted);font-family:var(--f-mono);flex:none}

/* Suchergebnisse */
.res{display:block;width:100%;text-align:left;border:1px solid var(--line);border-left:4px solid var(--c);background:var(--panel);border-radius:10px;padding:8px 12px;margin-bottom:7px;cursor:pointer}
.res:hover,.res.sel{background:color-mix(in srgb,var(--c) 8%,var(--panel))}
.res b{display:block;font-size:13.5px}
.res .pl{font-family:var(--f-mono);font-size:11px;color:var(--c)}
.res .sn{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;white-space:normal}
.empty{padding:28px 14px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);margin-bottom:4px}

/* Detail */
.detail{overflow:auto;padding:22px 28px 56px;flex:1;min-height:0;scroll-behavior:smooth}
.crumb{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.crumb button{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.dh{border-left:6px solid var(--c);padding-left:16px;margin-bottom:12px}
.dh .pnl{font-family:var(--f-mono);font-size:12.5px;color:var(--c);margin-bottom:2px}
.dh h2{font-family:var(--f-display);font-weight:650;font-size:28px;line-height:1.18;margin:0;text-wrap:balance;letter-spacing:-.01em}
.lead{font-size:16px;line-height:1.55;color:var(--fg);max-width:70ch;margin:0 0 14px;padding:12px 16px;border-radius:12px;background:color-mix(in srgb,var(--c) 8%,var(--panel2))}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.pill{font-size:12px;border-radius:999px;padding:1px 10px;border:1px solid var(--line);background:var(--panel2)}
.pill.th{border-color:var(--c);color:var(--c);font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.acts .btn.on{background:var(--ok);border-color:var(--ok);color:#fff}
.acts .btn.fav.on{background:var(--warn);border-color:var(--warn);color:#1b1300}
.detail p{max-width:74ch;margin:0 0 11px}
.detail ul,.detail ol{max-width:74ch;padding-left:22px;margin:0 0 12px}
.detail li{margin-bottom:4px}
.detail h4{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:20px 0 6px;font-weight:700}
.box{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:14px 0;background:var(--panel2);max-width:78ch}
.box h3{margin:0 0 6px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.box.focus{border-color:var(--c);background:color-mix(in srgb,var(--c) 7%,var(--panel))}
.box.focus h3{color:var(--c)}
.box p:last-child,.box ul:last-child{margin-bottom:0}
.quiz button.rev{margin-top:6px}
.quiz .ans{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.quiz.open .ans{display:block}
.links{display:flex;flex-direction:column;gap:5px;padding:0!important;list-style:none!important;margin:0!important}
.rel{display:flex;flex-wrap:wrap;gap:6px}
.rel button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:2px 10px;font-size:12.5px;cursor:pointer;border-left:3px solid var(--c)}
.rel button:hover{background:var(--accent-soft)}
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px;margin:10px 0;max-width:920px}
.kid{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px 13px;text-align:left;cursor:pointer;border-left:4px solid var(--c);transition:transform .12s,box-shadow .12s}
.kid:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.kid b{display:block;font-size:13.5px;line-height:1.35}
.kid span{font-size:12px;color:var(--muted)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:26px;max-width:78ch}
.nav .btn{max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table{border-collapse:collapse;width:100%;font-size:13px}
.tw{overflow-x:auto;max-width:100%;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--panel2);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
td.num{font-family:var(--f-mono);font-weight:500;white-space:nowrap}
tr:last-child td{border-bottom:0}
.tw tr[data-go]{cursor:pointer}.tw tr[data-go]:hover{background:var(--accent-soft)}
/* Matrix */
.mx{display:grid;gap:3px;align-items:stretch;min-width:620px;font-size:12px}
.mx .h{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;padding:2px 0}
.mx .rl{display:flex;align-items:center;gap:7px;padding:3px 6px 3px 0;font-size:12.5px}
.mx .cell{border:0;border-radius:7px;min-height:30px;cursor:pointer;font-family:var(--f-mono);font-size:11.5px;background:color-mix(in srgb,var(--c) calc(var(--k)*70%),var(--panel2));color:var(--fg);transition:transform .1s}
.mx .cell:hover{transform:scale(1.08)}
.mx .cell[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.mx .cell.z{color:var(--muted);opacity:.5;cursor:default}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 14px;max-width:920px}
.legend button{display:flex;gap:8px;align-items:center;font-size:13px;border:0;background:none;padding:2px 0;cursor:pointer;text-align:left}
.legend .orb{margin:0}
.note{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:6px 14px;border-radius:999px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.on{opacity:1}
@media (max-width:900px){
  body{overflow:auto}
  html,body{height:auto}
  .app{height:auto}
  .main,.main.collapsed{grid-template-columns:minmax(0,1fr);row-gap:12px}
  .split{display:none}
  .pane.tree{height:62vh}
  .pane.read{min-height:60vh}
  .detail{padding:16px 14px 40px}
  .dh h2{font-size:23px}
  .flab{width:auto}
  .frow{flex-wrap:wrap}
  .fstat{margin-left:0}
  .fchips#fStat{flex:1 1 100%}
}
@media (max-width:700px){
  body{padding-block:8px;font-size:15px}
  .head{gap:8px}
  .brand{font-size:18px;flex:1 1 60%;min-width:0}
  .brand small{font-size:10.5px}
  .sbox{order:5;flex:1 1 100%;max-width:none;min-width:0;margin-left:0}
  .sbox input{padding-block:11px;font-size:16px}
  .sbox kbd{display:none}
  .ring{display:none}
  .head .btn{min-height:38px}
  #hideTree{display:none}
  .filters{padding:6px 10px;gap:0}
  .fbar{display:flex;align-items:center;gap:8px;min-height:40px}
  .fbar .btn{min-height:38px}
  .fbadge{background:var(--accent);color:var(--accent-fg);border-radius:999px;font-size:11.5px;font-weight:700;padding:0 8px;line-height:1.7}
  .fbadge:empty{display:none}
  .fcnt{margin-left:auto;font-size:12px;color:var(--muted)}
  .fbody{display:none;padding:6px 0 4px;gap:10px;border-top:1px solid var(--line);margin-top:6px}
  .filters.open .fbody{display:flex}
  .frow{flex-direction:column;align-items:stretch;gap:4px}
  .flab{width:auto}
  .fchips,.fchips#fStat{flex:0 0 auto;flex-wrap:wrap;overflow:visible;padding:0}
  .frow .flab[style]{margin-left:0!important;margin-top:4px}
  .chip{padding:4px 12px;line-height:1.5;min-height:34px}
  .chip.m{min-width:44px;justify-content:center}
  .fstat{margin-left:0;justify-content:space-between;width:100%}
  .bar{flex-wrap:wrap;gap:6px}
  .pane.tree{height:68vh}
  .row{min-height:40px;white-space:normal;padding-block:4px}
  .row .lbl{white-space:normal;overflow:visible;line-height:1.3;min-width:0}
  .row .pn{width:auto;margin-left:6px}
  .row .lbl{flex:1 1 auto;margin-right:12px!important;padding-right:4px}
  .row.lr .pn{width:6.4em}
  .lbl{max-width:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

a[data-go]{cursor:pointer;color:var(--accent);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px}
a[data-go]:hover{background:var(--accent-soft)}
a.ext{color:var(--muted);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px}
.mark{margin:12px 0;padding:10px 14px;border-radius:10px;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 9%,var(--panel));max-width:78ch}
details{margin:12px 0;border:1px solid var(--line);border-radius:12px;background:var(--panel2);max-width:78ch}
details>summary{cursor:pointer;padding:9px 14px;font-weight:600;font-size:13.5px}
details>summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
details[open]>summary{border-bottom:1px dashed var(--line)}
details>ol,details>p,details>ul{margin:10px 14px}
kbd{font:600 11px var(--f-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--panel)}
.prog{height:9px;border-radius:99px;background:var(--line);overflow:hidden;max-width:420px;margin:6px 0 10px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px}
.cl{display:flex;flex-direction:column;gap:5px;max-width:78ch;margin:8px 0}
.cl button{display:flex;gap:8px;align-items:center;text-align:left;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:9px;background:var(--panel);padding:6px 10px;cursor:pointer;font-size:13px}
.cl button:hover{background:var(--accent-soft)}
.cl button .ck{width:16px;color:var(--ok);font-weight:700}

/* ===== Einheit 1 ===== */
EH[1]={z:'Warum gibt es Sozialleistungen, und worauf stützen sie sich? Die Einheit zeigt, wie Sozialstaatsprinzip, Menschenwürde, Gleichheitssatz und Rechtsschutzgarantie das Sozialrecht tragen – und wie europäisches und internationales Recht hineinwirken.',
 ks:['Deutschland ist ein sozialer Rechtsstaat (Art. 20 Abs. 1, Art. 28 Abs. 1 GG). Das Sozialstaatsprinzip ist ein Auftrag vor allem an den Gesetzgeber.','Aus Art. 1 Abs. 1 GG in Verbindung mit Art. 20 Abs. 1 GG folgt ein Grundrecht auf ein menschenwürdiges Existenzminimum – physisch und soziokulturell. Die Höhe bestimmt der Gesetzgeber in einem transparenten Verfahren.','Konkrete Ansprüche ergeben sich nur aus Gesetzen (§ 31 SGB I, § 2 Abs. 1 Satz 2 SGB I). Die Verfassung wirkt über Auslegung und Ermessen.','Niemand darf wegen einer Behinderung benachteiligt werden (Art. 3 Abs. 3 Satz 2 GG). Soziale Rechte dürfen nicht wegen einer bestehenden oder möglichen Betreuung eingeschränkt werden (§ 17 Abs. 4 SGB I).','Das deutsche Sozialrecht gilt grundsätzlich für alle Menschen mit Wohnsitz oder gewöhnlichem Aufenthalt in Deutschland (§ 30 SGB I). EU-Recht koordiniert, völkerrechtliche Verträge wie die UN-BRK leiten die Auslegung.'],
 kq:[['Warum kann aus Art. 20 Abs. 1 GG allein kein Anspruch auf eine bestimmte Sozialleistung abgeleitet werden?','Das Sozialstaatsprinzip ist eine Staatszielbestimmung mit weitem Gestaltungsspielraum des Gesetzgebers; Ansprüche entstehen nur durch Gesetz (§ 2 Abs. 1 Satz 2 SGB I).'],
 ['Nennen Sie die beiden Bestandteile des menschenwürdigen Existenzminimums.','Physische Existenz und ein Mindestmaß an gesellschaftlicher, kultureller und politischer Teilhabe.'],
 ['Was bedeutet der Vorbehalt des Gesetzes (§ 31 SGB I) für einen Bescheid, mit dem eine Leistung gekürzt wird?','Die Kürzung braucht eine gesetzliche Grundlage, die im Bescheid erkennbar sein muss.'],
 ['Ein Pflegedienst-Mitarbeiter sagt: „Wer einen Betreuer hat, bekommt keine Haushaltshilfe.“ Wie reagieren Sie?','§ 17 Abs. 4 Satz 2 SGB I: Soziale Rechte dürfen nicht wegen einer Betreuung versagt werden; maßgeblich sind allein die Voraussetzungen des Leistungsgesetzes.'],
 ['Was ist der Unterschied zwischen Harmonisierung und Koordinierung im europäischen Sozialrecht?','Harmonisierung würde die Systeme angleichen; Koordinierung lässt sie bestehen und regelt nur das Zusammenspiel (VO [EG] 883/2004).']]};

N('n_gg20','t_grund','Sozialstaatsprinzip',{p:'Art. 20, 28 GG',k:['GG|20','GG|28','GG|79'],m:[1],src:'GG',sum:'Deutschland ist ein sozialer Bundesstaat und sozialer Rechtsstaat – ein Staatsziel, das vor allem den Gesetzgeber bindet.',
 b:`<p>Art. 20 Abs. 1 GG nennt die Bundesrepublik einen „demokratischen und sozialen Bundesstaat“; Art. 28 Abs. 1 Satz 1 GG verpflichtet auch die Länder auf den „sozialen Rechtsstaat“. Das Sozialstaatsprinzip ist eines der fünf tragenden Strukturprinzipien (neben Demokratie, Rechtsstaat, Bundesstaat und Republik) und durch die Ewigkeitsklausel des Art. 79 Abs. 3 GG in seinem Kern jeder Verfassungsänderung entzogen.</p>
<h4>Was der Staat leisten muss</h4>
<ul><li><b>Soziale Gerechtigkeit:</b> Ausgleich sozialer Gegensätze</li><li><b>Soziale Sicherheit:</b> Absicherung gegen die großen Lebensrisiken – Krankheit, Unfall, Alter, Erwerbsminderung, Arbeitslosigkeit, Pflegebedürftigkeit</li><li><b>Existenzminimum:</b> jedem Menschen die Mindestvoraussetzungen für ein menschenwürdiges Dasein sichern</li></ul>
<p>Das Prinzip ist eine <b>Staatszielbestimmung</b>. Wie der Sozialstaat konkret aussieht – Versicherung, Steuern oder Fürsorge, in welcher Höhe, unter welchen Voraussetzungen –, entscheidet das Parlament. Aus Art. 20 Abs. 1 GG allein kann deshalb <b>niemand eine bestimmte Leistung einklagen</b>.</p>
<p>Im Sozialgesetzbuch selbst wird der Verfassungsauftrag in <b>§ 1 SGB I</b> aufgenommen: Das SGB soll zu sozialer Gerechtigkeit und sozialer Sicherheit beitragen, ein menschenwürdiges Dasein sichern, gleiche Voraussetzungen für die freie Entfaltung der Persönlichkeit schaffen, die Familie schützen, den Erwerb des Lebensunterhalts durch frei gewählte Tätigkeit ermöglichen und besondere Belastungen – auch durch Hilfe zur Selbsthilfe – ausgleichen.</p>`,
 f:'Staatszielbestimmung, kein Anspruch: Konkrete Leistungen gibt es nur auf gesetzlicher Grundlage (§ 31 SGB I, § 2 Abs. 1 Satz 2 SGB I).',
 q:['Welche Bedeutung hat das Sozialstaatsprinzip für den Einzelnen?','Es ist eine Staatszielbestimmung, die vor allem den Gesetzgeber bindet und ihm weiten Gestaltungsspielraum lässt. Einen Anspruch auf eine bestimmte Leistung begründet es nicht; er ergibt sich nur aus einem Gesetz.'],
 rel:['n_gg1','n_s31','n_gg74'],l:[...LK(['GG',20],['GG',28],['SGB I',1])]});
N('n_gg74','t_grund','Gesetzgebungskompetenz im Sozialrecht',{p:'Art. 74 Abs. 1 GG',k:['GG|74'],m:[1],src:'GG',sum:'Sozialrecht ist überwiegend Bundesrecht; die Ausführung liegt oft bei Ländern und Kommunen.',
 b:`<p>Grundlage ist die <b>konkurrierende Gesetzgebung</b> nach Art. 74 Abs. 1 GG, unter anderem Nr. 7 (öffentliche Fürsorge), Nr. 9 (Kriegsschäden und Wiedergutmachung), Nr. 12 (Arbeitsrecht und Sozialversicherung einschließlich Arbeitslosenversicherung), Nr. 13 (Ausbildungsbeihilfen) und Nr. 18 (Wohngeldrecht).</p>
<p><b>Praxisfolge:</b> Die Leistungsgesetze (SGB II, SGB XII, SGB V usw.) gelten bundesweit einheitlich. Ausgeführt werden sie vielfach durch Länder und Kommunen – etwa durch Landkreise und kreisfreie Städte als Träger der Sozialhilfe oder durch den Kommunalen Sozialverband Sachsen als Behörde der Sozialen Entschädigung. Deshalb gibt es bei gleichem Gesetz regionale Unterschiede in Verwaltungspraxis, Formularen und – etwa bei den Kosten der Unterkunft – bei Angemessenheitswerten.</p>`,
 f:'Einheitliches Bundesrecht, regional unterschiedliche Ausführung: bei Fragen zu Formularen oder Angemessenheitswerten immer den örtlichen Träger prüfen.',
 rel:['n_gg20','n_traeger'],l:LK(['GG',74])});
N('n_s31','t_grund','Vorbehalt des Gesetzes',{p:'§ 31 SGB I',k:['SGB I|31','SGB I|2'],m:[1,3],src:'SGBI',sum:'Rechte und Pflichten im Sozialrecht dürfen nur begründet, geändert oder aufgehoben werden, soweit ein Gesetz es vorschreibt oder zulässt.',
 b:`<p><b>Art. 20 Abs. 3 GG</b> bindet die Verwaltung an Gesetz und Recht; <b>§ 31 SGB I</b> konkretisiert das für das Sozialrecht. Der Vorbehalt wirkt in zwei Richtungen:</p>
<ul><li><b>Schutz der Leistungsberechtigten:</b> Eine Behörde darf Leistungen nicht kürzen, Pflichten nicht auferlegen und Bescheide nicht aufheben, wenn es dafür keine gesetzliche Grundlage gibt.</li><li><b>Bindung der Leistungsberechtigten:</b> Niemand kann eine Leistung verlangen, die kein Gesetz vorsieht – auch wenn sie im Einzelfall sinnvoll wäre.</li></ul>
<div class="mark"><b>Merksatz:</b> Die erste Frage an jeden Bescheid lautet: Auf welche Vorschrift stützt sich die Behörde? Ein Bescheid ohne erkennbare Rechtsgrundlage ist ein Warnsignal.</div>`,
 f:'Typische Frage: Was folgt aus § 31 SGB I für eine Kürzung? Antwort: Sie braucht eine gesetzliche Grundlage, die im Bescheid erkennbar ist (siehe auch Begründungspflicht § 35 SGB X).',
 q:['Was ist die erste Frage an jeden belastenden Bescheid?','Auf welche Rechtsgrundlage stützt sich die Behörde? Ohne gesetzliche Grundlage dürfen Rechte weder gekürzt noch aufgehoben werden (§ 31 SGB I).'],
 rel:['n_gg20','n_s35','n_gg19'],l:LK(['SGB I',31],['SGB I',2])});
N('n_gg19','t_grund','Rechtsschutzgarantie',{p:'Art. 19 Abs. 4 GG',k:['GG|19'],m:[1,9],src:'GG',sum:'Wer durch die öffentliche Gewalt in seinen Rechten verletzt wird, dem steht der Rechtsweg offen.',
 b:`<p>Art. 19 Abs. 4 Satz 1 GG garantiert effektiven Rechtsschutz gegen Akte der öffentlichen Gewalt. Für sozialrechtliche Streitigkeiten ist der Rechtsweg im <b>Sozialgerichtsgesetz (SGG)</b> ausgestaltet: Widerspruchsverfahren, Sozialgericht, Landessozialgericht, Bundessozialgericht. Die Einzelheiten – Fristen, Eilrechtsschutz, Untätigkeitsklage – behandelt Einheit 9.</p>`,
 f:'Verfassungsrechtlicher Anker für Widerspruch, Klage und Eilrechtsschutz.',rel:['n_wid','n_eil','n_s31'],l:LK(['GG',19])});
N('n_gg1','t_grund','Menschenwürde und Existenzminimum',{p:'Art. 1 GG',k:['GG|1'],m:[1],src:'GG',sum:'Aus Menschenwürde und Sozialstaatsprinzip folgt ein Grundrecht auf ein menschenwürdiges Existenzminimum.',
 b:`<p>Art. 1 Abs. 1 GG: Die Würde des Menschen ist unantastbar; sie zu achten und zu schützen ist Verpflichtung aller staatlichen Gewalt. Das Bundesverfassungsgericht hat aus Art. 1 Abs. 1 GG <b>in Verbindung mit</b> Art. 20 Abs. 1 GG ein eigenständiges Grundrecht entwickelt (Urteil vom 9. Februar 2010, 1 BvL 1/09): Es sichert jedem Hilfebedürftigen die materiellen Voraussetzungen, die für seine <b>physische Existenz</b> und für ein <b>Mindestmaß an Teilhabe</b> am gesellschaftlichen, kulturellen und politischen Leben unerlässlich sind.</p>
<h4>Fünf Kernaussagen</h4>
<div class="tw"><table><thead><tr><th>Kernaussage</th><th>Bedeutung für die Praxis</th></tr></thead><tbody>
<tr><td>1. Das Existenzminimum umfasst die physische Existenz (Nahrung, Kleidung, Unterkunft, Heizung, Hygiene, Gesundheit) und die soziokulturelle Existenz.</td><td>Auch Ausgaben für Kommunikation, Mobilität oder Bildung gehören grundsätzlich dazu.</td></tr>
<tr><td>2. Es ist ein Gewährleistungsrecht, das der Gesetzgeber konkretisieren muss.</td><td>Die Höhe ergibt sich aus dem Gesetz (Regelbedarfsermittlungsgesetz, SGB II, SGB XII), nicht aus der Verfassung.</td></tr>
<tr><td>3. Der Gesetzgeber hat Gestaltungsspielraum, muss die Höhe aber transparent und sachgerecht ermitteln.</td><td>2010 war die Regelleistung von 345 Euro verfassungswidrig ermittelt, weil der Gesetzgeber ohne Rechtfertigung vom eigenen Statistikmodell abwich.</td></tr>
<tr><td>4. Das Grundrecht greift nur, soweit andere Mittel nicht zur Verfügung stehen (Nachrang).</td><td>Eigenes Einkommen und Vermögen sowie vorrangige Leistungen dürfen angerechnet werden (Einheit 6).</td></tr>
<tr><td>5. Mitwirkung darf verlangt und Pflichtverletzung sanktioniert werden – aber verhältnismäßig.</td><td>BVerfG, Urteil vom 5. November 2019 (1 BvL 7/16): Minderungen über 30 Prozent in der damaligen Ausgestaltung unvereinbar mit dem Grundgesetz.</td></tr></tbody></table></div>
<p>Ergänzend hat das Gericht klargestellt, dass das Grundrecht auf die unbedingt notwendigen Mittel beschränkt ist und nicht besteht, wenn die Bedürftigkeit etwa durch Aufnahme einer existenzsichernden Erwerbstätigkeit beendet oder vermieden werden kann (Beschluss vom 23. September 2024, 1 BvL 9/21).</p>`,
 f:'Beide Bestandteile des Existenzminimums nennen können (physisch + soziokulturell) und die Schranken (Nachrang, Mitwirkung, Verhältnismäßigkeit bei Sanktionen).',
 q:['Woraus leitet das BVerfG das Grundrecht auf ein menschenwürdiges Existenzminimum ab, und was umfasst es?','Aus Art. 1 Abs. 1 GG in Verbindung mit dem Sozialstaatsprinzip (Art. 20 Abs. 1 GG). Es umfasst die physische Existenz und ein Mindestmaß an Teilhabe am gesellschaftlichen, kulturellen und politischen Leben.'],
 rel:['n_gg20','n_neu2026','n_pflv','n_regel'],l:LK(['GG',1])});
N('n_neu2026','t_leist','Neue Grundsicherung seit 1. Juli 2026',{p:'13. SGB-II-Änderungsgesetz',m:[1,5],src:'SGBII',sum:'Aus dem „Bürgergeld“ ist das „Grundsicherungsgeld“ geworden; Pflichtverletzungen und Nichterreichbarkeit werden strenger behandelt.',
 b:`<p>Mit dem Dreizehnten Gesetz zur Änderung des SGB II vom 16. April 2026 (BGBl. 2026 I Nr. 107) ist zum <b>1. Juli 2026</b> die Geldleistung „Bürgergeld“ in <b>„Grundsicherungsgeld“</b> umbenannt worden. Bis zum 31. Dezember 2026 dürfen Behörden noch den Begriff „Bürgergeld“ verwenden.</p>
<ul><li>Bei Pflichtverletzungen kann der Regelbedarf um <b>30 Prozent für jeweils drei Monate</b> gemindert werden.</li><li>Bei wiederholten Meldeversäumnissen kann der Leistungsanspruch wegen <b>Nichterreichbarkeit</b> in letzter Konsequenz vollständig entfallen, einschließlich der Kosten der Unterkunft.</li><li>Schutzmechanismen, etwa für Menschen mit psychischen Erkrankungen, sind nach Angabe der Bundesagentur für Arbeit fest verankert.</li><li>Einzelne Teile der Reform treten erst später in Kraft (u. a. 1. August 2027).</li></ul>
<p>Der Regelbedarf für Alleinstehende beträgt 2026 unverändert <b>563 Euro</b>. Verfassungsrechtlich bewegt sich die Neuregelung im Spannungsfeld zwischen Existenzsicherung (Art. 1, 20 GG) und zulässiger Mitwirkung (BVerfG 2019).</p>`,
 f:'Aktuelles Recht (Stand 10.11.2026): Grundsicherungsgeld statt Bürgergeld; Regelbedarf 563 Euro; strengere Folgen bei Meldeversäumnissen – Schutzregeln für psychisch Erkrankte beachten.',
 rel:['n_gg1','n_pflv','n_regel','n_erreich'],l:[['Bundesregierung: Neue Grundsicherung','https://www.bundesregierung.de/'],['Bundesagentur für Arbeit: Reform der Grundsicherung','https://www.arbeitsagentur.de/']]});
N('n_gg3','t_grund','Gleichheit, Behinderung und Familie',{p:'Art. 3, 6 GG',k:['GG|3','GG|6'],m:[1],src:'GG',sum:'Gleichheitssatz, Benachteiligungsverbot wegen Behinderung und Schutz von Ehe, Familie und Müttern.',
 b:`<p>Der <b>allgemeine Gleichheitssatz</b> (Art. 3 Abs. 1 GG) verlangt, wesentlich Gleiches gleich und wesentlich Ungleiches ungleich zu behandeln. Im Sozialrecht ist er Maßstab dafür, ob der Gesetzgeber Gruppen unterschiedlich behandeln darf – etwa Erwerbsfähige und nicht Erwerbsfähige (SGB II gegenüber SGB XII) oder Versicherte und Nichtversicherte. Unterschiede sind zulässig, wenn sie sachlich gerechtfertigt sind.</p>
<p>Das besondere Benachteiligungsverbot wegen einer Behinderung (<b>Art. 3 Abs. 3 Satz 2 GG</b>) verbietet nicht nur offene Benachteiligung, sondern verpflichtet auch zum Abbau von Barrieren. Im SGB I spiegelt es sich in § 10 (Teilhabe behinderter Menschen) und § 17 (barrierefreie Ausführung von Sozialleistungen). <b>Art. 6 GG</b> stellt Ehe und Familie unter besonderen Schutz und gibt jeder Mutter Anspruch auf Schutz und Fürsorge der Gemeinschaft.</p>`,
 f:'Art. 3 Abs. 3 Satz 2 GG ist für die Betreuungspraxis zentral – als Maßstab und als Hintergrund von § 17 Abs. 4 SGB I.',rel:['n_s17','n_sozrechte'],l:LK(['GG',3],['GG',6])});
N('n_s17','t_grund','Keine Leistungsversagung wegen Betreuung',{p:'§ 17 Abs. 4 SGB I',k:['SGB I|17','SGB I|10'],m:[1],src:'SGBI',sum:'Soziale Rechte dürfen nicht deshalb abgelehnt oder eingeschränkt werden, weil ein rechtlicher Betreuer bestellt ist oder werden könnte.',
 b:`<p>Nach <b>§ 17 Abs. 4 SGB I</b> arbeiten die Leistungsträger mit den Betreuungsbehörden zusammen, um geeignete Hilfen zur Betreuungsvermeidung zu vermitteln. Satz 2 stellt klar: Soziale Rechte dürfen nicht abgelehnt, versagt oder eingeschränkt werden, weil ein rechtlicher Betreuer nach § 1814 Abs. 1 BGB bestellt worden ist oder bestellt werden könnte.</p>
<h4>Zwei Stoßrichtungen</h4>
<ol><li><b>Vorrang anderer Hilfen:</b> Leistungsträger sollen mit der Betreuungsbehörde zusammenarbeiten, damit eine rechtliche Betreuung durch andere Hilfen (Beratung, Assistenz, Antragshilfe) vermieden werden kann – das entspricht dem Erforderlichkeitsgrundsatz des Betreuungsrechts.</li><li><b>Kein Abschieben auf die Betreuung:</b> Eine Leistung (Assistenz, Haushaltsunterstützung, Beratung) darf nicht mit dem Hinweis verweigert werden, das könne doch der Betreuer erledigen. Rechtliche Betreuung ist rechtliche Vertretung und Unterstützung, keine soziale Dienstleistung, die Sozialleistungen ersetzt.</li></ol>
<div class="mark"><b>Merksatz:</b> Die rechtliche Betreuung ist kein Ersatz für Sozialleistungen. Wer betreut wird, hat dieselben sozialen Rechte wie alle anderen.</div>`,
 f:'Typische Prüfungsfrage: Darf der Träger eine Haushaltshilfe wegen bestehender Betreuung ablehnen? Nein, § 17 Abs. 4 Satz 2 SGB I; es zählen allein die Voraussetzungen des Leistungsgesetzes.',
 q:['Darf ein Leistungsträger Assistenzleistungen mit dem Hinweis ablehnen, es gebe doch einen Betreuer?','Nein. § 17 Abs. 4 Satz 2 SGB I verbietet es, soziale Rechte wegen einer bestehenden oder möglichen Betreuung abzulehnen, zu versagen oder einzuschränken. Maßgeblich sind allein die Voraussetzungen der jeweiligen Leistungsnorm.'],
 rel:['n_gg3','f1_2','n_sozrechte'],l:LK(['SGB I',17],['SGB I',10])});
N('n_eu','t_grund','Europäische und internationale Bezüge',{p:'UN-BRK · VO 883/2004',k:['EU|883'],m:[1],src:'Weitere',sum:'Völkerrecht bindet den Gesetzgeber und leitet die Auslegung; EU-Recht koordiniert (nicht harmonisiert) die Sozialsysteme.',
 b:`<h4>Völkerrechtliche Verträge</h4>
<ul><li><b>UN-Sozialpakt:</b> Art. 9 erkennt das Recht auf soziale Sicherheit an.</li><li><b>UN-Behindertenrechtskonvention (UN-BRK):</b> seit 2009 in Deutschland geltendes Bundesrecht im Rang eines einfachen Gesetzes; wichtig sind Art. 19 (unabhängige Lebensführung), Art. 28 (angemessener Lebensstandard, sozialer Schutz); Art. 12 (gleiche Anerkennung vor dem Recht) wird in Modul 2 vertieft. Sie dient als Auslegungshilfe.</li><li><b>Europäische Sozialcharta</b> des Europarats: Rechte auf soziale Sicherheit, Fürsorge und soziale Dienste.</li></ul>
<p>Völkerrechtliche Verträge begründen in der Regel <b>keine unmittelbar einklagbaren Einzelansprüche</b>, binden aber den Gesetzgeber und sind bei der Auslegung zu berücksichtigen.</p>
<h4>Recht der Europäischen Union</h4>
<p>Die EU <b>harmonisiert</b> die Sozialleistungssysteme nicht, sie <b>koordiniert</b> sie, damit Menschen, die ihre Freizügigkeit nutzen, keine Nachteile erleiden. Zentrale Grundlage ist die Verordnung (EG) Nr. 883/2004: Sie regelt, welcher Staat zuständig ist, dass Versicherungszeiten aus verschiedenen Mitgliedstaaten zusammengerechnet werden und dass Geldleistungen grundsätzlich auch bei Wohnsitz in einem anderen Mitgliedstaat gezahlt werden. Das Grundgesetz öffnet sich dem Unionsrecht in Art. 23 Abs. 1 GG; im SGB I hält <b>§ 30 Abs. 2 SGB I</b> den Vorrang des über- und zwischenstaatlichen Rechts fest.</p>
<p><b>Praxisbezug Sachsen:</b> In der Grenzregion zu Polen und Tschechien sind grenzüberschreitende Erwerbsbiografien häufig. Wer früher dort gearbeitet hat, kann auch dort einen Rentenanspruch haben; der Antrag kann in der Regel beim deutschen Rentenversicherungsträger gestellt werden, der ihn weiterleitet (vertieft in Einheit 8).</p>`,
 f:'Harmonisierung (Angleichung) ≠ Koordinierung (Zusammenspiel regeln). Zeiten werden zusammengerechnet, Leistungen exportiert.',rel:['n_s30','f1_3','n_rente'],l:LK(['GG',23])});
N('n_s30','t_grund','Geltungsbereich des SGB',{p:'§ 30 SGB I',k:['SGB I|30'],m:[1],src:'SGBI',sum:'Das SGB gilt für alle Personen mit Wohnsitz oder gewöhnlichem Aufenthalt im Inland; über- und zwischenstaatliches Recht bleibt unberührt.',
 b:`<p><b>§ 30 SGB I</b> knüpft an den <b>Wohnsitz</b> oder den <b>gewöhnlichen Aufenthalt</b> an – nicht an die Staatsangehörigkeit. Wohnsitz hat, wer eine Wohnung unter Umständen innehat, die darauf schließen lassen, dass er sie beibehalten und benutzen wird. Gewöhnlichen Aufenthalt hat, wer sich unter Umständen aufhält, die erkennen lassen, dass er an diesem Ort oder in diesem Gebiet nicht nur vorübergehend verweilt. Abs. 2: Regelungen des über- und zwischenstaatlichen Rechts (insbesondere EU-Recht) bleiben unberührt.</p>`,
 f:'Nicht die Staatsangehörigkeit entscheidet, sondern Wohnsitz oder gewöhnlicher Aufenthalt (Ausschlüsse im Einzelnen in den Leistungsgesetzen).',rel:['n_eu','f1_3'],l:LK(['SGB I',30])});

/* Fälle Einheit 1 */
N('f1_1','t_faelle','Fall 1.1: Herr K. und der Kühlschrank',{p:'Fall',m:[1],src:'Weitere',sum:'Verfassung als Argument, aber nicht als Anspruchsgrundlage – und der erste praktische Schritt.',
 b:`<h4>Sachverhalt</h4><p>Herr K., 52 Jahre, lebt allein in einer Mietwohnung in Dresden und leidet an einer rezidivierenden Depression. Sie sind seit drei Wochen als Betreuerin bzw. Betreuer bestellt (Vermögenssorge, Vertretung gegenüber Behörden und Sozialleistungsträgern). Beim ersten Hausbesuch: leerer Kühlschrank, angedrohte Stromsperre, ungeöffnete Post vom Jobcenter. Herr K.: „Der Staat hat mich doch längst aufgegeben.“ In der Post: zwei versäumte Termine beim Jobcenter und eine Anhörung zu einer möglichen Leistungsminderung. Er hat die Briefe aus Angst nicht geöffnet.</p>
<h4>Fragen</h4><ol><li>Kann sich Herr K. unmittelbar auf Art. 1 Abs. 1 GG berufen, um ungekürzte Leistungen zu erhalten?</li><li>Welche Bedeutung hat die Verfassung trotzdem?</li><li>Was ist der erste praktische Schritt?</li></ol>
<details><summary>Lösungshinweise</summary><ol><li><b>Nein, nicht unmittelbar.</b> Das Existenzminimum wird durch den Gesetzgeber konkretisiert; Ansprüche folgen aus dem SGB II (§ 31 SGB I, § 2 Abs. 1 Satz 2 SGB I). <a data-go="n_gg1">Art. 1 GG</a>.</li><li>Die Verfassung wirkt über <b>Auslegung und Ermessen</b>: Eine Minderung muss verhältnismäßig sein (BVerfG 2019), Schutzregeln für psychisch Erkrankte sind zu beachten, Mitwirkung darf nur in zumutbarem Umfang verlangt werden.</li><li><b>Fristen sichern:</b> Post sichten, die Anhörung fristgerecht beantworten, Termin beim Jobcenter wahrnehmen oder neu vereinbaren, auf die Erkrankung hinweisen und wichtige Gründe darlegen; parallel Strom/Energie sichern. Siehe <a data-go="n_anhoerung">Anhörung</a> und <a data-go="n_mitw">Mitwirkung</a>.</li></ol></details>`,
 rel:['n_gg1','n_gg20','n_neu2026','n_anhoerung','n_pflv'],l:[]});
N('f1_2','t_faelle','Fall 1.2: „Das macht doch Ihre Betreuerin“',{p:'Fall',m:[1],src:'SGBI',sum:'Eine Leistung darf nicht mit dem Hinweis auf die Betreuung abgelehnt werden.',
 b:`<h4>Sachverhalt</h4><p>Frau L., 41 Jahre, lebt mit einer leichten Intelligenzminderung in einer eigenen Wohnung. Sie beantragt beim zuständigen Leistungsträger Unterstützung bei der Haushaltsführung und beim Einkaufen. Die Sachbearbeiterin erklärt der Betreuerin: „Frau L. hat doch Sie als Betreuerin. Dann brauchen wir keine weitere Unterstützung zu bewilligen.“</p>
<h4>Fragen</h4><ol><li>Ist diese Argumentation zulässig?</li><li>Welche Verfassungsnorm steht dahinter?</li></ol>
<details><summary>Lösungshinweise</summary><ol><li><b>Nein.</b> § 17 Abs. 4 Satz 2 SGB I verbietet es, soziale Rechte wegen einer Betreuung abzulehnen oder einzuschränken. Rechtliche Betreuung ist keine soziale Dienstleistung. Maßgeblich sind nur die Voraussetzungen der Leistungsnorm. Der Antrag ist zu bescheiden; gegen eine Ablehnung hilft der Widerspruch.</li><li>Das Benachteiligungsverbot wegen Behinderung, Art. 3 Abs. 3 Satz 2 GG (siehe <a data-go="n_gg3">Gleichheit, Behinderung und Familie</a>).</li></ol></details>`,
 rel:['n_s17','n_gg3','n_wid'],l:[]});
N('f1_3','t_faelle','Fall 1.3: Rente aus zwei Ländern',{p:'Fall',m:[1],src:'Weitere',sum:'Deutsches Sozialrecht für Menschen mit Wohnsitz im Inland und Koordinierung ausländischer Versicherungszeiten.',
 b:`<h4>Sachverhalt</h4><p>Herr P., 64 Jahre, polnischer Staatsangehöriger, lebt seit 20 Jahren in Görlitz. Er hat zehn Jahre in Polen und 25 Jahre in Deutschland gearbeitet. Nach einem Schlaganfall wurde eine Betreuung eingerichtet. Er fragt, ob er in Deutschland überhaupt Sozialleistungen bekommen kann, da er „kein Deutscher“ sei, und ob seine polnischen Arbeitsjahre „verloren“ seien.</p>
<h4>Fragen</h4><ol><li>Gilt das deutsche Sozialrecht für Herrn P.?</li><li>Was geschieht mit den polnischen Versicherungszeiten?</li></ol>
<details><summary>Lösungshinweise</summary><ol><li><b>Ja.</b> § 30 Abs. 1 SGB I knüpft an Wohnsitz oder gewöhnlichen Aufenthalt an, nicht an die Staatsangehörigkeit.</li><li>Sie gehen nicht verloren: Nach VO (EG) 883/2004 werden Versicherungszeiten aus verschiedenen Mitgliedstaaten zusammengerechnet; der Antrag kann in der Regel beim deutschen Rentenversicherungsträger gestellt werden, der ihn weiterleitet. Vertiefung: <a data-go="n_rente">Rentenversicherung</a>.</li></ol></details>`,
 rel:['n_s30','n_eu','n_rente'],l:[]});

/* ===== Einheit 2 ===== */
EH[2]={z:'Wo stehen die Ansprüche, wer ist zuständig? Die Einheit ordnet die Sozialgesetzbücher in vier Grundtypen (Vorsorge, Entschädigung, Hilfe, Förderung), erklärt Leistungsarten und Träger nach SGB I und stellt die Soziale Entschädigung nach SGB XIV im Detail vor.',
 ks:['Das SGB besteht aus SGB I bis XII und XIV sowie den besonderen Teilen nach § 68 SGB I. SGB I und SGB X gelten als allgemeine Regeln für alle Bereiche (§ 37 SGB I).','Vier Grundtypen: Vorsorge, Entschädigung, Hilfe, Förderung. Hilfe (SGB II, SGB XII) ist nachrangig.','Die sozialen Rechte der §§ 2–10 SGB I begründen keine Ansprüche, sind aber bei Auslegung und Ermessen zu beachten (§ 2 SGB I).','Die Einweisungsvorschriften §§ 18–29 SGB I zeigen, welcher Träger zuständig ist.','Soziale Entschädigung (SGB XIV, seit 2024): Hilfe insbesondere für Opfer körperlicher und psychischer Gewalt; Wahrscheinlichkeit des Zusammenhangs genügt, bei psychischen Störungen wird er unter Voraussetzungen vermutet.','Schnelle Hilfen (Traumaambulanz, Fallmanagement) im Erleichterten Verfahren; Antrag möglichst innerhalb eines Jahres nach der Tat.','Entschädigungszahlungen werden nicht auf Grundsicherungsgeld oder Sozialhilfe angerechnet und sind unpfändbar; Ansprüche aus der Unfallversicherung gehen dem SGB XIV vor.'],
 kq:[['Nennen Sie für jeden der vier Grundtypen sozialer Sicherung ein Beispiel aus dem SGB.','Vorsorge: SGB V; Entschädigung: SGB XIV; Hilfe: SGB XII; Förderung: Wohngeld.'],
 ['Eine Betreute sagt: „Laut § 9 SGB I habe ich ein Recht auf Sozialhilfe.“ Was antworten Sie?','§ 2 Abs. 1 Satz 2 SGB I: Der Anspruch ergibt sich erst aus dem SGB XII; dort sind die Voraussetzungen zu prüfen.'],
 ['Wo finden Sie schnell heraus, wer für Wohngeld zuständig ist?','In der Einweisungsvorschrift § 26 SGB I: durch Landesrecht bestimmte Behörden.'],
 ['Was bedeutet der Satz „Das SGB XIV ist kausal, das SGB IX ist final“?','Kausal: Leistung wegen einer bestimmten Ursache; final: Leistung wegen des Bedarfs, unabhängig von der Ursache (§ 10 SGB I).'],
 ['Eine Betreute wurde vor 14 Monaten Opfer eines Überfalls. Kann sie noch Traumaambulanz und rückwirkende Entschädigung erhalten?','Die Frühintervention nach § 32 SGB XIV setzt die erste Sitzung innerhalb von zwölf Monaten voraus – das ist verstrichen; möglich bleibt § 33 SGB XIV bei akuter Belastung. Rückwirkende Leistungen ab dem Ereignis gibt es nach § 11 Abs. 2 nur bei Antrag innerhalb eines Jahres (außer unverschuldeter Verhinderung); sonst ab dem Antragsmonat.'],
 ['Eine Betreute erhält 452 Euro Entschädigungszahlung und Grundsicherung nach SGB XII. Das Sozialamt will die Zahlung anrechnen. Reaktion?','Hinweis auf § 28 Abs. 2 SGB XIV (keine Anrechnung); ggf. Widerspruch gegen den Bescheid (Einheit 9).']]};

N('n_sgbbuecher','t_system','Aufbau des Sozialgesetzbuchs',{p:'§§ 37, 68 SGB I',k:['SGB I|37','SGB I|68'],m:[2],src:'SGBI',sum:'Die Bücher des SGB, besondere Teile außerhalb der Bücher und die Klammerfunktion von SGB I und SGB X.',
 b:`<h4>Die Bücher im Überblick</h4>
<div class="tw"><table><thead><tr><th>Buch</th><th>Inhalt</th><th>Grundtyp</th></tr></thead><tbody>
<tr><td>SGB I</td><td>Allgemeiner Teil</td><td>Klammer für alle Bücher</td></tr>
<tr><td>SGB II</td><td>Grundsicherung für Arbeitsuchende (Grundsicherungsgeld)</td><td>Hilfe</td></tr>
<tr><td>SGB III</td><td>Arbeitsförderung</td><td>Vorsorge und Förderung</td></tr>
<tr><td>SGB IV</td><td>Gemeinsame Vorschriften Sozialversicherung</td><td>Vorsorge</td></tr>
<tr><td>SGB V</td><td>Gesetzliche Krankenversicherung</td><td>Vorsorge</td></tr>
<tr><td>SGB VI</td><td>Gesetzliche Rentenversicherung</td><td>Vorsorge</td></tr>
<tr><td>SGB VII</td><td>Gesetzliche Unfallversicherung</td><td>Vorsorge</td></tr>
<tr><td>SGB VIII</td><td>Kinder- und Jugendhilfe</td><td>Förderung / Hilfe</td></tr>
<tr><td>SGB IX</td><td>Rehabilitation und Teilhabe</td><td>Förderung</td></tr>
<tr><td>SGB X</td><td>Verwaltungsverfahren, Sozialdatenschutz</td><td>Verfahrensrecht</td></tr>
<tr><td>SGB XI</td><td>Soziale Pflegeversicherung</td><td>Vorsorge</td></tr>
<tr><td>SGB XII</td><td>Sozialhilfe</td><td>Hilfe</td></tr>
<tr><td>SGB XIV</td><td>Soziale Entschädigung (seit 1.1.2024 weitgehend in Kraft)</td><td>Entschädigung</td></tr></tbody></table></div>
<p>Ein Dreizehntes Buch gibt es nicht. Das SGB XIV hat zum 1. Januar 2024 insbesondere das Bundesversorgungsgesetz und das Opferentschädigungsgesetz abgelöst.</p>
<h4>Besondere Teile außerhalb der Bücher</h4>
<p><b>§ 68 SGB I</b> erklärt weitere Gesetze zu besonderen Teilen des SGB, bis sie eingeordnet sind – unter anderem BAföG, Bundeskindergeldgesetz, Wohngeldgesetz, Unterhaltsvorschussgesetz, Elterngeld (BEEG, erster und zweiter Abschnitt) und das Soldatenentschädigungsgesetz. Folge: Auch für Wohngeld, Unterhaltsvorschuss, BAföG oder Elterngeld gelten die allgemeinen Regeln des SGB I und das Verfahrensrecht des SGB X (Beratung, Antrag, Mitwirkung, Aufhebung).</p>
<h4>Klammerfunktion</h4>
<p>Nach <b>§ 37 SGB I</b> gelten SGB I und SGB X für alle Sozialleistungsbereiche, soweit die übrigen Bücher nichts Abweichendes regeln (Spezialität). „Abweichungsfest“ sind aber die §§ 1–17 und 31–36 SGB I – insbesondere Beratung, Auskunft und Antrag (§§ 14–16) und der Vorbehalt des Gesetzes (§ 31).</p>`,
 f:'Merken: §§ 1–17 und 31–36 SGB I sind abweichungsfest (§ 37 SGB I). Wohngeld, BAföG, Elterngeld, Unterhaltsvorschuss sind besondere Teile (§ 68 SGB I).',
 q:['Welche Vorschriften des SGB I können durch die besonderen Bücher nicht verdrängt werden?','Die §§ 1 bis 17 und 31 bis 36 SGB I (§ 37 Satz 2 SGB I) – insbesondere die Beratungs-, Auskunfts- und Antragsvorschriften der §§ 14–16 und der Vorbehalt des Gesetzes (§ 31).'],
 rel:['n_grundtypen','n_s31','n_beratung','n_traeger'],l:LK(['SGB I',37],['SGB I',68])});
N('n_grundtypen','t_system','Die vier Grundtypen sozialer Sicherung',{p:'§§ 3–10 SGB I',m:[2],src:'SGBI',sum:'Vorsorge, Entschädigung, Hilfe, Förderung – Finanzierung, Voraussetzung, Bedürftigkeitsprüfung und kausales oder finales Prinzip im Vergleich.',
 b:`<div class="tw"><table><thead><tr><th>Merkmal</th><th>Vorsorge</th><th>Entschädigung</th><th>Hilfe</th><th>Förderung</th></tr></thead><tbody>
<tr><td>Leitgedanke</td><td>Absicherung durch eigene Beiträge gegen typische Lebensrisiken</td><td>Staat steht für einen Gesundheitsschaden mit besonderer Verantwortung ein</td><td>Existenzminimum bei Bedürftigkeit, nachrangig zu allen anderen Mitteln</td><td>Ausgleich von Belastungen, Chancengleichheit</td></tr>
<tr><td>Soziales Recht (SGB I)</td><td>§ 4</td><td>§ 5</td><td>§ 9; § 19a</td><td>§§ 3, 6, 7, 8, 10</td></tr>
<tr><td>Gesetze</td><td>SGB III, V, VI, VII, XI</td><td>SGB XIV, SEG</td><td>SGB II, SGB XII</td><td>BAföG, BKGG, WoGG, SGB VIII, SGB IX</td></tr>
<tr><td>Finanzierung</td><td>überwiegend Beiträge</td><td>Steuern</td><td>Steuern</td><td>Steuern</td></tr>
<tr><td>Bedürftigkeitsprüfung</td><td>nein</td><td>grundsätzlich nein</td><td>ja (Nachrang)</td><td>teils ja (Wohngeld), teils nein</td></tr>
<tr><td>Prinzip</td><td>kausal und final gemischt</td><td><b>kausal</b></td><td><b>final</b></td><td>überwiegend final</td></tr>
<tr><td>Beispiele</td><td>Krankenbehandlung, Rente, Pflegegeld</td><td>Entschädigungszahlung, Traumaambulanz</td><td>Grundsicherungsgeld, Sozialhilfe</td><td>BAföG, Kindergeld, Wohngeld, Eingliederungshilfe</td></tr></tbody></table></div>
<div class="mark"><b>Merksatz Kausal/Final:</b> Kausal fragt: Warum ist der Schaden entstanden? Final fragt: Was wird jetzt gebraucht? § 10 SGB I („unabhängig von der Ursache der Behinderung“) ist final; das SGB XIV ist kausal (Leistungen für „schädigungsbedingte Bedarfe“, § 25 SGB XIV).</div>
<h4>Zuordnungsübung (Beispiele)</h4>
<ul><li>Sturz auf dem Arbeitsweg → Vorsorge, Unfallversicherung (§ 22 SGB I), Berufsgenossenschaft/Unfallkasse</li><li>Rentnerin, Rente reicht nicht → Hilfe, Grundsicherung im Alter (§ 28 Abs. 1 Nr. 1a SGB I), Kreis/kreisfreie Stadt</li><li>Erwerbsfähiger, arbeitslos ohne ALG → Hilfe, § 19a SGB I, Jobcenter</li><li>Opfer eines Überfalls mit Angststörung → Entschädigung, § 24 SGB I, KSV Sachsen</li><li>Hilfe bei der Körperpflege nach Schlaganfall → Vorsorge, Pflegeversicherung (§ 21a SGB I), Pflegekasse</li><li>Geringverdiener-Familie ohne Bedürftigkeit im SGB-II-Sinn → Förderung, Wohngeld (§ 26 SGB I)</li><li>Depression, nur zwei Stunden täglich arbeitsfähig → Vorsorge, Rentenversicherung (§ 23 SGB I)</li><li>Dauerhafter Nervenschaden nach empfohlener Impfung → Entschädigung (§ 24 SGB I, § 24 SGB XIV)</li><li>Jugendlicher braucht Hilfe zur Erziehung → Jugendamt (§ 27 SGB I)</li><li>Assistenz zum Wohnen bei geistiger Behinderung → Eingliederungshilfe (§ 28a SGB I, Modul 9)</li></ul>`,
 f:'Hilfe (Fürsorge) kommt zuletzt: erst Vorsorge, Entschädigung und Förderung prüfen, dann SGB II/XII (Nachrangprinzip).',
 q:['Was unterscheidet kausale von finalen Leistungen?','Kausal: Leistung wegen einer bestimmten Schadensursache (z. B. SGB XIV). Final: Leistung wegen des aktuellen Bedarfs, gleich aus welcher Ursache (z. B. Grundsicherung, § 10 SGB I).'],
 rel:['n_sozrechte','n_traeger','n_zustaendig','n_sgb14_1'],l:LK(['SGB I',4],['SGB I',5],['SGB I',9],['SGB I',10])});
N('n_sozrechte','t_system','Soziale Rechte: Programm, kein Anspruch',{p:'§§ 2–10 SGB I',k:['SGB I|2','SGB I|4','SGB I|5','SGB I|9'],m:[2],src:'SGBI',sum:'Aus den sozialen Rechten allein folgt kein Anspruch – sie sind Auslegungs- und Ermessensmaßstab.',
 b:`<p>Die §§ 3 bis 10 SGB I ordnen die Sozialleistungen nach „sozialen Rechten“: Bildung und Arbeitsförderung (§ 3), Sozialversicherung (§ 4), Soziale Entschädigung (§ 5), Minderung des Familienaufwands (§ 6), Zuschuss für eine angemessene Wohnung (§ 7), Kinder- und Jugendhilfe (§ 8), Sozialhilfe (§ 9) und Teilhabe behinderter Menschen (§ 10).</p>
<h4>Die zwei Botschaften des § 2 SGB I</h4>
<ol><li><b>Keine Ansprüche aus den sozialen Rechten allein</b> (Abs. 1 Satz 2): Die §§ 3–10 sind Programmsätze. Wer sich auf „§ 9 SGB I“ beruft, hat noch keinen Anspruch begründet. Maßgeblich ist immer die konkrete Anspruchsnorm im Leistungsgesetz, etwa im SGB II oder SGB XII.</li><li><b>Auslegungs- und Ermessensmaßstab</b> (Abs. 2): Bei der Auslegung unklarer Vorschriften und bei Ermessensentscheidungen müssen die Behörden die sozialen Rechte „möglichst weitgehend“ verwirklichen. Dieses Argument kann in Widerspruchsbegründungen eingesetzt werden.</li></ol>
<h4>Beispiele für den Inhalt</h4>
<ul><li><b>§ 4:</b> Recht auf Zugang zur Sozialversicherung; Versicherte haben ein Recht auf Maßnahmen zum Schutz und zur Wiederherstellung der Gesundheit und auf wirtschaftliche Sicherung bei Krankheit, Mutterschaft, Minderung der Erwerbsfähigkeit und Alter.</li><li><b>§ 5:</b> Wer einen Gesundheitsschaden erleidet, für dessen Folgen die staatliche Gemeinschaft in Abgeltung eines besonderen Opfers einsteht, hat ein Recht auf Gesundheitsmaßnahmen und angemessene wirtschaftliche Versorgung.</li><li><b>§ 9:</b> Recht auf persönliche und wirtschaftliche Hilfe für den, der sich nicht selbst helfen kann und anderweitig keine ausreichende Hilfe erhält; Leistungsberechtigte müssen nach ihren Kräften mitwirken.</li><li><b>§ 10:</b> Menschen mit (drohender) Behinderung haben unabhängig von der Ursache ein Recht auf Hilfe zur Förderung von Selbstbestimmung und gleichberechtigter Teilhabe (final).</li></ul>`,
 f:'Typische Frage: Kann man sich auf § 9 SGB I berufen? Nein – nur Programmsatz; Anspruch erst aus SGB II/XII. Aber § 2 Abs. 2: Maßstab bei Auslegung und Ermessen.',
 q:['Welche zwei Aussagen enthält § 2 SGB I?','(1) Aus den sozialen Rechten der §§ 3–10 können Ansprüche nur nach Maßgabe der besonderen Teile geltend gemacht werden. (2) Die sozialen Rechte sind bei Auslegung und Ermessensausübung zu beachten und möglichst weitgehend zu verwirklichen.'],
 rel:['n_grundtypen','n_ermessen','n_s31','n_gg20'],l:LK(['SGB I',2],['SGB I',4],['SGB I',5],['SGB I',9],['SGB I',10])});
N('n_traeger','t_system','Leistungsarten und Leistungsträger',{p:'§§ 11–29 SGB I',k:['SGB I|11','SGB I|12','SGB I|19a','SGB I|28','SGB I|21','SGB I|22','SGB I|23','SGB I|24','SGB I|26'],m:[2],src:'SGBI',sum:'Dienst-, Sach- und Geldleistungen; die Einweisungsvorschriften §§ 18–29 SGB I als Navigationsinstrument zum zuständigen Träger.',
 b:`<h4>Leistungsarten (§ 11 SGB I)</h4>
<ul><li><b>Dienstleistung:</b> Beratung, Fallmanagement, persönliche Hilfe, Pflegeberatung</li><li><b>Sachleistung:</b> Krankenbehandlung, Hilfsmittel, Pflegesachleistung</li><li><b>Geldleistung:</b> Rente, Krankengeld, Grundsicherungsgeld, Entschädigungszahlung</li></ul>
<h4>Leistungsträger (§ 12 SGB I) und Einweisungsvorschriften (§§ 18–29)</h4>
<p>Zuständig sind die in den §§ 18–29 genannten Körperschaften, Anstalten und Behörden. Die Einweisungsvorschriften begründen selbst keine Ansprüche, sind aber ein hervorragendes Navigationsinstrument.</p>
<div class="tw"><table><thead><tr><th>§ SGB I</th><th>Bereich</th><th>Zuständig (vereinfacht)</th></tr></thead><tbody>
<tr><td>18</td><td>Ausbildungsförderung</td><td>Ämter/Landesämter für Ausbildungsförderung</td></tr>
<tr><td>19</td><td>Arbeitsförderung</td><td>Agenturen für Arbeit</td></tr>
<tr><td>19a</td><td>Grundsicherung für Arbeitsuchende</td><td>Jobcenter (Agentur für Arbeit und kommunale Träger), ggf. zugelassene kommunale Träger</td></tr>
<tr><td>21</td><td>Krankenversicherung</td><td>Krankenkassen</td></tr>
<tr><td>21a</td><td>Soziale Pflegeversicherung</td><td>Pflegekassen bei den Krankenkassen</td></tr>
<tr><td>22</td><td>Unfallversicherung</td><td>Berufsgenossenschaften, Unfallkassen</td></tr>
<tr><td>23</td><td>Rentenversicherung</td><td>Deutsche Rentenversicherung</td></tr>
<tr><td>24</td><td>Soziale Entschädigung</td><td>nach Bundes-/Landesrecht bestimmte Träger (Sachsen: KSV)</td></tr>
<tr><td>25</td><td>Kindergeld, Kinderzuschlag, Elterngeld, Bildung und Teilhabe</td><td>Familienkassen, Elterngeldstellen</td></tr>
<tr><td>26</td><td>Wohngeld</td><td>durch Landesrecht bestimmte Behörden</td></tr>
<tr><td>27</td><td>Kinder- und Jugendhilfe</td><td>Kreise und kreisfreie Städte</td></tr>
<tr><td>28</td><td>Sozialhilfe</td><td>Kreise, kreisfreie Städte, überörtliche Träger</td></tr>
<tr><td>28a</td><td>Eingliederungshilfe</td><td>durch Landesrecht bestimmte Behörden</td></tr>
<tr><td>29</td><td>Rehabilitation und Teilhabe</td><td>Rehabilitationsträger, Integrationsämter</td></tr></tbody></table></div>
<p><b>§ 19a SGB I</b> nennt für die Grundsicherung für Arbeitsuchende Leistungen zur Eingliederung in Arbeit und zur Sicherung des Lebensunterhalts; <b>§ 28 SGB I</b> für die Sozialhilfe: Hilfe zum Lebensunterhalt, Grundsicherung im Alter und bei Erwerbsminderung, Hilfen zur Gesundheit, Hilfe zur Pflege, Hilfe zur Überwindung besonderer sozialer Schwierigkeiten und Hilfe in anderen Lebenslagen samt Beratung und Unterstützung.</p>
<div class="mark"><b>Praxistipp:</b> Wer nicht weiß, welche Stelle zuständig ist, liest zuerst die passende Einweisungsvorschrift. Und wer sich irrt, verliert nichts: Ein unzuständiger Leistungsträger muss den Antrag unverzüglich weiterleiten (§ 16 Abs. 2 SGB I); der Antrag gilt als zum Zeitpunkt des Eingangs gestellt.</div>`,
 f:'Einweisungsvorschriften §§ 18–29 SGB I sicher nutzen: Bereich → Träger. Antrag beim falschen Träger schadet nicht (§ 16 SGB I).',
 q:['Wo steht, welcher Träger für welchen Leistungsbereich zuständig ist, und begründet das Ansprüche?','In den Einweisungsvorschriften der §§ 18–29 SGB I. Sie begründen selbst keine Ansprüche, sondern weisen den Bereich und den Träger aus; die Anspruchsnorm steht im jeweiligen Leistungsgesetz.'],
 rel:['n_grundtypen','n_antrag','n_zustaendig','n_gg74'],l:LK(['SGB I',11],['SGB I',12],['SGB I',19],['SGB I',28])});
N('n_ermessen','t_system','Anspruch und Ermessen',{p:'§§ 38, 39 SGB I',k:['SGB I|38','SGB I|39'],m:[2,3],src:'SGBI',sum:'„Hat Anspruch“, „soll“, „kann“: Die Formulierung im Gesetz zeigt, ob gebunden oder nach Ermessen zu entscheiden ist.',
 b:`<p><b>§ 38 SGB I:</b> Auf Sozialleistungen besteht ein Rechtsanspruch, soweit nicht die besonderen Teile die Leistungsträger zu Ermessensentscheidungen ermächtigen. <b>§ 39 Abs. 1 SGB I:</b> Das Ermessen ist entsprechend dem Zweck der Ermächtigung auszuüben, die gesetzlichen Grenzen sind einzuhalten; auf pflichtgemäße Ausübung besteht ein Anspruch.</p>
<div class="tw"><table><thead><tr><th>Formulierung im Gesetz</th><th>Bedeutung</th></tr></thead><tbody><tr><td>„hat Anspruch“, „erhält“, „ist zu erbringen“</td><td>gebundene Entscheidung: Liegen die Voraussetzungen vor, muss geleistet werden</td></tr><tr><td>„soll“</td><td>Regelfall: Leistung ist zu erbringen, außer in atypischen Fällen</td></tr><tr><td>„kann“, „darf“</td><td>Ermessen: Behörde wählt, muss aber pflichtgemäß abwägen</td></tr></tbody></table></div>
<p>Ermessensfehler (Nicht-, Über- und Unterschreitung, Fehlgebrauch) werden in Einheit 3 und 9 vertieft.</p>`,
 f:'Sprachliche Erkennungszeichen kennen: Anspruch / soll / kann.',rel:['n_sozrechte','n_s35','n_wid'],l:LK(['SGB I',38],['SGB I',39])});
N('n_zustaendig','t_system','Prüfschema „Wer ist zuständig?“',{p:'Praxis',m:[2],src:'SGBI',sum:'Sechs Schritte von der Lebenslage zum Antrag beim richtigen Träger.',
 b:`<ol><li><b>Lebenslage beschreiben:</b> Was ist passiert? Was wird gebraucht?</li><li><b>Grundtyp bestimmen:</b> Vorsorge? Entschädigung? Förderung? Hilfe (zuletzt!)</li><li><b>Einweisungsvorschrift lesen</b> (§§ 18–29 SGB I) → Leistungsbereich und Träger</li><li><b>Vorrang prüfen:</b> z. B. § 8 Abs. 3 / § 28 Abs. 1 SGB XIV; Nachrang von SGB II/XII (Einheit 4–7)</li><li><b>Anspruchsnorm im Leistungsgesetz suchen</b> (nicht im SGB I!)</li><li><b>Antrag stellen – im Zweifel lieber zu früh</b> (§ 16 SGB I, § 10 SGB XIV) → Einheit 3</li></ol>`,
 f:'Kernschema der Betreuungspraxis; Wiederholung in der Fallarbeit Einheit 10.',rel:['n_grundtypen','n_traeger','n_antrag','n_faelleprf'],l:[]});

N('n_sgb14_1','t_entsch','Aufgabe, schädigende Ereignisse und Berechtigte',{p:'§§ 1, 2, 7 SGB XIV',k:['SGB XIV|1','SGB XIV|2','SGB XIV|7'],m:[2],src:'SGBXIV',sum:'Der Staat steht bei Gewalttaten, Kriegsauswirkungen, Zivildienst und Schutzimpfungen für gesundheitliche Schäden ein.',
 b:`<p><b>§ 1 SGB XIV:</b> Die Soziale Entschädigung unterstützt Menschen, die durch ein schädigendes Ereignis, für das die staatliche Gemeinschaft besondere Verantwortung trägt, eine gesundheitliche Schädigung erlitten haben. Schädigende Ereignisse sind <b>Gewalttaten</b>, <b>Kriegsauswirkungen</b> beider Weltkriege, Ereignisse im Zusammenhang mit dem <b>Zivildienst</b> und <b>Schutzimpfungen</b> oder andere Maßnahmen der spezifischen Prophylaxe. Das Ereignis kann zeitlich begrenzt, wiederkehrend oder länger einwirkend sein (Abs. 3).</p>
<p><b>Warum der Staat einsteht:</b> Bei Gewalttaten hat er sein Gewaltmonopol und seinen Schutzauftrag nicht erfolgreich durchgesetzt; bei Impfschäden hat er die Impfung empfohlen oder angeordnet; bei Zivildienst und Kriegsfolgen hat er Menschen einer besonderen Gefahr ausgesetzt – der Gedanke des „besonderen Opfers“ (§ 5 SGB I).</p>
<h4>Berechtigte (§ 2 SGB XIV)</h4>
<ul><li><b>Geschädigte:</b> unmittelbar gesundheitlich geschädigt</li><li><b>Angehörige:</b> Ehegatten, Kinder (auch Stief- und Pflegekinder im Haushalt), Eltern</li><li><b>Hinterbliebene:</b> Witwen, Witwer, Waisen, Eltern, Betreuungsunterhaltsberechtigte</li><li><b>Nahestehende:</b> Geschwister und Personen in einer ehe-ähnlichen Lebensgemeinschaft</li></ul>
<p><b>§ 7 SGB XIV:</b> Ausländerinnen und Ausländer haben dieselben Ansprüche wie Deutsche.</p>`,
 f:'Vier schädigende Ereignisse und vier Berechtigtengruppen aufzählen können.',rel:['n_sgb14_4','n_sgb14_13','n_grundtypen'],l:LK(['SGB XIV',1],['SGB XIV',2],['SGB XIV',7])});
N('n_sgb14_4','t_entsch','Anspruch, Kausalität und Grad der Schädigungsfolgen',{p:'§§ 4, 5, 117 SGB XIV',k:['SGB XIV|4','SGB XIV|5','SGB XIV|117'],m:[2],src:'SGBXIV',sum:'Wahrscheinlichkeit genügt; bei psychischen Störungen wird der Zusammenhang vermutet; Angaben der antragstellenden Person können Beweismittel ersetzen.',
 b:`<p><b>§ 4 Abs. 1 SGB XIV:</b> Geschädigte haben Anspruch auf Leistungen wegen der anerkannten gesundheitlichen und wirtschaftlichen Folgen einer Schädigung, die ursächlich auf ein schädigendes Ereignis zurückzuführen ist. Die Voraussetzungen sind auf Antrag festzustellen. Erweiterungen gelten u. a. für Unfälle auf Wegen zu Leistungen nach dem SGB XIV oder bei der Strafanzeige und für Hilfsmittel am Körper.</p>
<div class="mark"><b>Kausalkette:</b> schädigendes Ereignis → gesundheitliche Schädigung (Primärschaden) → Schädigungsfolge (dauerhafte Gesundheitsstörung, GdS nach § 5) → Leistungen (§ 3).</div>
<h4>Zwei Erleichterungen</h4>
<ul><li><b>Wahrscheinlichkeit statt Gewissheit (§ 4 Abs. 4):</b> Es genügt, dass nach dem Stand der medizinischen Wissenschaft mehr für als gegen einen ursächlichen Zusammenhang spricht.</li><li><b>Vermutung bei psychischen Gesundheitsstörungen (§ 4 Abs. 5):</b> Wenn das Ereignis nach Art und Schwere geeignet ist, eine psychische Störung zu verursachen, wird der Zusammenhang vermutet, solange kein anderer Kausalverlauf nachgewiesen wird. Das ist erheblich, weil bei Vorerkrankungen häufig eingewandt wird, die Störung habe „schon vorher bestanden“.</li></ul>
<p><b>Beweiserleichterung (§ 117 Abs. 1):</b> Sind Beweismittel nicht vorhanden, nicht zu beschaffen oder ohne Verschulden verloren, sind die Angaben der antragstellenden Person der Entscheidung zugrunde zu legen, soweit sie nach den Umständen glaubhaft erscheinen.</p>
<h4>Grad der Schädigungsfolgen (§ 5)</h4>
<p>Der GdS wird nach den allgemeinen Auswirkungen der anerkannten Gesundheitsstörungen in allen Lebensbereichen in Zehnergraden von 10 bis 100 bemessen. Vorübergehende Störungen (bis zu sechs Monate) bleiben unberücksichtigt. Der <b>GdS</b> erfasst nur schädigungsbedingte Störungen, der <b>GdB</b> (SGB IX) alle Beeinträchtigungen unabhängig von der Ursache – wieder kausal versus final.</p>`,
 f:'Typische Frage: Welche Beweis- und Kausalitätserleichterungen gelten im SGB XIV? Antwort: Wahrscheinlichkeit (§ 4 Abs. 4), Vermutung bei psychischen Störungen (§ 4 Abs. 5), Glaubhaftmachung (§ 117).',
 q:['Wie wirkt sich eine psychische Vorerkrankung auf den Ursachenzusammenhang im SGB XIV aus?','Es genügt die Wahrscheinlichkeit (§ 4 Abs. 4). Bei psychischen Störungen wird der Zusammenhang vermutet, wenn das Ereignis nach Art und Schwere geeignet ist, die Störung zu verursachen, und kein anderer Kausalverlauf nachgewiesen ist (§ 4 Abs. 5). Eine Vorerkrankung schließt den Anspruch daher nicht aus.'],
 rel:['n_sgb14_13','n_sgb14_3','f2_1'],l:LK(['SGB XIV',4],['SGB XIV',5],['SGB XIV',117])});
N('n_sgb14_13','t_entsch','Gewalttaten: Opferbegriff, Ausschluss, Versagung',{p:'§§ 13–17 SGB XIV',k:['SGB XIV|13','SGB XIV|14','SGB XIV|15','SGB XIV|16','SGB XIV|17'],m:[2],src:'SGBXIV',sum:'Körperliche und psychische Gewalttaten, Gleichstellungen, Ausschluss bei vorwerfbarer Verursachung und Versagung bei fehlender Aufklärungsbeitrag.',
 b:`<p><b>§ 13:</b> Opfer ist, wer im Inland (oder auf deutschem Schiff/Luftfahrzeug) eine gesundheitliche Schädigung erlitten hat durch einen vorsätzlichen, rechtswidrigen, unmittelbar gegen die Person gerichteten <b>tätlichen Angriff</b> (körperliche Gewalttat) oder ein sonstiges vorsätzliches, rechtswidriges, gegen die freie Willensentscheidung gerichtetes <b>schwerwiegendes Verhalten</b> (psychische Gewalttat). In der Regel schwerwiegend sind etwa sexueller Missbrauch, sexuelle Übergriffe und Nötigung, Vergewaltigung, Menschenhandel, <b>Nachstellung</b> (§ 238 Abs. 2, 3 StGB), Geiselnahme und räuberische Erpressung oder Vergleichbares.</p>
<p><b>§ 14 Gleichstellungen:</b> u. a. Beibringung von Gift, Fehlgehen der Tat, erhebliche Vernachlässigung von Kindern; Personen, die durch Miterleben der Tat oder Auffinden des Opfers geschädigt werden, stehen Opfern gleich.</p>
<p><b>§ 16:</b> Ausgeschlossen ist, wer das schädigende Ereignis in vorwerfbarer Weise verursacht hat; Leistungen dürfen dem Täter nicht wirtschaftlich zugutekommen. <b>§ 17:</b> Leistungen sind zu versagen, wenn es wegen des eigenen Verhaltens unbillig wäre; sie können ganz oder teilweise versagt werden, wenn Geschädigte nicht das Mögliche und Zumutbare zur Aufklärung und Verfolgung des Täters beitragen.</p>
<h4>Prüfschema Gewalttat</h4>
<ol><li>Geschädigte (§ 2 Abs. 2) oder gleichgestellte Person (§ 14 Abs. 2)?</li><li>Tatort im Inland / deutsches Schiff oder Luftfahrzeug (§ 13 Abs. 1); bei Auslandstaten Sonderregel § 15?</li><li>Körperliche oder psychische Gewalttat oder Gleichstellung (§ 14 Abs. 1)?</li><li>Gesundheitliche Schädigung und Kausalität (§ 4 Abs. 1, 4, 5)?</li><li>Kein Ausschluss (§ 16), keine Versagung (§ 17)?</li><li>Vorrangige Ansprüche (§ 8 Abs. 3), z. B. Arbeitsunfall?</li><li>Antrag gestellt (§ 10)? Leistungsbeginn (§ 11)?</li></ol>`,
 f:'Psychische Gewalttat ist seit der Reform einbezogen (z. B. Nachstellung). Prüfschema mit sieben Schritten beherrschen.',
 q:['Kann eine Person ohne körperlichen Angriff Opfer einer Gewalttat im Sinne des SGB XIV sein?','Ja. § 13 Abs. 1 Nr. 2 SGB XIV erfasst die psychische Gewalttat: ein vorsätzliches, rechtswidriges, schwerwiegendes Verhalten gegen die freie Willensentscheidung, z. B. Nachstellung nach § 238 Abs. 2, 3 StGB.'],
 rel:['n_sgb14_4','n_sgb14_28','f2_3','f2_4'],l:LK(['SGB XIV',13],['SGB XIV',14],['SGB XIV',16],['SGB XIV',17])});
N('n_sgb14_3','t_entsch','Leistungen der Sozialen Entschädigung und Entschädigungszahlung',{p:'§§ 3, 83, 84 SGB XIV',k:['SGB XIV|3','SGB XIV|83','SGB XIV|84','SGB XIV|110'],m:[2],src:'SGBXIV',sum:'Zwölf Leistungsgruppen von Schnellen Hilfen bis Berufsschadensausgleich; monatliche Entschädigungszahlung nach GdS (ab 1.7.2026).',
 b:`<p><b>§ 3 SGB XIV</b> (inhaltsgleich § 24 SGB I) nennt: Fallmanagement und Traumaambulanz (Schnelle Hilfen), Krankenbehandlung, Leistungen zur Teilhabe, Leistungen bei Pflegebedürftigkeit, bei Blindheit, Entschädigungszahlungen, Berufsschadensausgleich, besondere Leistungen im Einzelfall, Überführung und Bestattung, Härteausgleich, Leistungen bei Wohnsitz im Ausland sowie Besitzstände.</p>
<h4>Monatliche Entschädigungszahlung (§ 83 Abs. 1) ab 1. Juli 2026</h4>
<div class="tw"><table><thead><tr><th>GdS</th><th>Betrag pro Monat</th></tr></thead><tbody><tr><td>30 und 40</td><td>452 Euro</td></tr><tr><td>50 und 60</td><td>905 Euro</td></tr><tr><td>70 und 80</td><td>1.357 Euro</td></tr><tr><td>90</td><td>1.810 Euro</td></tr><tr><td>100</td><td>2.261 Euro</td></tr></tbody></table></div>
<p>Bei GdS 100 mit schwersten Schädigungsfolgen erhöht sich der Betrag um 20 Prozent (§ 83 Abs. 2). Die Beträge werden jeweils zum 1. Juli entsprechend der Rentenanpassung dynamisiert (§ 110; Anpassungsverordnung BGBl. 2026 I Nr. 179) – <b>vor jedem Kursdurchlauf prüfen</b>. Auf Antrag kann statt der monatlichen Zahlung eine Abfindung gewählt werden: das 60-Fache der Monatszahlung, gilt fünf Jahre ab; Antrag innerhalb eines Jahres nach Bewilligung (§ 84).</p>`,
 f:'Stufenstruktur der Beträge (GdS 30/40 → 452 €, 100 → 2.261 €) und Dynamisierung zum 1. Juli beachten.',rel:['n_sgb14_4','n_sgb14_30','n_sgb14_28'],l:LK(['SGB XIV',3],['SGB XIV',83],['SGB XIV',84])});
N('n_sgb14_30','t_entsch','Schnelle Hilfen: Fallmanagement und Traumaambulanz',{p:'§§ 30–34, 115 SGB XIV',k:['SGB XIV|30','SGB XIV|31','SGB XIV|32','SGB XIV|33','SGB XIV|34','SGB XIV|115'],m:[2],src:'SGBXIV',sum:'Niedrigschwellige Hilfe im Erleichterten Verfahren: Lotsenfunktion des Fallmanagements und bis zu 15 Sitzungen in der Traumaambulanz.',
 b:`<p>Die Schnellen Hilfen sind das Herzstück der Reform und greifen ohne langes Verwaltungsverfahren.</p>
<ul><li><b>Fallmanagement (§ 30):</b> aktivierende und koordinierende Begleitung durch Antrags- und Leistungsverfahren – nur mit <b>Einwilligung</b> der Berechtigten (schriftlich zu dokumentieren). Geschädigte <i>sollen</i> es erhalten, wenn das Ereignis eine Straftat gegen das Leben oder die sexuelle Selbstbestimmung war oder sie bei Eintritt minderjährig waren.</li><li><b>Traumaambulanz (§§ 31–34):</b> psychotherapeutische Intervention, um psychische Störungen oder deren Chronifizierung zu verhindern; bis zu <b>15 Sitzungen</b> (Kinder und Jugendliche 18). Frühintervention (§ 32): erste Sitzung innerhalb von <b>zwölf Monaten</b> nach dem Ereignis oder Kenntnisnahme; bei länger zurückliegenden Ereignissen mit akuter Belastung § 33. Die ersten fünf Sitzungen (bei Kindern acht) sind schon vor der Entscheidung im Erleichterten Verfahren möglich.</li><li><b>Erleichtertes Verfahren (§ 115):</b> summarische Prüfung genügt; der im Antrag dargelegte Sachverhalt ist als wahr zu unterstellen, wenn seine Unrichtigkeit nicht offensichtlich ist.</li></ul>
<p><b>Betreuungsführung:</b> Das Fallmanagement setzt die Einwilligung der berechtigten Person voraus. Ist sie einwilligungsfähig, entscheidet sie selbst; Betreuerin oder Betreuer unterstützen, informieren verständlich und respektieren die Entscheidung (§ 1821 BGB; Modul 2 und 11). Nach Gewalterfahrungen ist Selbstbestimmung über Hilfen ein wesentlicher Teil der Bewältigung.</p>`,
 f:'Merken: 15/18 Sitzungen, 12 Monate Frist für Frühintervention, Einwilligung beim Fallmanagement.',
 q:['Welche Frist gilt für die Frühintervention in der Traumaambulanz?','Die erste Sitzung muss innerhalb von zwölf Monaten nach dem schädigenden Ereignis oder nach Kenntnisnahme davon stattfinden (§ 32 SGB XIV); bei länger zurückliegenden Ereignissen mit akuter Belastung gilt § 33.'],
 rel:['n_sgb14_10','n_sgb14_3','f2_1'],l:LK(['SGB XIV',30],['SGB XIV',31],['SGB XIV',34],['SGB XIV',115])});
N('n_sgb14_10','t_entsch','Antrag, Leistungsbeginn und Zuständigkeit',{p:'§§ 10, 11, 113 SGB XIV',k:['SGB XIV|10','SGB XIV|11','SGB XIV|113'],m:[2],src:'SGBXIV',sum:'Antrag möglichst innerhalb eines Jahres nach der Tat – dann Leistungen rückwirkend; in Sachsen zuständig ist der KSV.',
 b:`<p><b>§ 10:</b> Leistungen werden auf Antrag erbracht. Bei gesetzlich Krankenversicherten gelten Anträge auf Krankenbehandlung zugleich als Anträge bei der Krankenkasse und umgekehrt. Für die Traumaambulanz genügt es, wenn unverzüglich nach der zweiten Sitzung ein Antrag gestellt wird.</p>
<p><b>§ 11:</b> Leistungen sind ab dem Monat zu erbringen, in dem die Voraussetzungen vorliegen, frühestens ab Antragsmonat. Ist der Antrag <b>innerhalb eines Jahres nach dem schädigenden Ereignis</b> gestellt, werden Leistungen auch für Zeiten davor erbracht; bei unverschuldeter Verhinderung verlängert sich die Frist.</p>
<div class="mark"><b>Merksatz:</b> Antrag möglichst innerhalb eines Jahres nach der Tat stellen – dann gibt es Leistungen rückwirkend ab dem Ereignis. Krankheitsbedingte Verhinderung kann die Frist verlängern und sollte ausdrücklich vorgetragen werden.</div>
<p><b>Zuständigkeit in Sachsen:</b> Für Opfer von Gewalttaten ist das Land des Wohnsitzes zuständig (§ 113 Abs. 2). In Sachsen bearbeitet der Kommunale Sozialverband Sachsen (KSV), Fachbereich Soziales Entschädigungsrecht, Chemnitz, die Anträge; der Antrag kann online über Amt24 oder per Papierformular gestellt werden. Die Formulare weisen auf die Mitwirkungspflicht (§ 60 SGB I) hin und enthalten eine Einwilligung bzw. Schweigepflichtentbindung.</p>`,
 f:'Jahresfrist (§ 11 Abs. 2) und Verhinderungsregel; KSV als sächsischer Träger.',rel:['n_sgb14_30','n_antrag','n_mitw'],l:LK(['SGB XIV',10],['SGB XIV',11],['SGB XIV',113])});
N('n_sgb14_28','t_entsch','Vorrang, Nichtanrechnung und Pfändungsschutz',{p:'§§ 8, 9, 28 SGB XIV',k:['SGB XIV|8','SGB XIV|9','SGB XIV|28'],m:[2],src:'SGBXIV',sum:'SGB XIV geht anderen Sozialleistungen vor, Entschädigungszahlungen werden nicht angerechnet und sind unpfändbar.',
 b:`<ol><li><b>Vorrang (§ 28 Abs. 1):</b> Leistungen nach dem SGB XIV gehen Leistungen anderer Träger vor. <b>Ausnahme § 8 Abs. 3:</b> Ansprüche nach dem SGB VII, dem Soldatenentschädigungsgesetz oder der beamtenrechtlichen Unfallfürsorge gehen vor, soweit sie auf derselben Ursache beruhen (z. B. Gewalt am Arbeitsplatz).</li><li><b>Nichtanrechnung (§ 28 Abs. 2):</b> Entschädigungszahlungen und bestimmte Einmalzahlungen sind weder Einkommen noch Vermögen bei anderen Sozialleistungen (Brücke zu Einheit 6 und 7). Private Versorgungsleistungen werden nicht angerechnet (Abs. 3).</li><li><b>Pfändungsschutz (§ 9):</b> Entschädigungszahlungen und die Geldleistung nach § 144 sind nicht pfändbar (Brücke zu Modul 6).</li></ol>`,
 f:'Drei Folgerungen: Vorrang (mit Ausnahme SGB VII), Nichtanrechnung, Unpfändbarkeit.',
 q:['Müssen monatliche Entschädigungszahlungen nach dem SGB XIV als Einkommen auf Grundsicherung angerechnet werden?','Nein. § 28 Abs. 2 SGB XIV: Entschädigungszahlungen werden nicht als Einkommen oder Vermögen auf andere Sozialleistungen angerechnet; außerdem sind sie nach § 9 SGB XIV unpfändbar.'],
 rel:['n_sgb14_3','n_sgb14_13','f2_2','n_zufluss'],l:LK(['SGB XIV',28],['SGB XIV',8],['SGB XIV',9])});

/* Fälle Einheit 2 */
N('f2_1','t_faelle','Fall 2.1: Der Überfall am Albertplatz',{p:'Fall',m:[2],src:'SGBXIV',sum:'Körperliche Gewalttat, psychische Vorerkrankung, Schnelle Hilfen und Nichtanrechnung.',
 b:`<h4>Sachverhalt</h4><p>Frau S., 38 Jahre, lebt mit einer paranoiden Schizophrenie in Dresden, bezieht volle Erwerbsminderungsrente und ergänzend Grundsicherung bei Erwerbsminderung (SGB XII). Sie sind ihr Betreuer (Gesundheitssorge, Vermögenssorge, Vertretung gegenüber Behörden und Leistungsträgern). Vor vier Monaten wurde sie an einer Haltestelle von einem Unbekannten zu Boden gestoßen und getreten, die Handtasche wurde geraubt. Der Armbruch ist verheilt; seitdem verlässt sie kaum noch die Wohnung, schläft schlecht und hat laut Psychiaterin eine posttraumatische Belastungsstörung entwickelt. Die Strafanzeige wurde aufgenommen; der Täter ist unbekannt.</p>
<h4>Fragen</h4><ol><li>Kommen Leistungen nach dem SGB XIV in Betracht?</li><li>Spielt die frühere psychische Erkrankung eine Rolle?</li><li>Welche Leistungen sind kurzfristig wichtig, was ist zu tun?</li><li>Wäre eine monatliche Entschädigungszahlung auf die Grundsicherung anzurechnen?</li></ol>
<details><summary>Lösungshinweise</summary><ol><li><b>Ja.</b> Körperliche Gewalttat nach <a data-go="n_sgb14_13">§ 13 Abs. 1 Nr. 1</a> (Angriff, Raub); Schädigung (Armbruch, PTBS); Kausalität nach <a data-go="n_sgb14_4">§ 4</a>; der Täter muss nicht ermittelt sein.</li><li>Vorerkrankung schließt den Anspruch nicht aus: Wahrscheinlichkeit (§ 4 Abs. 4) und Vermutung bei psychischen Störungen (§ 4 Abs. 5); die PTBS ist ereignisbezogen.</li><li><a data-go="n_sgb14_30">Schnelle Hilfen</a>: Traumaambulanz (Frühintervention – erste Sitzung binnen zwölf Monaten, hier vier Monate), Fallmanagement mit Einwilligung von Frau S.; <b>Antrag innerhalb eines Jahres</b> (§ 11 Abs. 2) beim KSV, Antrag auf Krankenbehandlung. Wünsche von Frau S. einbeziehen (§ 1821 BGB).</li><li><b>Nein</b>, § 28 Abs. 2 SGB XIV; zudem unpfändbar (§ 9).</li></ol></details>`,
 rel:['n_sgb14_13','n_sgb14_30','n_sgb14_28'],l:[]});
N('f2_2','t_faelle','Fall 2.2: Gewalt am Arbeitsplatz',{p:'Fall',m:[2],src:'SGBXIV',sum:'Wer ist vorrangig zuständig: Unfallversicherung vor Sozialer Entschädigung?',
 b:`<h4>Sachverhalt</h4><p>Herr T., 29 Jahre, arbeitet mit einer Lernbehinderung in einer Werkstatt für behinderte Menschen. Während der Arbeitszeit wird er von einem anderen Beschäftigten mit einem Werkzeug am Kopf verletzt; es bleiben Kopfschmerzen und Konzentrationsstörungen. Seine Mutter (nicht Betreuerin) meint, er müsse „Opferentschädigung“ beantragen.</p>
<h4>Frage</h4><p>Welcher Leistungsträger ist vorrangig zuständig?</p>
<details><summary>Lösungshinweise</summary><p>Die <b>gesetzliche Unfallversicherung</b> (SGB VII): Beschäftigte in Werkstätten sind versichert; es liegt ein Arbeitsunfall vor. Nach <a data-go="n_sgb14_28">§ 8 Abs. 3 SGB XIV</a> gehen Ansprüche nach dem SGB VII denen nach dem SGB XIV vor, soweit sie auf derselben Ursache beruhen. Zuständig: Unfallkasse bzw. Berufsgenossenschaft; Meldung des Unfalls veranlassen. Für nicht gedeckte Bedarfe kann ergänzend das SGB XIV in Betracht kommen.</p></details>`,
 rel:['n_sgb14_28','n_traeger'],l:[]});
N('f2_3','t_faelle','Fall 2.3: Nachstellung',{p:'Fall',m:[2],src:'SGBXIV',sum:'Psychische Gewalttat ohne körperlichen Angriff; über längere Zeit einwirkendes Ereignis.',
 b:`<h4>Sachverhalt</h4><p>Frau U., 55 Jahre, bipolare Störung, wird seit über einem Jahr von ihrem früheren Lebensgefährten verfolgt: Er lauert ihr vor der Wohnung auf, schickt täglich Dutzende Nachrichten und droht, sie „fertigzumachen“. Sie wechselte zweimal die Wohnung; ein Strafverfahren wegen Nachstellung läuft. Seitdem schwere depressive Phasen mit stationärer Behandlung. Körperlich wurde sie nie angegriffen.</p>
<h4>Fragen</h4><ol><li>Opfer einer Gewalttat im Sinne des SGB XIV trotz fehlenden körperlichen Angriffs?</li><li>Bedeutung von § 1 Abs. 3 SGB XIV?</li></ol>
