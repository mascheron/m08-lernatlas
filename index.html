 b:`<p>Nach dem vom BSG entwickelten <b>Zuflussprinzip</b> ist Einkommen alles, was jemand nach der Antragstellung wertmäßig dazuerhält; Vermögen ist, was er vor der Antragstellung schon hatte. Maßgeblich ist die (erste) Antragstellung für den laufenden Bewilligungszeitraum. Nicht verbrauchtes Einkommen wird mit Beginn des folgenden Bewilligungszeitraums oder nach Ablauf des Verteilzeitraums zu Vermögen.</p>
<p><b>§ 11 Abs. 1:</b> Einkommen sind Einnahmen in Geld abzüglich der Absetzbeträge (§ 11b), ausgenommen die in § 11a genannten. <b>Abs. 2:</b> Laufende Einnahmen zählen im Zuflussmonat. <b>Abs. 3:</b> Einmalige Einnahmen zählen im Zuflussmonat; entfiele der Anspruch dadurch, werden sie <b>gleichmäßig auf sechs Monate</b> verteilt.</p>
<h4>Typische Einnahmen in der Betreuungspraxis</h4>
<div class="tw"><table><thead><tr><th>Einnahme</th><th>Einordnung</th><th>Hinweis</th></tr></thead><tbody>
<tr><td>Arbeitsentgelt, auch Minijob</td><td>laufend</td><td>Freibeträge § 11b</td></tr>
<tr><td>Rente wegen Erwerbsminderung</td><td>laufend</td><td>bei voller Erwerbsminderung meist Wechsel ins SGB XII (Einheit 7)</td></tr>
<tr><td>Krankengeld, Arbeitslosengeld</td><td>laufend</td><td>Pauschbetrag 100 € nur bei Erwerbstätigkeit; sonst Versicherungspauschale 30 €</td></tr>
<tr><td>Kindergeld</td><td>Einkommen des Kindes, soweit es dessen Bedarf deckt (§ 11 Abs. 1 S. 5)</td><td>Überschuss ist Einkommen des kindergeldberechtigten Elternteils</td></tr>
<tr><td>Unterhalt</td><td>laufend</td><td>titulierte Unterhaltszahlungen des Leistungsberechtigten absetzbar (§ 11b Abs. 1 Nr. 7)</td></tr>
<tr><td>Nachzahlung einer Rente/Sozialleistung</td><td>einmalige Einnahme, wenn nicht für den Zuflussmonat</td><td>Verteilung auf sechs Monate, wenn Anspruch sonst entfiele</td></tr>
<tr><td>Betriebskostenguthaben</td><td>mindert die Unterkunftskosten im Folgemonat (§ 22 Abs. 3)</td><td>kein Einkommen im engeren Sinne</td></tr>
<tr><td>Steuererstattung</td><td>einmalige Einnahme</td><td></td></tr>
<tr><td>Erbschaft</td><td>kein Einkommen (§ 11a Abs. 1 Nr. 7)</td><td>wird als Vermögen geprüft</td></tr></tbody></table></div>`,
 f:'Abgrenzung Einkommen/Vermögen am Antragstag; einmalige Einnahmen: Verteilung auf sechs Monate.',rel:['n_einkommen','n_vermoegen','f6_1','f6_2'],l:LK(['SGB II',11])});
N('n_nichteink','t_eink','Nicht zu berücksichtigendes Einkommen',{p:'§ 11a SGB II',k:['SGB II|11a'],m:[6],src:'SGBII',sum:'Leistungen nach dem SGB II, Erbschaften, Aufwandspauschalen nach § 1878 BGB, bestimmte Entschädigungen und Schmerzensgeld bleiben anrechnungsfrei.',
 b:`<p>Nicht als Einkommen zu berücksichtigen sind nach § 11a Abs. 1 u. a.: Leistungen nach dem SGB II (Nr. 1), Entschädigungen nach dem Soldatenentschädigungsgesetz und BEG bis zur Höhe vergleichbarer Entschädigungszahlungen des SGB XIV (Nr. 2, 3), <b>Aufwandspauschalen nach § 1878 BGB</b> bis zum steuerfreien Betrag (Nr. 4), steuerfreie Aufwandsentschädigungen und nebenberufliche Einnahmen bis 3.000 Euro jährlich (Nr. 5), Mutterschaftsgeld (Nr. 6) und <b>einmalige Einnahmen aus Erbschaften, Vermächtnissen und Pflichtteilen</b> (Nr. 7). Außerdem Schmerzensgeld (Abs. 2), zweckbestimmte öffentlich-rechtliche Leistungen, soweit SGB-II-Leistungen nicht demselben Zweck dienen (Abs. 3), und Zuwendungen Dritter ohne rechtliche oder sittliche Pflicht, soweit die Anrechnung grob unbillig wäre oder die Lage nicht so günstig beeinflusst, dass SGB-II-Leistungen nicht mehr gerechtfertigt wären (Abs. 4).</p>
<h4>Praxis</h4>
<ul><li>Ehrenamtliche Betreuer, die selbst Leistungen beziehen, behalten die Aufwandspauschale (§ 11a Abs. 1 Nr. 4 SGB II, § 1878 BGB).</li><li>Schmerzensgeld bleibt als Einkommen und – nach der Rechtsprechung – auch als angespartes Vermögen unberücksichtigt, soweit die Verwertung eine Härte wäre.</li><li>Entschädigungszahlungen nach SGB XIV sind nach <a data-go="n_sgb14_28">§ 28 Abs. 2 SGB XIV</a> geschützt.</li><li>Leistungen der Pflegeversicherung bleiben beim Pflegebedürftigen unberücksichtigt (§ 13 Abs. 5 SGB XI); bei Weiterleitung als Pflegegeld an pflegende Angehörige behandelt die Verwaltungspraxis sie regelmäßig ebenfalls nicht als Einkommen – aktuelle Fachliche Weisungen prüfen.</li><li>Kleine Geschenke Dritter bleiben nach § 11a Abs. 5 unberücksichtigt, soweit sie die Lage nicht so günstig beeinflussen, dass keine Leistungen mehr gerechtfertigt wären.</li></ul>`,
 f:'Erbschaft: kein Einkommen, aber Vermögen. Aufwandspauschale ehrenamtlicher Betreuer bleibt anrechnungsfrei.',rel:['n_zufluss','n_sgb14_28','n_vermoegen','f6_1'],l:LK(['SGB II','11a'],['BGB',1878])});
N('n_einkommen','t_eink','Bereinigung des Einkommens: Freibeträge und Rechenschema',{p:'§ 11b SGB II',k:['SGB II|11b'],m:[6],src:'SGBII',sum:'Grundfreibetrag 100 Euro und gestaffelter Erwerbstätigenfreibetrag (20/30/10 %) – mit Rechenbeispielen.',
 b:`<p><b>§ 11b Abs. 2:</b> Bei erwerbstätigen erwerbsfähigen Leistungsberechtigten wird statt der Einzelbeträge für Versicherungen, Altersvorsorge und Werbungskosten ein <b>Grundfreibetrag von 100 Euro</b> abgesetzt (bei mehr als 400 € Einkommen nur, wenn nicht höhere Einzelnachweise erbracht werden). <b>Abs. 3:</b> Zusätzlich vom Brutto: <b>20 %</b> für den Teil von 100 bis 520 €, <b>30 %</b> für 520 bis 1.000 € und <b>10 %</b> für 1.000 bis 1.200 €. Mit mindestens einem minderjährigen Kind in der Bedarfsgemeinschaft steigt die Obergrenze der dritten Stufe von 1.200 auf <b>1.500 €</b> (Abs. 3 S. 3).</p>
<h4>Rechenschema</h4>
<ol><li>Bruttoeinkommen</li><li>− Steuern und Pflichtbeiträge zur Sozialversicherung (§ 11b Abs. 1 Nr. 1, 2) = Nettoeinkommen</li><li>− Grundfreibetrag 100 € (bei Erwerbstätigkeit)</li><li>− Erwerbstätigenfreibetrag nach § 11b Abs. 3 (berechnet vom Brutto)</li><li>− titulierter Unterhalt (§ 11b Abs. 1 Nr. 7)</li><li>= anzurechnendes Einkommen</li></ol>
<p>Werte 2026: Geringfügigkeitsgrenze 603 €, Mindestlohn 13,90 €/Std.; ab 2027 14,60 € und 633 €.</p>
<h4>Beispiel 1: Minijob 600 € (brutto = netto)</h4>
<p>600,00 − 100,00 Grundfreibetrag − 84,00 (20 % von 420) − 24,00 (30 % von 80) = Freibetrag 208,00 € → <b>anzurechnen 392,00 €</b>.</p>
<h4>Beispiel 2: 1.300 € brutto, 1.040 € netto, ohne Kind</h4>
<p>1.040,00 − 100,00 − 84,00 (20 % von 420) − 144,00 (30 % von 480) − 20,00 (10 % von 200) = Freibetrag 348,00 € → <b>anzurechnen 692,00 €</b>.</p>
<h4>Beispiel 3 (Fall 6.3): Minijob 603 €</h4>
<p>100 + 84 + 24,90 (30 % von 83) = 208,90 € Freibetrag → anzurechnen 394,10 €.</p>`,
 f:'Rechenaufgaben: Stufen 20/30/10 % sicher anwenden; Beispiel Minijob 600 € → 208 € Freibetrag.',
 q:['Welches Einkommen ist bei einem Minijob von 600 € brutto = netto anzurechnen?','Freibetrag: 100 € + 20 % von 420 € (84 €) + 30 % von 80 € (24 €) = 208 €; anzurechnen sind 392 €.'],
 rel:['n_zufluss','n_nichteink','n_bausteine','f6_3'],l:LK(['SGB II','11b'])});
N('n_vermoegen','t_eink','Vermögen nach neuem Recht',{p:'§ 12 SGB II, § 65a SGB II',k:['SGB II|12'],m:[6],src:'SGBII',sum:'Seit 1.7.2026 keine Karenzzeit mehr beim Vermögen; Freibeträge nach Lebensalter von 5.000 bis 20.000 Euro je Person.',
 b:`<p><b>§ 12 Abs. 1:</b> Alle verwertbaren Vermögensgegenstände sind zu berücksichtigen, <b>nicht</b> jedoch: angemessener Hausrat; ein angemessenes Kfz je erwerbsfähiger Person (Angemessenheit wird bei Erklärung im Antrag vermutet); für die Altersvorsorge bestimmte Versicherungsverträge und gleichgestellte Vorsorgeformen; als Altersvorsorge bezeichnete weitere Gegenstände (Sonderregel für Selbständige ohne Rentenversicherungsbeiträge); ein selbstgenutztes Hausgrundstück bis 140 m² oder eine Eigentumswohnung bis 130 m² (+20 m² je weitere Person ab fünf Personen; bei besonderer Härte höher). <b>Während der Karenzzeit nach § 22 Abs. 1 S. 2</b> ist selbstgenutztes Wohneigentum unabhängig von der Größe geschützt.</p>
<h4>Freibeträge je Person der Bedarfsgemeinschaft (§ 12 Abs. 2, neu)</h4>
<div class="tw"><table><thead><tr><th>Alter</th><th>Freibetrag</th></tr></thead><tbody><tr><td>bis zur Vollendung des 30. Lebensjahres</td><td>5.000 €</td></tr><tr><td>ab dem 31. Lebensjahr</td><td>10.000 €</td></tr><tr><td>ab dem 41. Lebensjahr</td><td>12.500 €</td></tr><tr><td>ab dem 51. Lebensjahr</td><td>20.000 €</td></tr></tbody></table></div>
<p>Der erhöhte Freibetrag gilt ab Beginn des Monats, in dem die Altersgrenze erreicht wird.</p>
<h4>Was hat sich geändert?</h4>
<div class="tw"><table><thead><tr><th></th><th>bis 30.6.2026</th><th>ab 1.7.2026</th></tr></thead><tbody>
<tr><td>Karenzzeit beim Vermögen</td><td>im ersten Jahr nur erhebliches Vermögen (über 40.000 € + 15.000 € je weiterer Person)</td><td>entfallen</td></tr>
<tr><td>Freibetrag danach</td><td>15.000 € je Person</td><td>altersabhängig 5.000–20.000 €</td></tr>
<tr><td>Vermutung bei Selbstauskunft</td><td>Erklärung im Antrag genügte</td><td>entfallen; Vermögen ist darzulegen und nachzuweisen</td></tr>
<tr><td>Selbstgenutzte Immobilie</td><td>ohne Größengrenze geschützt, danach 140/130 m²</td><td>geschützt in der Karenzzeit nach § 22; danach 140/130 m²</td></tr>
<tr><td>Bewertung</td><td>Verkehrswert zur Antragstellung</td><td>unverändert, jetzt § 12 Abs. 3</td></tr></tbody></table></div>
<div class="mark"><b>Übergangsrecht (§ 65a Abs. 1):</b> Für Bewilligungszeiträume, die vor dem 1. Juli 2026 begonnen haben, gilt § 12 in der alten Fassung weiter. Ein am 1. März 2026 begonnener zwölfmonatiger Bewilligungszeitraum unterliegt also bis Ende Februar 2027 dem alten Recht – im Kurszeitraum gelten altes und neues Recht nebeneinander.</div>
<h4>Prüfschema Vermögen</h4>
<ol><li>Welche Vermögensgegenstände (Konten, Sparbücher, Bausparverträge, Lebensversicherungen, Kfz, Immobilien, Forderungen)?</li><li>Verwertbar (rechtlich und tatsächlich, in absehbarer Zeit)? Nicht sofort verwertbar → Leistungen als Darlehen (§ 9 Abs. 4, § 24 Abs. 5).</li><li>Nach § 12 Abs. 1 S. 2 geschützt?</li><li>Verkehrswert (§ 12 Abs. 3 neu).</li><li>Freibeträge aller Mitglieder der Bedarfsgemeinschaft abziehen.</li><li>Verbleibendes Vermögen ist vorrangig einzusetzen; keine Verwertung bei offensichtlicher Unwirtschaftlichkeit oder besonderer Härte.</li></ol>
<h4>Besonderheiten der Betreuungspraxis</h4>
<ul><li>Angemessene Bestattungsvorsorge wird regelmäßig als Härte geschützt (im SGB XII § 90 Abs. 3).</li><li>Die Anlage von Vermögen richtet sich nach §§ 1838 ff. BGB (Anlagekonto, Sperrvermerk); diese Pflichten ändern nichts an der Anrechnung im SGB II.</li><li>Bewusstes Verringern des Vermögens zur Leistungserlangung kann Pflichtverletzung (§ 31 Abs. 2 Nr. 1) und Ersatzanspruch (§ 34) auslösen; größere Anschaffungswünsche der Betreuten sind daher auch sozialrechtlich zu bedenken.</li></ul>`,
 f:'Seit 1.7.2026: keine Karenzzeit beim Vermögen, Altersfreibeträge 5/10/12,5/20 Tsd. €; Übergangsregel § 65a beachten.',
 q:['Welche Vermögensfreibeträge gelten seit 1.7.2026 und wie wirkt das Übergangsrecht?','Altersabhängig 5.000 € (bis 30), 10.000 € (ab 31), 12.500 € (ab 41), 20.000 € (ab 51) je Person; für Bewilligungszeiträume, die vor dem 1.7.2026 begonnen haben, gilt noch das alte Recht (§ 65a Abs. 1 SGB II).'],
 rel:['n_zufluss','n_sgb12_verm','n_reform26','f6_1','f6_4'],l:LK(['SGB II',12],['SGB II','65a'])});

N('f6_1','t_faelle','Fall 6.1: Das Erbe der Tante',{p:'Fall',m:[6],src:'SGBII',sum:'Erbschaft als Vermögen, altersabhängiger Freibetrag, Anlage nach Betreuungsrecht.',
 b:`<h4>Sachverhalt</h4><p>Herr J., 44 Jahre, bezieht seit 2024 Grundsicherungsgeld; betreut für Vermögenssorge und Behördenangelegenheiten. Im Oktober 2026 werden ihm aus dem Nachlass seiner Tante 18.000 Euro überwiesen. Der Bewilligungszeitraum begann am 1. August 2026; sonstiges Guthaben 1.200 Euro; im Dezember 2026 wird er 45.</p>
<details><summary>Lösungshinweise</summary><ol><li><b>Einordnung:</b> Die Erbschaft ist nach § 11a Abs. 1 Nr. 7 kein Einkommen; sie wird als Vermögen geprüft.</li><li><b>Recht:</b> Bewilligungszeitraum ab 1. August 2026 → neues Recht.</li><li><b>Freibetrag:</b> 44 Jahre = 41. Lebensjahr begonnen → 12.500 €.</li><li><b>Ergebnis:</b> 19.200 € − 12.500 € = 6.700 € einzusetzen; bis zum Verbrauch keine Hilfebedürftigkeit. Ein Jahr ohne Leistungen folgt nicht automatisch.</li><li><b>Betreuungsrecht:</b> Anlage nach §§ 1838 ff. BGB auf Anlagekonto, Mitteilung an das Betreuungsgericht im Rahmen der Rechnungslegung; Wünsche zur Verwendung besprechen.</li><li><b>Hinweis:</b> Angemessene Anschaffungen (Hausrat, Bekleidung, Bestattungsvorsorge) sind kein sozialwidriges Verhalten, sollten aber dokumentiert werden.</li></ol></details>`,
 rel:['n_vermoegen','n_nichteink','n_zufluss'],l:[]});
N('f6_2','t_faelle','Fall 6.2: Die Rentennachzahlung',{p:'Fall',m:[6],src:'SGBX',sum:'Erstattungsanspruch des Jobcenters und einmaliges Einkommen.',
 b:`<h4>Sachverhalt</h4><p>Frau B., 59 Jahre, erhält im Juni 2027 nach erfolgreichem Widerspruch eine Nachzahlung ihrer befristeten Erwerbsminderungsrente für Januar bis Mai 2027 (4.500 €). Das Jobcenter hatte in dieser Zeit Grundsicherungsgeld geleistet.</p>
<details><summary>Lösungshinweise</summary><ol><li>Das Jobcenter hat einen <b>Erstattungsanspruch</b> gegen die Rentenversicherung (§ 104 SGB X), weil es nachrangig geleistet hat; die Rentenversicherung zahlt regelmäßig insoweit direkt an das Jobcenter, Frau B. erhält den Überschuss.</li><li>Wird doch an Frau B. ausgezahlt: einmalige Einnahme im Zuflussmonat (§ 11 Abs. 3); entfiele der Anspruch, Verteilung auf sechs Monate.</li><li>Zukunft: Prüfen, ob Frau B. bei voller Erwerbsminderung überhaupt noch erwerbsfähig ist (§ 8); ggf. Wechsel ins SGB XII (Einheit 7).</li></ol></details>`,
 rel:['n_zufluss','n_erwerbsf'],l:[]});
N('f6_3','t_faelle','Fall 6.3: Der Minijob',{p:'Fall',m:[6],src:'SGBII',sum:'Freibetragsberechnung bei Einkommen von 603 Euro.',
 b:`<h4>Sachverhalt</h4><p>Herr A., 26 Jahre, Grundsicherungsgeld, arbeitet im Minijob für 603 € monatlich.</p>
<details><summary>Lösung</summary><p>100 € + 20 % von 420 € (84 €) + 30 % von 83 € (24,90 €) = <b>208,90 €</b> Freibetrag; anzurechnen <b>394,10 €</b>. Siehe <a data-go="n_einkommen">Rechenschema</a>.</p></details>`,
 rel:['n_einkommen'],l:[]});
N('f6_4','t_faelle','Fall 6.4: Das Auto und das Sparbuch',{p:'Fall',m:[6],src:'SGBII',sum:'Geschütztes und einzusetzendes Vermögen bei einem Ehepaar.',
 b:`<h4>Sachverhalt</h4><p>Ein Ehepaar, beide 52 und erwerbsfähig, beantragt im September 2026 Grundsicherungsgeld. Vermögen: Pkw (9.000 €), gemeinsames Sparbuch (38.000 €), private Rentenversicherung (Rückkaufswert 24.000 €).</p>
<details><summary>Lösungshinweise</summary><ol><li><b>Pkw:</b> je erwerbsfähiger Person ein angemessenes Kfz geschützt; Angemessenheit wird bei Erklärung im Antrag vermutet.</li><li><b>Private Rentenversicherung:</b> geschützt, wenn als Altersvorsorge bestimmt (§ 12 Abs. 1 S. 2 Nr. 3); bei Kapitalwahlrecht Zweckbestimmung prüfen.</li><li><b>Sparbuch:</b> 38.000 € gegen Freibeträge 2 × 20.000 € = 40.000 € → vollständig geschützt.</li><li><b>Ergebnis:</b> kein einzusetzendes Vermögen. Vergleich: Wäre das Paar 35 Jahre alt, betrügen die Freibeträge 2 × 10.000 €; 18.000 € wären einzusetzen.</li></ol></details>`,
 rel:['n_vermoegen'],l:[]});

/* ===== Einheit 7 ===== */
EH[7]={z:'Abgrenzung SGB II / SGB XII, Grundsicherung im Alter und bei Erwerbsminderung, Bedarfe, Einkommen und Vermögen im SGB XII, Unterhaltsrückgriff und weitere Hilfen – plus Wohngeld als Alternative.',
 ks:['SGB II und SGB XII schließen sich beim Lebensunterhalt gegenseitig aus; entscheidend sind Erwerbsfähigkeit und Alter.','Grundsicherung im Alter und bei dauerhafter voller Erwerbsminderung muss beantragt werden; Hilfe zum Lebensunterhalt setzt nur Kenntnis des Trägers voraus.','Die dauerhafte volle Erwerbsminderung stellt der Rentenversicherungsträger fest; Werkstattbeschäftigte sind in der Regel erfasst.','Im SGB XII gelten 10.000 Euro Schonvermögen je volljährige Person; beim Wechsel aus dem SGB II kann bisher geschütztes Vermögen einzusetzen sein.','Kinder und Eltern werden nur bei einem Jahreseinkommen über 100.000 Euro zum Unterhalt herangezogen.'],
 kq:[['Wer ist für den Lebensunterhalt eines 45-Jährigen zuständig, der nach Feststellung der Rentenversicherung dauerhaft voll erwerbsgemindert ist?','Der Sozialhilfeträger: Grundsicherung bei Erwerbsminderung nach dem 4. Kapitel SGB XII.'],
 ['Worin unterscheidet sich der Antragsgrundsatz im 3. und 4. Kapitel SGB XII?','3. Kapitel: Kenntnisgrundsatz (§ 18 SGB XII); 4. Kapitel: Antrag erforderlich (§ 44 SGB XII).'],

 ['Wie viel Vermögen darf eine alleinstehende Grundsicherungsbezieherin behalten?','10.000 € kleinere Barbeträge, zusätzlich weiteres Schonvermögen nach § 90 Abs. 2 (Hausrat, angemessenes Kfz, ggf. Hausgrundstück) und Härtefälle nach § 90 Abs. 3 SGB XII.'],
 ['Wann werden die Kinder einer Grundsicherungsbezieherin zum Unterhalt herangezogen?','Nur bei einem Jahreseinkommen von jeweils mehr als 100.000 € (§ 94 Abs. 1a SGB XII).'],
 ['Eine Werkstattbeschäftigte verdient 200 €. Wie hoch ist der Freibetrag?','70,38 € + 50 % von 129,62 € (64,81 €) = 135,19 €.']]};

N('n_sgb12_abgr','t_sozhilfe','Nachrang und Abgrenzung SGB II / SGB XII',{p:'§ 2 SGB XII, § 21 SGB XII, § 5 SGB II',k:['SGB XII|2','SGB XII|21','SGB XII|19'],m:[7],src:'SGBXII',sum:'Erwerbsfähigkeit und Alter entscheiden, welches Buch den Lebensunterhalt sichert.',
 b:`<p><b>§ 2 Abs. 1 SGB XII (Nachrang):</b> Sozialhilfe erhält nicht, wer sich vornehmlich durch Einsatz seiner Arbeitskraft, seines Einkommens und seines Vermögens selbst helfen kann oder die erforderliche Leistung von anderen, insbesondere von Angehörigen oder Trägern anderer Sozialleistungen, erhält.</p>
<h4>Abgrenzungsschema</h4>
<ol><li><b>Erwerbsfähig (§ 8 SGB II)?</b> Ja und unter der Altersgrenze → <b>SGB II</b> (Grundsicherungsgeld).</li><li>Nicht erwerbsfähig, aber Altersgrenze erreicht oder dauerhaft voll erwerbsgemindert → <b>SGB XII, 4. Kapitel</b> (Grundsicherung im Alter und bei Erwerbsminderung).</li><li>Nicht erwerbsfähig, nicht dauerhaft voll erwerbsgemindert, in Bedarfsgemeinschaft mit Erwerbsfähigen → <b>SGB II</b> (Grundsicherungsgeld für nicht Erwerbsfähige, § 23).</li><li>Nicht erwerbsfähig, ohne Bedarfsgemeinschaft mit Erwerbsfähigen → <b>SGB XII, 3. Kapitel</b> (Hilfe zum Lebensunterhalt).</li></ol>
<p>Wer dem Grunde nach nach dem SGB II leistungsberechtigt ist, erhält keinen Lebensunterhalt nach dem SGB XII (§ 21 S. 1 SGB XII, § 5 Abs. 2 SGB II). Leistungen des 4. Kapitels gehen der Hilfe zum Lebensunterhalt vor (§ 19 Abs. 2 S. 2 SGB XII) und auch dem Grundsicherungsgeld für nicht erwerbsfähige Mitglieder der Bedarfsgemeinschaft (§ 5 Abs. 2 S. 2 SGB II).</p>
<h4>Unterschiede im Überblick</h4>
<div class="tw"><table><thead><tr><th></th><th>SGB II</th><th>SGB XII, 3. Kap.</th><th>SGB XII, 4. Kap.</th></tr></thead><tbody>
<tr><td>Personenkreis</td><td>Erwerbsfähige und ihre Bedarfsgemeinschaft</td><td>Nicht Erwerbsfähige, nicht dauerhaft voll Erwerbsgeminderte unter der Altersgrenze</td><td>Ab Altersgrenze; ab 18 bei dauerhafter voller Erwerbsminderung</td></tr>
<tr><td>Träger</td><td>Jobcenter</td><td>örtlicher Sozialhilfeträger</td><td>örtlicher Sozialhilfeträger (Bundeserstattung)</td></tr>
<tr><td>Antrag</td><td>erforderlich (§ 37)</td><td>Kenntnisgrundsatz (§ 18)</td><td>erforderlich (§ 44)</td></tr>
<tr><td>Gemeinschaft</td><td>Bedarfsgemeinschaft</td><td>Einsatzgemeinschaft (§ 27 Abs. 2), Vermutung bei Haushaltsgemeinschaft (§ 39)</td><td>ohne Vermutung nach § 39 S. 1 (§ 43 Abs. 5)</td></tr>
<tr><td>Unterhaltsrückgriff</td><td>möglich (§ 33 SGB II)</td><td>nur bei Einkommen über 100.000 € (§ 94 Abs. 1a)</td><td>nur bei Einkommen über 100.000 €</td></tr>
<tr><td>Vermögensfreibetrag</td><td>altersabhängig 5.000–20.000 €</td><td>10.000 € je Volljährigem</td><td>10.000 € je Volljährigem</td></tr>
<tr><td>Mitwirkung am Arbeitsmarkt</td><td>Kooperationsplan, Minderungen</td><td>eingeschränkt (§ 39a)</td><td>keine</td></tr></tbody></table></div>`,
 f:'Abgrenzungsschema sicher anwenden; Nachrang und Vorrang des 4. Kapitels.',rel:['n_erwerbsf','n_sgb12_ga','f7_1','n_vermoegen'],l:LK(['SGB XII',2],['SGB XII',19],['SGB XII',21],['SGB II',5])});

N('n_sgb12_ga','t_sozhilfe','Grundsicherung im Alter und bei Erwerbsminderung',{p:'§§ 41, 44, 45 SGB XII',k:['SGB XII|41','SGB XII|44','SGB XII|45'],m:[7],src:'SGBXII',sum:'Leistungsberechtigt sind Personen ab Altersgrenze und dauerhaft voll Erwerbsgeminderte ab 18; Antrag nötig.',
 b:`<p><b>§ 41 Abs. 1:</b> Älteren und dauerhaft voll erwerbsgeminderten Personen mit gewöhnlichem Aufenthalt im Inland ist Grundsicherung zu leisten, wenn sie ihren notwendigen Lebensunterhalt nicht oder nicht ausreichend aus Einkommen und Vermögen (§§ 43, 43a) bestreiten können.</p>
<ul><li><b>Abs. 2 (Alter):</b> Wer die Altersgrenze erreicht hat.</li><li><b>Abs. 3 (Erwerbsminderung):</b> Wer 18 ist, unabhängig von der Arbeitsmarktlage voll erwerbsgemindert im Sinne des § 43 Abs. 2 SGB VI ist und bei dem unwahrscheinlich ist, dass die Minderung behoben werden kann.</li><li><b>Abs. 3a:</b> Auch wer 18 ist und für den sich die Kostenträgerschaft im <b>Eingangsverfahren und Berufsbildungsbereich einer WfbM</b> ergibt.</li></ul>
<h4>Altersgrenze (§ 41 Abs. 2)</h4>
<div class="tw"><table><thead><tr><th>Jahrgang</th><th>Altersgrenze</th></tr></thead><tbody><tr><td>1959</td><td>66 Jahre 2 Monate</td></tr><tr><td>1960</td><td>66 Jahre 4 Monate</td></tr><tr><td>1961</td><td>66 Jahre 6 Monate</td></tr><tr><td>1962</td><td>66 Jahre 8 Monate</td></tr><tr><td>1963</td><td>66 Jahre 10 Monate</td></tr><tr><td>ab 1964</td><td>67 Jahre</td></tr></tbody></table></div>
<h4>Feststellung der dauerhaften vollen Erwerbsminderung (§ 45)</h4>
<p>Der Sozialhilfeträger ersucht den Rentenversicherungsträger um Prüfung; dessen Entscheidung ist bindend. Entbehrlich ist das Ersuchen u. a., wenn bereits eine Rente wegen voller Erwerbsminderung auf Dauer bewilligt wurde oder wenn die Person im Arbeitsbereich einer WfbM beschäftigt ist und ein entsprechendes Votum bzw. Teilhabeplanverfahren vorliegt.</p>
<div class="mark"><b>Typische Beratungsfalle:</b> Junge Erwachsene mit Behinderung erhalten schon im Eingangs- und Berufsbildungsbereich der WfbM Grundsicherung (§ 41 Abs. 3a). Der Antrag wird häufig zum 18. Geburtstag vergessen.</div>
<h4>Ausschluss (§ 41 Abs. 4)</h4>
<p>Kein Anspruch, wer in den letzten zehn Jahren die Bedürftigkeit vorsätzlich oder grob fahrlässig herbeigeführt hat – etwa durch Schenkungen kurz vor Antragstellung. Daneben Rückforderung nach § 528 BGB, überleitbar nach § 93 SGB XII (siehe <a data-go="f7_4">Fall 7.4</a>).</p>
<h4>Antrag und Bewilligungszeitraum</h4>
<p>Leistungen nur auf <b>Antrag</b>, der auf den Ersten des Antragsmonats zurückwirkt (§ 44 Abs. 2); Bewilligungszeitraum regelmäßig zwölf Monate (§ 44 Abs. 3).</p>`,
 f:'Altersgrenzentabelle, § 45 Bindung an den Rentenversicherungsträger, § 41 Abs. 3a WfbM.',
 q:['Wer stellt die dauerhafte volle Erwerbsminderung fest?','Der Rentenversicherungsträger auf Ersuchen des Sozialhilfeträgers; dessen Entscheidung bindet (§ 45 SGB XII).'],
 rel:['n_sgb12_abgr','n_sgb12_regel','n_sgb12_eink','f7_1','f7_2','f7_4','n_rente'],l:LK(['SGB XII',41],['SGB XII',44],['SGB XII',45],['SGB XII',93],['BGB',528])});

N('n_sgb12_regel','t_sozhilfe','Bedarfe im SGB XII',{p:'§§ 27a–42b SGB XII',k:['SGB XII|27a','SGB XII|30','SGB XII|35','SGB XII|42a','SGB XII|27b','SGB XII|42b'],m:[7],src:'SGBXII',sum:'Regelbedarf 563 Euro, Mehrbedarfe, Unterkunft (neu: Deckelung 1,5-fach), Barbetrag 152,01 Euro in Einrichtungen.',
 b:`<div class="tw"><table><thead><tr><th>Baustein</th><th>Norm</th><th>Hinweise</th></tr></thead><tbody>
<tr><td>Regelbedarf</td><td>§§ 27a, 28 und Anlage</td><td>identisch mit SGB II; 2026: 563 € (Stufe 1)</td></tr>
<tr><td>Mehrbedarfe</td><td>§ 30</td><td>Merkzeichen G oder aG bei Altersgrenze/voller Erwerbsminderung: 17 % (95,71 €); Alleinerziehung, Schwangerschaft, Ernährung, dezentrale Warmwasserbereitung wie SGB II</td></tr>
<tr><td>Mittagessen in der Werkstatt</td><td>§ 42b Abs. 2</td><td>Mehrbedarf je Arbeitstag, bemessen nach dem Sachbezugswert; aktuellen Wert prüfen</td></tr>
<tr><td>Unterkunft und Heizung</td><td>§§ 35, 42a</td><td>Karenzzeit; seit 1.7.2026 Deckelung auf das 1,5-Fache der abstrakt angemessenen Kosten (BGBl. 2026 I Nr. 107, Art. 9)</td></tr>
<tr><td>Kranken- und Pflegeversicherung</td><td>§ 32</td><td>bei freiwilliger Versicherung</td></tr>
<tr><td>Vorsorgebeiträge</td><td>§ 33</td><td>angemessene Alterssicherung/Sterbegeld</td></tr>
<tr><td>Einmalige Bedarfe</td><td>§ 31</td><td>Erstausstattungen wie im SGB II</td></tr>
<tr><td>Darlehen</td><td>§ 37</td><td>unabweisbarer, vom Regelsatz umfasster Bedarf</td></tr></tbody></table></div>
<h4>Unterkunft nach neuem Recht (§ 35 Abs. 1)</h4>
<p>Tatsächliche Aufwendungen werden nicht als Bedarf anerkannt, soweit sie mehr als das <b>Eineinhalbfache</b> der abstrakt angemessenen Aufwendungen betragen; in der Karenzzeit können im Einzelfall höhere Aufwendungen anerkannt werden, wenn sie unabweisbar sind oder in Haushaltsgemeinschaften mit Kindern anfallen.</p>
<h4>Besondere Wohnsituationen</h4>
<ul><li><b>Bei den Eltern ohne eigenen Mietvertrag:</b> Differenzmethode (§ 42a Abs. 3) – Mehrkosten des Mehrpersonenhaushalts.</li><li><b>Besondere Wohnformen der Eingliederungshilfe:</b> Regelbedarfsstufe 2; Unterkunft nach § 42a Abs. 5 bis zur Angemessenheitsgrenze, darüber hinaus über die Eingliederungshilfe (Modul 9).</li></ul>
<h4>Barbetrag in Einrichtungen (§ 27b Abs. 3)</h4>
<p>Mindestens <b>27 % der Regelbedarfsstufe 1</b>, 2026 also <b>152,01 €</b> monatlich, plus Bekleidungspauschale nach Träger-/Landespraxis.</p>
<div class="mark">Der Barbetrag gehört dem betreuten Menschen, nicht der Einrichtung. Betreuer klären, ob die Einrichtung ihn verwahrt, und prüfen regelmäßig die Abrechnung. Wünsche des Betreuten zur Verwendung haben Vorrang (§ 1821 Abs. 2 BGB).</div>`,
 f:'Regelbedarf 563 €, Barbetrag 27 % = 152,01 €, Deckelung 1,5-fach seit 1.7.2026.',
 q:['Wie hoch ist der Mindestbarbetrag 2026 und woraus berechnet er sich?','27 % der Regelbedarfsstufe 1 (563 €) = 152,01 € (§ 27b Abs. 3 SGB XII).'],
 rel:['n_bausteine','n_sgb12_ga','n_sgb12_eink','f7_2','f7_3'],l:LK(['SGB XII','27a'],['SGB XII','27b'],['SGB XII',30],['SGB XII',35],['SGB XII','42a'],['SGB XII','42b'],['BGB',1821])});

N('n_sgb12_eink','t_sozhilfe','Einkommen im SGB XII',{p:'§§ 82, 82a SGB XII',k:['SGB XII|82','SGB XII|82a'],m:[7],src:'SGBXII',sum:'30 % Erwerbstätigenfreibetrag (max. 281,50 €), Werkstattentgelt, Altersvorsorge, Grundrentenfreibetrag.',
 b:`<p><b>§ 82 Abs. 3 S. 1:</b> Vom Einkommen aus selbständiger und nichtselbständiger Tätigkeit sind 30 % abzusetzen, höchstens 50 % der Regelbedarfsstufe 1. <b>S. 2:</b> Bei Beschäftigung in einer WfbM oder bei einem anderen Leistungsanbieter: ein Achtel der Regelbedarfsstufe 1 plus 50 % des übersteigenden Entgelts.</p>
<div class="tw"><table><thead><tr><th>Einkommen</th><th>Freibetrag</th><th>Norm</th></tr></thead><tbody>
<tr><td>Erwerbseinkommen</td><td>30 %, höchstens 281,50 € (50 % von 563 €)</td><td>§ 82 Abs. 3 S. 1</td></tr>
<tr><td>Werkstattentgelt</td><td>70,38 € (1/8 von 563 €) + 50 % des übersteigenden Entgelts</td><td>§ 82 Abs. 3 S. 2</td></tr>
<tr><td>Zusätzliche Altersvorsorge (Betriebsrente, Riester)</td><td>100 € + 30 % des übersteigenden Betrags, höchstens 281,50 €</td><td>§ 82 Abs. 4</td></tr>
<tr><td>Gesetzliche Rente mit mind. 33 Jahren Grundrentenzeiten</td><td>100 € + 30 % des übersteigenden Betrags, höchstens 281,50 €</td><td>§ 82a</td></tr>
<tr><td>Aufwandspauschale § 1878 BGB</td><td>bis zum Betrag nach § 3 Nr. 26 S. 1 EStG jährlich</td><td>§ 82 Abs. 1 S. 2 Nr. 4</td></tr>
<tr><td>Erbschaften, Vermächtnisse</td><td>einmalige Einnahmen kein Einkommen; Prüfung als Vermögen</td><td>§ 82 Abs. 1 S. 2 Nr. 9</td></tr>
<tr><td>Nachzahlungen</td><td>Verteilung auf sechs Monate, wenn Anspruch sonst entfiele</td><td>§ 82 Abs. 7</td></tr></tbody></table></div>`,
 f:'Freibetragsrechnung Werkstatt: 70,38 € + 50 % des Rests.',
 q:['Berechne den Freibetrag bei 200 € Werkstattentgelt.','70,38 € + 50 % von 129,62 € (64,81 €) = 135,19 €.'],

N('n_sgb12_verm','t_sozhilfe','Vermögen und Unterhaltsrückgriff im SGB XII',{p:'§ 90 SGB XII, § 94 Abs. 1a SGB XII',k:['SGB XII|90','SGB XII|94','SGB XII|93'],m:[7],src:'SGBXII',sum:'Kleinere Barbeträge 10.000 Euro; Härte (Bestattungsvorsorge); Unterhalt von Kindern und Eltern erst über 100.000 Euro.',
 b:`<p><b>§ 90 Abs. 1:</b> Einzusetzen ist das gesamte verwertbare Vermögen. <b>Abs. 2</b> schützt u. a. angemessenen Hausrat (Nr. 4), ein angemessenes Hausgrundstück, das bewohnt wird und nach dem Tod von Angehörigen bewohnt werden soll (Nr. 8), <b>kleinere Barbeträge</b> (Nr. 9) und ein angemessenes Kfz (Nr. 10). <b>Abs. 3:</b> keine Verwertung, soweit sie eine Härte bedeutete.</p>
<ul><li>Kleinere Barbeträge (Durchführungsverordnung): <b>10.000 €</b> je volljähriger Person und je alleinstehender minderjähriger Person, 500 € je überwiegend unterhaltener Person.</li><li>Härtefälle: insbesondere angemessene <b>Bestattungsvorsorge</b>, je nach Einzelfall auch Altersvorsorge. Das BSG verlangt konkrete Prüfung von Verwertbarkeit, Rückkaufswert und Härtegründen (BSG, Urteil vom 27.5.2026, B 8 SO 5/24 R).</li></ul>
<div class="mark"><b>Planungspunkt:</b> Der Freibetrag im SGB XII (10.000 €) ist für Ältere deutlich niedriger als der SGB-II-Freibetrag ab 51 (20.000 €). Beim Wechsel zum Sozialamt kann bisher geschütztes Vermögen plötzlich einzusetzen sein.</div>
<h4>Unterhaltsrückgriff (§ 94 Abs. 1a)</h4>
<p>Unterhaltsansprüche gegen Kinder und Eltern gehen nur über, wenn deren jährliches Gesamteinkommen (§ 16 SGB IV) jeweils mehr als <b>100.000 €</b> beträgt; es wird vermutet, dass die Grenze nicht überschritten ist. In der Praxis werden Angehörige nur selten herangezogen – ein gutes Argument, Leistungen überhaupt zu beantragen („Die Kinder müssen nicht zahlen“).</p>`,
 f:'Schonbetrag 10.000 €, Wechselrisiko SGB II → SGB XII, 100.000-€-Grenze.',
 q:['Wann werden Kinder von Grundsicherungsbeziehern zum Unterhalt herangezogen?','Nur bei einem Jahreseinkommen von jeweils mehr als 100.000 € (§ 94 Abs. 1a SGB XII); die Unterschreitung wird vermutet.'],
 rel:['n_vermoegen','n_sgb12_eink','f7_1','f7_4'],l:LK(['SGB XII',90],['SGB XII',94],['SGB XII',93],['SGB IV',16])});

N('n_sgb12_weitere','t_sozhilfe','Weitere Hilfen des SGB XII und Wohngeld',{p:'§§ 61 ff., 67 ff., 70 ff., 74 SGB XII; § 7 WoGG',k:['SGB XII|61','SGB XII|67','SGB XII|70','SGB XII|74'],m:[7],src:'SGBXII',sum:'Hilfe zur Pflege, besondere soziale Schwierigkeiten, andere Lebenslagen, Bestattung – und Wohngeld als Alternative.',
 b:`<div class="tw"><table><thead><tr><th>Hilfe</th><th>Norm</th><th>Bezug zur Betreuung</th></tr></thead><tbody>
<tr><td>Hilfe zur Pflege</td><td>§§ 61 ff.</td><td>ergänzend zur Pflegeversicherung, v. a. bei Heimkosten (Modul 9)</td></tr>
<tr><td>Hilfe zur Überwindung besonderer sozialer Schwierigkeiten</td><td>§§ 67 ff.</td><td>Wohnungslosigkeit, Haftentlassung; Beratung und persönliche Unterstützung</td></tr>
<tr><td>Hilfe in anderen Lebenslagen</td><td>§§ 70 ff.</td><td>Weiterführung des Haushalts, Altenhilfe, Blindenhilfe</td></tr>
<tr><td>Bestattungskosten</td><td>§ 74</td><td>für Verpflichtete, denen die Kostentragung nicht zumutbar ist; mit dem Tod endet die Betreuung</td></tr>
<tr><td>Eingliederungshilfe</td><td>SGB IX Teil 2</td><td>seit 2020 nicht mehr im SGB XII (Modul 9)</td></tr></tbody></table></div>
<h4>Wohngeld als vorrangige Alternative</h4>
<p>Wohngeld ist eine Förderleistung. Beziehende von Grundsicherung im Alter und bei Erwerbsminderung sind vom Wohngeld ausgeschlossen (§ 7 Abs. 1 WoGG). Liegt das Einkommen knapp über dem Grundsicherungsbedarf, kann Wohngeld günstiger sein: keine Vermögensprüfung nach SGB XII und kein Kostenersatz. Eine <b>Vergleichsberechnung</b> lohnt sich besonders bei Rentnern mit Grundrentenzuschlag. Wohngeldstellen und Sozialämter müssen auf vorrangige Leistungen hinweisen.</p>`,
 f:'Wohngeld-Vergleichsberechnung; Wohngeld und Grundsicherung schließen sich aus.',
 rel:['n_sgb12_ga','f7_1'],l:LK(['SGB XII',61],['SGB XII',67],['SGB XII',70],['SGB XII',74],['WoGG',7])});

N('f7_1','t_faelle','Fall 7.1: Rente mit 66 und 4 Monaten',{p:'Fall',m:[7],src:'SGBXII',sum:'Wechsel vom Jobcenter zum Sozialamt bei Erreichen der Altersgrenze.',
 b:`<h4>Sachverhalt</h4><p>Frau G., geboren im Februar 1960, lebt allein in Dresden, bezieht Grundsicherungsgeld; Altersrente ab Juli 2026 voraussichtlich 780 €. Betreut für Vermögenssorge und Behördenangelegenheiten. Das Jobcenter teilt mit, dass die Leistungen mit Rentenbeginn enden. Bruttowarmmiete 520 € (angemessen), Sparkonto 14.000 €, keine 33 Jahre Grundrentenzeiten.</p>
<details><summary>Lösungshinweise</summary><ol><li><b>Ende SGB II:</b> Mit Erreichen der Altersgrenze nach § 7a SGB II (66 Jahre 4 Monate, also Juni 2026) endet die Leistungsberechtigung; der Bezug einer Altersrente schließt SGB-II-Leistungen zudem aus (§ 7 Abs. 4).</li><li><b>Zuständigkeit:</b> Grundsicherung im Alter, 4. Kapitel SGB XII, Sozialamt. Antrag erforderlich (§ 44) – rechtzeitig vor dem Wechsel stellen.</li><li><b>Bedarf:</b> 563 € + 520 € = 1.083 €; Einkommen: Rente 780 € → rechnerisch etwa 303 €, vorbehaltlich Vermögen.</li><li><b>Vermögen:</b> 14.000 € − 10.000 € = 4.000 € einzusetzen; bis zum Verbrauch kein Anspruch. Im SGB II wären 20.000 € geschützt gewesen – der Systemwechsel bringt hier einen Nachteil.</li><li><b>Alternative:</b> Wohngeld-Vergleichsberechnung.</li><li><b>Betreuung:</b> Rentenantrag, Antrag beim Sozialamt und ggf. Wohngeldantrag parallel und fristwahrend; mit Frau G. Verwendung des Vermögens besprechen (Wünsche, angemessene Anschaffungen, Bestattungsvorsorge).</li></ol></details>`,
 rel:['n_sgb12_abgr','n_sgb12_ga','n_sgb12_verm','n_sgb12_weitere'],l:[]});
N('f7_2','t_faelle','Fall 7.2: Der 18. Geburtstag',{p:'Fall',m:[7],src:'SGBXII',sum:'Grundsicherung bei dauerhafter voller Erwerbsminderung, § 41 Abs. 3a, Bedarfe im Elternhaushalt.',
 b:`<h4>Sachverhalt</h4><p>Lukas, geboren im Dezember 2008, geistige Behinderung, besucht bis Juli 2027 eine Förderschule und lebt bei den Eltern. Seine Mutter ist Betreuerin. Ab August 2027 Wechsel in den Berufsbildungsbereich einer WfbM.</p>
<details><summary>Lösungshinweise</summary><ol><li>Seit Vollendung des 18. Lebensjahres (Dezember 2026) kommt Grundsicherung bei dauerhafter voller Erwerbsminderung in Betracht (§ 41 Abs. 3); Feststellung über den Rentenversicherungsträger (§ 45).</li><li>Ab Eintritt in den Berufsbildungsbereich gilt § 41 Abs. 3a.</li><li><b>Bedarf:</b> Regelbedarfsstufe 1 (563 €) – im SGB XII seit 2020 auch bei Erwachsenen im Elternhaushalt (anders als im SGB II für unter 25-Jährige); Mehrbedarf nach § 30 bei Merkzeichen G/aG; Unterkunft nach § 42a Abs. 3 (Differenzmethode) bzw. vertragliche Kosten bei Mietvertrag, soweit angemessen.</li><li><b>Unterhalt:</b> Eltern nur bei Einkommen über 100.000 € (§ 94 Abs. 1a). Kindergeld ist bei Volljährigen nur Einkommen, soweit es weitergeleitet wird.</li><li><b>Träger:</b> Landkreis Meißen als Sozialhilfeträger.</li></ol></details>`,
 rel:['n_sgb12_ga','n_sgb12_regel','n_sgb12_verm'],l:[]});
N('f7_3','t_faelle','Fall 7.3: Die Werkstattbeschäftigte',{p:'Fall',m:[7],src:'SGBXII',sum:'Freibetrag auf Werkstattentgelt und aufstockende Grundsicherung.',
 b:`<h4>Sachverhalt</h4><p>Frau E., 35, arbeitet im Arbeitsbereich einer WfbM (Entgelt 260 €), erhält Rente wegen voller Erwerbsminderung 820 € und wohnt allein (Bruttowarmmiete 480 €, angemessen).</p>
<details><summary>Lösungshinweise</summary><ol><li><b>Freibetrag Werkstattentgelt:</b> 70,38 € + 50 % von 189,62 € (94,81 €) = 165,19 €; anzurechnen: 94,81 €.</li><li><b>Rente:</b> voll anzurechnen (ggf. Versicherungspauschale nach Praxis); Freibetrag nach § 82a bei 33 Jahren Grundrentenzeiten (Werkstattzeiten sind Pflichtbeitragszeiten).</li><li><b>Bedarf:</b> 563 € + 480 € + Mittagessen-Mehrbedarf (§ 42b Abs. 2) + ggf. § 30.</li><li><b>Ergebnis:</b> Einkommen ca. 914,81 € gegenüber Bedarf von mindestens 1.043 € → aufstockende Grundsicherung.</li></ol></details>`,
 rel:['n_sgb12_eink','n_sgb12_regel'],l:[]});
N('f7_4','t_faelle','Fall 7.4: Die Schenkung an die Enkelin',{p:'Fall',m:[7],src:'BGB',sum:'Rückforderung wegen Verarmung des Schenkers, Überleitung, Genehmigungspflicht beim Verzicht.',
 b:`<h4>Sachverhalt</h4><p>Herr V., 78, lebt im Pflegeheim. Vor vier Jahren schenkte er seiner Enkelin 25.000 €. Sein Einkommen reicht nicht mehr für die Heimkosten.</p>
<details><summary>Lösungshinweise</summary><ol><li><b>Anspruch:</b> Rückforderung wegen Verarmung des Schenkers (§ 528 BGB) innerhalb von zehn Jahren (§ 529 BGB); er ist Vermögen des Herrn V.</li><li>Der Sozialhilfeträger kann den Anspruch überleiten (§ 93 SGB XII) oder auf Geltendmachung verweisen.</li><li><b>Betreuungsrecht:</b> Die Betreuerin muss den Anspruch prüfen und ggf. geltend machen; ein Verzicht wäre eine unentgeltliche Zuwendung und nach § 1854 Nr. 8 BGB genehmigungsbedürftig. Wünsche von Herrn V. sind zu berücksichtigen.</li><li>Hilfe zur Pflege selbst: Modul 9.</li></ol></details>`,
 rel:['n_sgb12_ga','n_sgb12_verm'],l:LK(['BGB',528],['BGB',529],['BGB',1854])});

/* ===== Einheit 8 ===== */
EH[8]={z:'Versicherungsprinzip und Versicherungsschutz, Leistungen und Fristen der Krankenversicherung (Genehmigungsfiktion, Krankengeld, Zuzahlungen), Erwerbsminderungs- und Altersrente, Pflegegrade und Leistungen der Pflegeversicherung.',
 ks:['Versicherungsleistungen sind vorrangig und bedürftigkeitsunabhängig; zuerst immer den Versicherungsschutz klären.','Bei der Krankenkasse das Antragsdatum dokumentieren: Nach drei bzw. fünf Wochen ohne Entscheidung oder begründete Mitteilung gilt die Leistung als genehmigt.','Krankengeld setzt lückenlose Arbeitsunfähigkeitsfeststellung voraus und läuft höchstens 78 Wochen.','Bei Grundsicherungs- und Sozialhilfebezug beträgt die Belastungsgrenze 2026 135,12 Euro bzw. 67,56 Euro.','Erwerbsminderungsrente: weniger als sechs bzw. drei Stunden, fünf Jahre Wartezeit, drei Jahre Pflichtbeiträge in fünf Jahren; Reha vor Rente.','Pflegegrad ab 12,5 Punkten; der Pflegeantrag wirkt ab Antragstellung, deshalb sofort stellen.'],
 kq:[['Wie hoch ist das Krankengeld bei einem Bruttoentgelt von 2.500 € und einem Nettoentgelt von 1.750 €?','70 % von 2.500 € = 1.750 €, höchstens 90 % von 1.750 € = 1.575 €; Krankengeld 1.575 €.'],
 ['Was bewirkt die Genehmigungsfiktion nach § 13 Abs. 3a SGB V nach heutiger Rechtsprechung?','Berechtigung zur Selbstbeschaffung und Anspruch auf Kostenerstattung, kein eigenständiger Sachleistungsanspruch.'],
 ['Welche Belastungsgrenze gilt 2026 für eine chronisch kranke Bezieherin von Grundsicherung im Alter?','1 % von 6.756 € = 67,56 €.'],
 ['Welche versicherungsrechtlichen Voraussetzungen hat die Erwerbsminderungsrente?','Allgemeine Wartezeit von fünf Jahren und drei Jahre Pflichtbeiträge in den letzten fünf Jahren vor Eintritt der Erwerbsminderung (§ 43 Abs. 1, 2 SGB VI).'],
 ['Ab wie vielen Punkten liegt Pflegegrad 3 vor?','Ab 47,5 Punkten.'],
 ['Warum sollte ein Pflegeantrag möglichst früh gestellt werden?','Leistungen werden ab Antragstellung erbracht (§ 33 Abs. 1 SGB XI); bei Fristüberschreitung der Pflegekasse gibt es zusätzliche Zahlungen.']]};

N('n_vprinzip','t_kv','Versicherungsprinzip und Versicherungsschutz',{p:'§ 5 SGB V, § 264 SGB V',k:['SGB V|5','SGB V|264','SGB V|16'],m:[8],src:'SGBV',sum:'Beiträge und Versicherungspflicht; erste Frage in der Praxis: Ist der Betreute krankenversichert?',
 b:`<p>Die Sozialversicherung beruht auf Beiträgen und Versicherungspflicht. Leistungen setzen in der Regel ein Versicherungsverhältnis, teils Vorversicherungs- und Wartezeiten voraus und sind grundsätzlich <b>unabhängig von Bedürftigkeit</b>. Gegenüber der Fürsorge sind Versicherungsleistungen vorrangig.</p>
<div class="tw"><table><thead><tr><th>Zweig</th><th>Gesetz</th><th>Träger</th><th>Risiken</th></tr></thead><tbody>
<tr><td>Krankenversicherung</td><td>SGB V</td><td>Krankenkassen</td><td>Krankheit, Arbeitsunfähigkeit</td></tr>
<tr><td>Rentenversicherung</td><td>SGB VI</td><td>Deutsche Rentenversicherung</td><td>Alter, Erwerbsminderung, Tod</td></tr>
<tr><td>Pflegeversicherung</td><td>SGB XI</td><td>Pflegekassen bei den Krankenkassen</td><td>Pflegebedürftigkeit</td></tr>
<tr><td>Unfallversicherung</td><td>SGB VII</td><td>Berufsgenossenschaften, Unfallkassen</td><td>Arbeitsunfall, Berufskrankheit</td></tr>
<tr><td>Arbeitsförderung</td><td>SGB III</td><td>Bundesagentur für Arbeit</td><td>Arbeitslosigkeit</td></tr></tbody></table></div>
<h4>Pflichtversicherung in der GKV (§ 5 Abs. 1 SGB V)</h4>
<ul><li>Beschäftigte (Nr. 1); Bezieher von Arbeitslosengeld (Nr. 2) und Grundsicherungsgeld nach SGB II (Nr. 2a)</li><li>Rentner bei erfüllter Vorversicherungszeit (Nr. 11)</li><li>Menschen mit Behinderung in Werkstätten (Nr. 7)</li><li><b>Auffangversicherungspflicht</b> (Nr. 13) für Personen ohne anderweitige Absicherung, die zuletzt gesetzlich oder bisher nicht versichert waren</li></ul>
<p>Bezieher von Leistungen nach dem SGB XII ohne eigene Versicherung erhalten Krankenbehandlung über eine Krankenkasse auf Kosten des Sozialhilfeträgers (§ 264 Abs. 2 SGB V).</p>
<div class="mark"><b>Praxis:</b> Beitragsschulden in der Auffangversicherung und das <b>Ruhen von Leistungen</b> (§ 16 Abs. 3a SGB V, nur akute Behandlung) sind häufig. Bei Hilfebedürftigkeit endet das Ruhen. Rückstände klären, Ratenzahlung oder Erlass beantragen und auf Leistungen nach SGB II oder XII hinwirken.</div>`,
 f:'Erste Frage: Versicherungsschutz; § 5 Abs. 1 Nr. 13, Ruhen nach § 16 Abs. 3a.',
 rel:['n_kvleist','n_sgb12_abgr','n_sgb12_regel'],l:LK(['SGB V',5],['SGB V',16],['SGB V',264])});

N('n_genfikt','t_kv','Genehmigungsfiktion',{p:'§ 13 Abs. 3a SGB V',k:['SGB V|13'],m:[8],src:'SGBV',sum:'Keine Entscheidung binnen 3 (5) Wochen ohne begründete Mitteilung → Leistung gilt als genehmigt (Selbstbeschaffung).',
 b:`<p>Die Krankenkasse muss über einen Antrag zügig, spätestens <b>drei Wochen</b> nach Antragseingang entscheiden, bei Einholung einer gutachtlichen Stellungnahme (z. B. des Medizinischen Dienstes) innerhalb von <b>fünf Wochen</b>. Kann sie die Frist nicht einhalten, muss sie das unter Darlegung der Gründe rechtzeitig schriftlich oder elektronisch mitteilen. Erfolgt <b>keine Mitteilung eines hinreichenden Grundes</b>, gilt die Leistung nach Fristablauf als genehmigt.</p>
<div class="mark"><b>Rechtsprechung:</b> Die Fiktion begründet keinen eigenständigen Sachleistungsanspruch mehr, sondern berechtigt, sich die Leistung <b>selbst zu beschaffen und Kostenerstattung zu verlangen</b> (§ 13 Abs. 3a S. 7). Für Leistungen zur medizinischen Rehabilitation gelten die Regeln des SGB IX (§§ 14 ff., 18 SGB IX).</div>
<p>Praxis: Antragsdatum und Eingang dokumentieren (Einschreiben, Eingangsstempel), Fristen im Kalender notieren.</p>`,
 f:'3/5 Wochen, Fiktion = Selbstbeschaffungsrecht + Erstattung.',
 q:['Was bewirkt die Genehmigungsfiktion nach heutiger Rechtsprechung?','Berechtigung zur Selbstbeschaffung und Anspruch auf Kostenerstattung, kein eigenständiger Sachleistungsanspruch.'],
 rel:['n_kvleist','n_antrag','f8_1'],l:LK(['SGB V',13])});

N('n_krg','t_kv','Krankengeld',{p:'§§ 44–51 SGB V',k:['SGB V|44','SGB V|46','SGB V|47','SGB V|48','SGB V|51'],m:[8],src:'SGBV',sum:'70 % des Brutto, höchstens 90 % des Netto; 78 Wochen in drei Jahren; lückenlose AU-Feststellung.',
 b:`<p><b>§ 44 Abs. 1:</b> Versicherte haben Anspruch auf Krankengeld, wenn die Krankheit sie arbeitsunfähig macht oder sie auf Kosten der Krankenkasse stationär behandelt werden.</p>
<ul><li><b>Höhe (§ 47):</b> 70 % des regelmäßig erzielten Arbeitsentgelts, höchstens 90 % des Nettoentgelts.</li><li><b>Dauer (§ 48):</b> für dieselbe Krankheit höchstens 78 Wochen innerhalb von drei Jahren.</li><li><b>Lückenlose Feststellung (§ 46):</b> Die Arbeitsunfähigkeit ist spätestens am nächsten Werktag nach dem Ende der zuletzt festgestellten AU erneut ärztlich festzustellen.</li><li><b>Aufforderung zum Reha-Antrag (§ 51):</b> Bei erheblich gefährdeter oder geminderter Erwerbsfähigkeit muss der Antrag binnen zehn Wochen gestellt werden, sonst entfällt das Krankengeld. Der Reha-Antrag kann als Rentenantrag gelten (§ 116 Abs. 2 SGB VI).</li></ul>
<div class="mark">Die Aufforderung nach § 51 ist ein <b>Verwaltungsakt</b>. Betreuer prüfen sie und legen ggf. Widerspruch ein, wenn der Rentenbeginn für den Betreuten ungünstig ist (z. B. Krankengeld höher als die Rente).</div>
<p>Nach Ende des Krankengeldes (Aussteuerung) kommt Arbeitslosengeld nach der Nahtlosigkeitsregelung (§ 145 SGB III) in Betracht, auch wenn die Erwerbsfähigkeit noch nicht geklärt ist.</p>
<h4>Rechenbeispiel</h4><p>Brutto 2.500 €, netto 1.750 €: 70 % von 2.500 € = 1.750 €; Deckel 90 % von 1.750 € = 1.575 € → Krankengeld <b>1.575 €</b>.</p>`,
 f:'Rechnen: 70 % Brutto, Deckel 90 % Netto; § 51-Aufforderung als Verwaltungsakt.',
 q:['Wie berechnet sich das Krankengeld bei 2.500 € brutto und 1.750 € netto?','70 % von 2.500 € = 1.750 €, begrenzt auf 90 % von 1.750 € = 1.575 €.'],
 rel:['n_rente','n_va','n_wid','f8_1','f8_4'],l:LK(['SGB V',44],['SGB V',46],['SGB V',47],['SGB V',48],['SGB V',51],['SGB III',145])});

N('n_zuz','t_kv','Zuzahlungen und Belastungsgrenze',{p:'§§ 61, 62 SGB V',k:['SGB V|61','SGB V|62'],m:[8],src:'SGBV',sum:'Belastungsgrenze 2 % (chronisch krank 1 %); bei Grundsicherung/Sozialhilfe nur Regelbedarfsstufe 1 als Bruttoeinnahme.',
 b:`<p>Zuzahlungen betragen grundsätzlich 10 % des Abgabepreises, mindestens 5 und höchstens 10 €, nicht mehr als die Kosten des Mittels; bei Krankenhausbehandlung 10 € je Kalendertag für höchstens 28 Tage (§ 61, § 39 Abs. 4).</p>
<p><b>§ 62 Abs. 1:</b> Zuzahlungen nur bis zur <b>Belastungsgrenze</b> von 2 % der jährlichen Bruttoeinnahmen zum Lebensunterhalt; für chronisch Kranke in Dauerbehandlung 1 %. Ist die Grenze erreicht, erteilt die Krankenkasse eine Befreiungsbescheinigung.</p>
<p>Für Bezieher von Grundsicherungsgeld, Sozialhilfe und Menschen in Einrichtungen, deren Kosten der Sozialhilfeträger trägt, zählt als Bruttoeinnahme nur der <b>Regelbedarf der Stufe 1</b> (§ 62 Abs. 2 S. 5, 6). 2026: 563 € × 12 = <b>6.756 €</b> → Belastungsgrenze <b>135,12 €</b> (2 %) bzw. <b>67,56 €</b> (1 %).</p>
<p>Viele Kassen erlauben die Vorauszahlung des Jahresbetrags mit sofortiger Befreiung – besonders praktisch im Pflegeheim.</p>
<div class="mark"><b>Aktuell:</b> Mit dem GKV-Beitragssatzstabilisierungsgesetz (BGBl. 2026 I Nr. 228) steigen die Zuzahlungen ab 1.1.2027: grundsätzlich mindestens 7,50 € und höchstens 15 €, bei Krankenhausbehandlung 15 € je Tag. Die Belastungsgrenzen bleiben. Vor Kursen im Jahr 2027 aktualisieren.</div>`,
 f:'6.756 € → 135,12 € / 67,56 €; Zuzahlungen ab 2027 höher.',
 q:['Welche Belastungsgrenze gilt 2026 für eine chronisch kranke Grundsicherungsbezieherin?','1 % von 6.756 € = 67,56 €.'],
 rel:['n_sgb12_regel','n_kvleist','f8_3'],l:LK(['SGB V',61],['SGB V',62])});

N('n_rente','t_rv','Rente wegen Erwerbsminderung',{p:'§ 43 SGB VI',k:['SGB VI|43','SGB VI|50','SGB VI|101','SGB VI|102','SGB VI|115','SGB VI|116'],m:[8],src:'SGBVI',sum:'Unter 6 bzw. 3 Stunden täglich; 5 Jahre Wartezeit, 3 Jahre Pflichtbeiträge in 5 Jahren; Reha vor Rente.',
 b:`<p><b>Teilweise erwerbsgemindert</b> (§ 43 Abs. 1): wegen Krankheit oder Behinderung auf nicht absehbare Zeit außerstande, unter den üblichen Bedingungen des allgemeinen Arbeitsmarktes mindestens sechs Stunden täglich erwerbstätig zu sein. <b>Voll erwerbsgemindert</b> (Abs. 2): weniger als drei Stunden. Abs. 3: Wartezeit von 20 Jahren, wenn die volle Erwerbsminderung vor Erfüllung der allgemeinen Wartezeit eintrat und ununterbrochen besteht.</p>
<h4>Prüfschema</h4>
<ol><li><b>Antrag</b> (§ 115 Abs. 1); Reha-Antrag kann als Rentenantrag gelten (§ 116 Abs. 2).</li><li><b>Medizinisch:</b> Leistungsvermögen unter 6 (teilweise) bzw. unter 3 Stunden (voll) täglich auf dem allgemeinen Arbeitsmarkt.</li><li><b>Arbeitsmarktrente:</b> Bei 3 bis unter 6 Stunden und verschlossenem Teilzeitarbeitsmarkt leistet die Rechtsprechung volle Erwerbsminderungsrente.</li><li><b>Versicherungsrechtlich:</b> allgemeine Wartezeit 5 Jahre (§ 50 Abs. 1) und 3 Jahre Pflichtbeiträge in den letzten 5 Jahren (Ausnahmen §§ 43 Abs. 4, 53).</li><li><b>Reha vor Rente.</b></li><li><b>Befristung:</b> in der Regel auf Zeit, höchstens drei Jahre je Befristung; unbefristet, wenn Besserung unwahrscheinlich (§ 102 Abs. 2). Befristete Renten beginnen frühestens mit dem siebten Kalendermonat nach Eintritt der Erwerbsminderung (§ 101 Abs. 1).</li></ol>
<p><b>Hinzuverdienst 2026:</b> volle EM-Rente jährlich 20.763,75 €; teilweise EM-Rente Mindestgrenze 41.527,50 €.</p>
<div class="mark">Die Feststellung voller Erwerbsminderung entscheidet über den Wechsel vom Jobcenter ins SGB XII (<a data-go="n_sgb12_ga">Einheit 7</a>). Beides gemeinsam planen.</div>`,
 f:'Prüfschema, Wartezeit 5 J., 3 von 5 Jahren Pflichtbeiträge, Befristung.',
 q:['Welche versicherungsrechtlichen Voraussetzungen hat die Erwerbsminderungsrente?','Allgemeine Wartezeit 5 Jahre und 3 Jahre Pflichtbeiträge in den letzten 5 Jahren vor Eintritt der Erwerbsminderung.'],
 rel:['n_altersrente','n_sgb12_ga','n_erwerbsf','n_krg','f8_4'],l:LK(['SGB VI',43],['SGB VI',50],['SGB VI',101],['SGB VI',102],['SGB VI',115],['SGB VI',116])});

N('n_altersrente','t_rv','Altersrente und Rentenbeginn',{p:'§ 99 SGB VI, § 12a SGB II',k:['SGB VI|99','SGB VI|77','SGB II|12a'],m:[8],src:'SGBVI',sum:'Rentenantrag etwa drei Monate vor Beginn; Altersrente schließt SGB II aus; vorzeitige Rente mit Abschlägen nur bei Zumutbarkeit.',
 b:`<ul><li>Die Regelaltersgrenze steigt stufenweise auf 67 Jahre für Jahrgänge ab 1964; für besonders langjährig Versicherte (45 Beitragsjahre) ist die Altersrente abschlagsfrei vor der Regelaltersgrenze möglich.</li><li>Aktueller Rentenwert seit 1.7.2026: <b>42,52 €</b>; Renten stiegen um 4,24 % (BGBl. 2026 I Nr. 178).</li><li><b>Rentenbeginn (§ 99 Abs. 1):</b> mit dem Monat, zu dessen Beginn die Voraussetzungen erfüllt sind, wenn der Antrag bis zum Ende des dritten Kalendermonats danach gestellt wird; sonst erst mit dem Antragsmonat. Antrag daher etwa drei Monate vor dem geplanten Beginn stellen.</li><li>Wer Altersrente bezieht, ist vom SGB II ausgeschlossen (§ 7 Abs. 4 SGB II); bei zu niedriger Rente greift die Grundsicherung im Alter.</li><li>Vorzeitige Altersrenten mit Abschlägen (0,3 % je Monat, § 77 SGB VI) können Bezieher von Grundsicherungsgeld unter Voraussetzungen beantragen müssen (§ 12a SGB II, Unbilligkeitsverordnung) – besondere Vorsicht, siehe <a data-go="f10_4">Fall 10.4</a>.</li></ul>`,
 f:'§ 99: Antrag 3 Monate rückwirkend unschädlich; Zwangsrente § 12a SGB II.',
 rel:['n_rente','n_sgb12_ga','f7_1','f10_4'],l:LK(['SGB VI',99],['SGB VI',77],['SGB II','12a'])});

N('n_pflegegrad','t_pv','Pflegebedürftigkeit und Pflegegrade',{p:'§§ 14, 15, 18, 33 SGB XI',k:['SGB XI|14','SGB XI|15','SGB XI|18','SGB XI|33','SGB XI|7a'],m:[8],src:'SGBXI',sum:'Sechs Module, Gewichtung, Punkte → Pflegegrad 1–5; Antrag wirkt ab Antragstellung.',
 b:`<p>Pflegebedürftig sind Personen mit gesundheitlich bedingten Beeinträchtigungen der Selbständigkeit oder Fähigkeiten, die der Hilfe durch andere bedürfen, voraussichtlich für mindestens <b>sechs Monate</b> (§ 14 Abs. 1). Maßgeblich sind sechs Module (§ 14 Abs. 2).</p>
<div class="tw"><table><thead><tr><th>Modul</th><th>Gewicht</th></tr></thead><tbody><tr><td>1 Mobilität</td><td>10 %</td></tr><tr><td>2 Kognitive/kommunikative Fähigkeiten und 3 Verhaltensweisen/psychische Problemlagen (nur das höhere zählt)</td><td>15 %</td></tr><tr><td>4 Selbstversorgung</td><td>40 %</td></tr><tr><td>5 Umgang mit krankheits-/therapiebedingten Anforderungen</td><td>20 %</td></tr><tr><td>6 Alltagsleben und soziale Kontakte</td><td>15 %</td></tr></tbody></table></div>
<div class="tw"><table><thead><tr><th>Gesamtpunkte</th><th>Pflegegrad</th></tr></thead><tbody><tr><td>12,5 bis unter 27</td><td>1 – geringe Beeinträchtigung</td></tr><tr><td>27 bis unter 47,5</td><td>2 – erhebliche</td></tr><tr><td>47,5 bis unter 70</td><td>3 – schwere</td></tr><tr><td>70 bis unter 90</td><td>4 – schwerste</td></tr><tr><td>90 bis 100</td><td>5 – schwerste mit besonderen Anforderungen an die pflegerische Versorgung</td></tr></tbody></table></div>
<h4>Antrag und Begutachtung</h4>
<ul><li>Leistungen auf <b>Antrag</b>, ab Antragstellung, frühestens ab Vorliegen der Voraussetzungen (§ 33 Abs. 1).</li><li>Begutachtung durch den Medizinischen Dienst (§ 18); Entscheidung grundsätzlich binnen <b>25 Arbeitstagen</b>; bei Fristüberschreitung zahlt die Pflegekasse 70 € je begonnener Woche, wenn sie die Verzögerung zu vertreten hat (§ 18c). Bei Krankenhausaufenthalt gelten verkürzte Fristen.</li><li>Anspruch auf Pflegeberatung (§ 7a), auch in Pflegestützpunkten.</li></ul>`,
 f:'Gewichtung 10/15/40/20/15; Schwellen 12,5/27/47,5/70/90; 25 Arbeitstage.',
 q:['Ab wie vielen Punkten liegt Pflegegrad 3 vor und warum früh beantragen?','Ab 47,5 Punkten; Leistungen werden erst ab Antragstellung erbracht (§ 33 Abs. 1 SGB XI).'],
 rel:['n_pvleist','f8_1','f8_2'],l:LK(['SGB XI',14],['SGB XI',15],['SGB XI',18],['SGB XI','18c'],['SGB XI',33],['SGB XI','7a'])});

N('n_pvleist','t_pv','Leistungen der Pflegeversicherung 2026',{p:'§§ 36, 37, 43, 45b SGB XI',k:['SGB XI|36','SGB XI|37','SGB XI|43','SGB XI|45b','SGB XI|38','SGB XI|13'],m:[8],src:'SGBXI',sum:'Pflegegeld, Sachleistung, Entlastungsbetrag, vollstationäre Pflege nach Pflegegrad.',
 b:`<div class="tw"><table><thead><tr><th>Leistung</th><th>PG 1</th><th>PG 2</th><th>PG 3</th><th>PG 4</th><th>PG 5</th></tr></thead><tbody>
<tr><td>Pflegegeld (§ 37)</td><td>–</td><td>347 €</td><td>599 €</td><td>800 €</td><td>990 €</td></tr>
<tr><td>Pflegesachleistung (§ 36)</td><td>–</td><td>796 €</td><td>1.497 €</td><td>1.859 €</td><td>2.299 €</td></tr>
<tr><td>Entlastungsbetrag (§ 45b)</td><td>131 €</td><td>131 €</td><td>131 €</td><td>131 €</td><td>131 €</td></tr>
<tr><td>Vollstationäre Pflege (§ 43)</td><td>131 € Zuschuss</td><td>805 €</td><td>1.319 €</td><td>1.855 €</td><td>2.096 €</td></tr></tbody></table></div>
<ul><li>Gemeinsamer Jahresbetrag Verhinderungs- und Kurzzeitpflege: 3.539 € ab Pflegegrad 2.</li><li>Kombinationsleistung Pflegegeld/Sachleistung (§ 38).</li><li>Beratungseinsatz bei Pflegegeldbezug: halbjährlich bei PG 2 und 3, vierteljährlich bei PG 4 und 5 (§ 37 Abs. 3).</li><li>Leistungszuschläge zum Eigenanteil im Heim, gestaffelt nach Verweildauer (§ 43c).</li><li>Wohnumfeldverbessernde Maßnahmen, Pflegehilfsmittel, Rentenversicherungsbeiträge für Pflegepersonen (§ 44).</li></ul>
<p>Pflegegeld ist für den Pflegebedürftigen <b>kein Einkommen</b> bei Sozialleistungen (§ 13 Abs. 5 SGB XI). Reicht die Pflegeversicherung nicht (v. a. Heimkosten), tritt die Hilfe zur Pflege (§§ 61 ff. SGB XII) ergänzend ein (Modul 9).</p>
<div class="mark"><b>Aktuell:</b> Der Entwurf eines Pflegeneuordnungsgesetzes wurde am 5.11.2026 im Bundestag in erster Lesung beraten und soll nach den Plänen der Bundesregierung zum 1.1.2027 in Kraft treten. Er ist noch nicht geltendes Recht.</div>`,
 f:'Leistungsbeträge je Pflegegrad; Pflegegeld nicht anrechenbar.',
 rel:['n_pflegegrad','n_sgb12_weitere','n_nichteink','f10_2'],l:LK(['SGB XI',36],['SGB XI',37],['SGB XI',43],['SGB XI','45b'],['SGB XI',13])});

N('f8_1','t_faelle','Fall 8.1: Nach dem Schlaganfall',{p:'Fall',m:[8],src:'SGBV',sum:'Reihenfolge der Anträge bei Krankheit eines Erwerbstätigen.',
 b:`<h4>Sachverhalt</h4><p>Herr R., 58, Lagerarbeiter, erleidet einen Schlaganfall, ist halbseitig gelähmt. Vorläufige Betreuerin ist seine Schwester (Gesundheits-, Vermögenssorge, Behörden). Brutto 2.900 €, netto 2.000 €, seit 30 Jahren durchgehend beschäftigt.</p>
<details><summary>Lösungshinweise</summary><ol><li>Entgeltfortzahlung sechs Wochen (§ 3 EntgFG), danach Krankengeld: 70 % von 2.900 € = 2.030 €, begrenzt auf 90 % von 2.000 € = 1.800 € monatlich (vor SV-Beiträgen).</li><li>Lückenlose AU-Feststellung sichern; Entlassmanagement nutzen (§ 39 Abs. 1a SGB V).</li><li>Anschlussreha: bei Erwerbstätigen i. d. R. Rentenversicherung; Antrag aus dem Krankenhaus.</li><li>Pflegeantrag sofort stellen (Leistungsbeginn ab Antrag), verkürzte Begutachtungsfrist.</li><li>Hilfsmittel nach § 33 SGB V; Fristen nach <a data-go="n_genfikt">§ 13 Abs. 3a</a> notieren.</li><li>Bei dauerhafter Leistungsminderung <a data-go="n_rente">Erwerbsminderungsrente</a>; auf eine Aufforderung nach § 51 SGB V achten.</li><li>Schwerbehinderung beantragen (Merkzeichen G, aG, B; Fahrkosten, Mehrbedarf).</li></ol></details>`,
 rel:['n_krg','n_kvleist','n_pflegegrad','n_rente'],l:[]});
N('f8_2','t_faelle','Fall 8.2: Der abgelehnte Pflegegrad',{p:'Fall',m:[8],src:'SGBXI',sum:'Widerspruch gegen Pflegegrad-Ablehnung, modulbezogene Begründung.',
 b:`<h4>Sachverhalt</h4><p>Frau T., 81, beginnende Demenz, lebt allein. Der Medizinische Dienst ermittelt 24 Punkte, die Pflegekasse lehnt ab. Im Gutachten fehlen nächtliche Unruhe, Weglauftendenzen und die Unfähigkeit, Medikamente selbständig zu nehmen.</p>
<details><summary>Lösungshinweise</summary><ol><li>Widerspruch binnen eines Monats (§ 84 SGG); Gutachten anfordern (§ 25 SGB X).</li><li>Begründung modulbezogen: Modul 3 (Verhaltensweisen) und Modul 5 (Medikamente); wenige Zusatzpunkte genügen für 27 Punkte (Pflegegrad 2).</li><li>Pflegetagebuch und ärztliche Stellungnahmen beifügen, Neubegutachtung verlangen.</li><li>Zwischenzeitlich Pflegegrad 1 prüfen (ab 12,5 Punkten): Entlastungsbetrag 131 €, Beratung, wohnumfeldverbessernde Maßnahmen.</li></ol></details>`,
 rel:['n_pflegegrad','n_wid'],l:[]});
N('f8_3','t_faelle','Fall 8.3: Zuzahlungen im Pflegeheim',{p:'Fall',m:[8],src:'SGBV',sum:'Befreiung durch Vorauszahlung der Belastungsgrenze.',
 b:`<h4>Sachverhalt</h4><p>Herr B., 74, chronisch krank, lebt im Pflegeheim (Sozialamt trägt Kosten teilweise). Zuzahlungen in der Apotheke rund 25 € monatlich.</p>
<details><summary>Lösungshinweise</summary><ol><li>Bruttoeinnahmen nach § 62 Abs. 2 S. 5, 6: Regelbedarfsstufe 1 jährlich 6.756 €.</li><li>Chronisch krank: 1 % = 67,56 € jährlich.</li><li>Ohne Befreiung zahlt er ca. 300 € jährlich; zu Jahresbeginn Betrag vorauszahlen oder Belege sammeln und Befreiung beantragen.</li><li>Der Barbetrag wird entlastet. Ab 2027 steigen Zuzahlungen, die Belastungsgrenze schützt weiter.</li></ol></details>`,
 rel:['n_zuz','n_sgb12_regel'],l:[]});
N('f8_4','t_faelle','Fall 8.4: Erwerbsminderung bei psychischer Erkrankung',{p:'Fall',m:[8],src:'SGBVI',sum:'Rentenanspruch trotz Grundsicherungsgeldbezug; Anrechnungszeiten; Folgen für das SGB XII.',
 b:`<h4>Sachverhalt</h4><p>Frau N., 42, schizoaffektive Störung, zehn Jahre Beschäftigung, seit vier Jahren arbeitslos (erst ALG, dann Grundsicherungsgeld). Der Amtsarzt des Jobcenters hält sie für unter drei Stunden täglich leistungsfähig.</p>
<details><summary>Lösungshinweise</summary><ol><li>Rentenantrag bei der Rentenversicherung; das Jobcenter kann auf die Antragstellung hinwirken (§ 12a SGB II).</li><li><b>Versicherungsrechtlich:</b> allgemeine Wartezeit erfüllt. Drei Jahre Pflichtbeiträge in fünf Jahren prüfen: ALG-Zeiten sind Pflichtbeitragszeiten; Zeiten mit Grundsicherungsgeld seit 2011 nicht, können aber als Anrechnungszeiten den Fünfjahreszeitraum verlängern (§ 43 Abs. 4 SGB VI). Versicherungsverlauf anfordern.</li><li>Bei Erfolg: befristete volle EM-Rente ab dem siebten Monat nach Eintritt der Erwerbsminderung.</li><li>Fehlen die Voraussetzungen oder ist die Rente niedrig: Bei voller Erwerbsminderung für mehr als sechs Monate entfällt die Erwerbsfähigkeit (§ 8 SGB II). Bei befristeter Rente keine „dauerhafte“ Erwerbsminderung; Lebensunterhalt dann über Hilfe zum Lebensunterhalt, 3. Kapitel SGB XII (<a data-go="n_sgb12_abgr">Einheit 7</a>).</li><li>Betreuungsrechtlich: Entscheidung gemeinsam mit Frau N.; ein Rentenantrag ist weitreichend (§ 1821 BGB).</li></ol></details>`,
 rel:['n_rente','n_erwerbsf','n_sgb12_abgr'],l:LK(['BGB',1821])});

EH[9]={z:'Mitwirkungspflichten und ihre Grenzen, Versagung und Entziehung, Korrektur von Bescheiden (§§ 44, 45, 48, 50 SGB X), Aufrechnung, Widerspruch, Klage, Eilrechtsschutz, Kosten und Pfändungsschutz – mit Fristenkarte.',
 ks:['Versagung wegen fehlender Mitwirkung setzt einen schriftlichen Hinweis auf die konkrete Rechtsfolge und eine angemessene Frist voraus.','Mitwirkung nachholen und Antrag nach § 67 SGB I stellen ist oft schneller als ein Rechtsstreit.','Neu bestellte Betreuer stellen bei Bedarf sofort Überprüfungsanträge, weil die Rückwirkung im SGB II und SGB XII auf ein Jahr begrenzt ist.','Widerspruch und Klage gegen Aufhebungen im SGB II haben keine aufschiebende Wirkung; Eilrechtsschutz prüfen.','Im SGB II müssen Nachweise für die abschließende Entscheidung spätestens bis zum Abschluss des Widerspruchsverfahrens vorliegen (§ 41a Abs. 3).'],
 kq:[['Welche formellen Voraussetzungen muss ein Versagungsbescheid erfüllen?','Schriftlicher Hinweis auf die Rechtsfolge, angemessene Frist, Ermessensausübung (§ 66 Abs. 3 SGB I, § 35 SGB X).'],
 ['Wie weit wirkt ein erfolgreicher Überprüfungsantrag im SGB II zurück?','Ein Jahr (§ 40 Abs. 1 SGB II).'],

 ['Wer trägt die Gerichtskosten im sozialgerichtlichen Verfahren für Leistungsempfänger?','Niemand; das Verfahren ist gerichtskostenfrei (§ 183 SGG).']]};

N('n_mitw','t_mitwirkung','Mitwirkungspflichten und ihre Grenzen',{p:'§§ 60–65 SGB I',k:['SGB I|60','SGB I|61','SGB I|62','SGB I|63','SGB I|64','SGB I|65'],m:[9],src:'Weitere',sum:'Tatsachen angeben, Änderungen melden, Beweismittel vorlegen – begrenzt durch § 65 SGB I.',
 b:`<p><b>§ 60 Abs. 1 SGB I:</b> Wer Sozialleistungen beantragt oder erhält, muss (1) alle leistungserheblichen Tatsachen angeben und Auskünften Dritter zustimmen, (2) Änderungen in den Verhältnissen <b>unverzüglich</b> mitteilen, (3) Beweismittel bezeichnen und Beweisurkunden vorlegen oder ihrer Vorlage zustimmen. Gilt entsprechend für Erstattungspflichtige.</p>
<div class="tw"><table><thead><tr><th>Pflicht</th><th>Norm</th><th>Beispiel</th></tr></thead><tbody><tr><td>Persönliches Erscheinen</td><td>§ 61</td><td>Vorsprache zur Klärung von Einkommen</td></tr><tr><td>Untersuchungen</td><td>§ 62</td><td>ärztliche Begutachtung der Erwerbsfähigkeit</td></tr><tr><td>Heilbehandlung</td><td>§ 63</td><td>Therapie zur Besserung der Erwerbsfähigkeit</td></tr><tr><td>Berufsfördernde Maßnahmen</td><td>§ 64</td><td>Teilnahme an Rehabilitation</td></tr></tbody></table></div>
<h4>Grenzen (§ 65 Abs. 1, 2)</h4>
<ul><li>Aufwand außer Verhältnis zur Leistung oder ihrer Erstattung (Nr. 1);</li><li>Erfüllung aus wichtigem Grund nicht zumutbar (Nr. 2);</li><li>Leistungsträger kann sich die Kenntnisse mit geringerem Aufwand selbst beschaffen (Nr. 3);</li><li>Behandlungen/Untersuchungen mit Gefahr für Leben oder Gesundheit, erheblichen Schmerzen oder erheblichem Eingriff in die körperliche Unversehrtheit können abgelehnt werden (Abs. 2).</li></ul>
<p>Kontoauszüge dürfen angefordert werden; Ausgaben mit besonderen personenbezogenen Daten (z. B. Beiträge an Parteien, Gewerkschaften, Religionsgemeinschaften) dürfen geschwärzt werden, Empfänger und Zweck, nicht aber die Beträge.</p>
<h4>Neue Regeln im SGB II ab 1.7.2026</h4>
<ul><li>Zweifel an der Arbeitsunfähigkeit insbesondere bei wiederholten AU-Bescheinigungen zur Entschuldigung versäumter Termine (§ 56 Abs. 1 S. 7 neu).</li><li>Vermieter müssen dem Jobcenter auf Verlangen Auskunft über Miethöhe, Mietdauer, Zahl der Nutzenden und Abrechnung geben (§ 60 Abs. 6 neu); Auskunftspflichtige müssen Beweismittel vorlegen (Abs. 7 neu).</li><li><b>§ 41a Abs. 3 (Präklusion):</b> Nachweise und Auskünfte, die nach Abschluss des Verwaltungsverfahrens, spätestens am Tag nach Bekanntgabe des Widerspruchsbescheides, zugehen, werden bei der abschließenden Entscheidung nicht berücksichtigt (BGBl. 2026 I Nr. 107, Art. 1 Nr. 31).</li></ul>
<div class="mark"><b>Praxis:</b> Bei Selbständigen oder schwankendem Einkommen müssen Nachweise spätestens im Widerspruchsverfahren vollständig vorliegen; Nachreichen im Klageverfahren hilft nicht mehr. Wiedervorlagen notieren.</div>
<h4>Mitwirkung und Betreuung</h4>
<p>Ist der Betreute krankheitsbedingt nicht in der Lage mitzuwirken, kann ein <b>wichtiger Grund</b> (§ 65 Abs. 1 Nr. 2) vorliegen. Der Betreuer ist im Aufgabenkreis gesetzlicher Vertreter und kann Mitwirkungshandlungen vornehmen, ist aber nicht selbst im eigenen Namen Adressat der Pflicht. Bekanntgaben an den geschäftsunfähigen Betreuten statt an den Betreuer sind unwirksam (<a data-go="n_bekanntgabe">Bekanntgabe</a>).</p>`,
 f:'§ 60 Abs. 1 Nr. 1–3, Grenzen § 65; § 41a Abs. 3 SGB II neu.',rel:['n_versagung','n_bekanntgabe','n_datenschutz','f9_1'],l:LK(['SGB I',60],['SGB I',61],['SGB I',62],['SGB I',63],['SGB I',64],['SGB I',65],['SGB II','41a'])});

N('n_versagung','t_mitwirkung','Versagung und Entziehung wegen fehlender Mitwirkung',{p:'§§ 66, 67 SGB I',k:['SGB I|66','SGB I|67'],m:[9],src:'Weitere',sum:'Nur nach schriftlichem Hinweis, mit Frist, Ermessen und nur bis zur Nachholung.',
 b:`<p><b>§ 66 Abs. 1:</b> Kommt der Leistungsberechtigte seinen Pflichten nach §§ 60–62, 65 nicht nach und wird die Aufklärung erheblich erschwert, kann der Träger ohne weitere Ermittlungen die Leistung bis zur Nachholung ganz oder teilweise versagen oder entziehen, soweit die Voraussetzungen nicht nachgewiesen sind. <b>Abs. 2/3:</b> Nur nach <b>schriftlichem Hinweis</b> auf diese Folge und Ablauf einer angemessenen Frist.</p>
<h4>Prüfschema</h4>
<ol><li>Mitwirkungspflicht nach §§ 60–62 besteht (Erforderlichkeit, Bestimmtheit).</li><li>Keine Grenze nach § 65.</li><li>Pflicht nicht erfüllt; Aufklärung dadurch erheblich erschwert.</li><li>Schriftlicher Hinweis auf die konkrete Rechtsfolge und angemessene Frist (§ 66 Abs. 3).</li><li>Ermessen ausgeübt und begründet (§ 35 SGB X), auch zur Frage teilweiser Versagung.</li><li>Nur bis zur Nachholung der Mitwirkung.</li></ol>
<div class="mark"><b>Nachholen lohnt:</b> Wird die Mitwirkung nachgeholt und liegen die Voraussetzungen vor, kann der Träger nachträglich leisten (§ 67 SGB I, Ermessen). In der Praxis: ausdrücklicher Antrag nach § 67 zusammen mit den Unterlagen.</div>`,
 f:'Prüfschema in 6 Schritten; § 67 als Weg aus der Versagung.',
 q:['Welche formellen Voraussetzungen hat ein Versagungsbescheid?','Schriftlicher Hinweis auf die Rechtsfolge, angemessene Frist, Ermessensausübung (§ 66 Abs. 3 SGB I, § 35 SGB X).'],
 rel:['n_mitw','n_s35','n_ueberpr','f9_1','f9_4'],l:LK(['SGB I',66],['SGB I',67],['SGB X',35])});

N('n_ueberpr','t_mitwirkung','Überprüfungsantrag (§ 44 SGB X)',{p:'§ 44 SGB X, § 40 SGB II',k:['SGB X|44'],m:[9],src:'SGBX',sum:'Auch bestandskräftige rechtswidrige Bescheide können zurückgenommen werden; Rückwirkung vier Jahre, im SGB II/XII ein Jahr.',
 b:`<p><b>§ 44 Abs. 1:</b> Ergibt sich, dass bei Erlass eines Verwaltungsakts das Recht unrichtig angewandt oder von einem unrichtigen Sachverhalt ausgegangen worden ist und deshalb Sozialleistungen zu Unrecht nicht erbracht wurden, ist er – auch nach Unanfechtbarkeit – mit Wirkung für die Vergangenheit zurückzunehmen. <b>Abs. 4:</b> Leistungen werden längstens für vier Jahre vor der Rücknahme erbracht; im <b>SGB II und SGB XII nur ein Jahr</b> (§ 40 Abs. 1 SGB II, § 116a SGB XII).</p>
<div class="mark">Das wichtigste Instrument für neu bestellte Betreuer: auch bestandskräftige Bescheide aus der Zeit vor der Betreuung lassen sich prüfen. Wegen der Jahresgrenze im SGB II/XII den Antrag <b>sofort nach der Bestellung</b> stellen.</div>`,
 f:'§ 44 SGB X: Rückwirkung 4 Jahre; SGB II/XII 1 Jahr.',
 q:['Wie weit wirkt ein Überprüfungsantrag im SGB II zurück?','Ein Jahr (§ 40 Abs. 1 SGB II); in anderen Büchern vier Jahre (§ 44 Abs. 4 SGB X).'],
 rel:['n_aufheb','n_fristen','n_va','f9_1'],l:LK(['SGB X',44],['SGB II',40],['SGB XII','116a'])});

N('n_aufheb','t_mitwirkung','Rücknahme, Aufhebung und Erstattung',{p:'§§ 45, 48, 50 SGB X; § 43 SGB II',k:['SGB X|45','SGB X|48','SGB X|50','SGB II|43','SGB II|40','SGB II|42a'],m:[9],src:'SGBX',sum:'§ 45 (von Anfang an rechtswidrig), § 48 (Änderung der Verhältnisse), § 50 (Erstattung), Aufrechnung nach § 43 SGB II.',
 b:`<div class="tw"><table><thead><tr><th>Norm</th><th>Konstellation</th><th>Kernvoraussetzungen</th><th>Frist</th></tr></thead><tbody>
<tr><td>§ 44 SGB X</td><td>rechtswidriger belastender Bescheid (zu wenig bewilligt)</td><td>Recht unrichtig angewandt oder falscher Sachverhalt</td><td>Nachzahlung bis 4 Jahre; SGB II/XII 1 Jahr</td></tr>
<tr><td>§ 45 SGB X</td><td>von Anfang an rechtswidriger begünstigender Bescheid</td><td>Vertrauensschutz entfällt nur bei Bösgläubigkeit (Abs. 2 S. 3)</td><td>grundsätzlich 2 Jahre, bei Bösgläubigkeit 10 Jahre; 1 Jahr ab Kenntnis</td></tr>
<tr><td>§ 48 SGB X</td><td>nachträgliche Änderung der Verhältnisse</td><td>wesentliche Änderung; Rückwirkung bei Verletzung der Mitteilungspflicht oder Einkommenszufluss</td><td>1 Jahr ab Kenntnis</td></tr>
<tr><td>§ 50 SGB X</td><td>Erstattung</td><td>aufgehobener Verwaltungsakt</td><td>Festsetzung durch Verwaltungsakt</td></tr></tbody></table></div>
<h4>§ 48 Abs. 1 SGB X</h4>
<p>Bei wesentlicher Änderung ist der Dauerverwaltungsakt für die Zukunft aufzuheben; <b>mit Wirkung vom Zeitpunkt der Änderung</b> soll aufgehoben werden, wenn (1) die Änderung zugunsten des Betroffenen erfolgt, (2) er einer Mitteilungspflicht vorsätzlich oder grob fahrlässig nicht nachkam, (3) nach Antragstellung oder Erlass <b>Einkommen oder Vermögen</b> erzielt wurde, das den Anspruch gemindert hätte, oder (4) er wusste bzw. in besonders schwerem Maße sorgfaltswidrig nicht wusste, dass der Anspruch ruht oder weggefallen ist.</p>
<p>Im SGB II ist das „Soll“ zur gebundenen Entscheidung verschärft (§ 40 Abs. 2 SGB II i. V. m. § 330 Abs. 3 SGB III): Das Jobcenter <b>muss</b> aufheben. Bei krankheitsbedingter Unfähigkeit zur Einsicht kann <b>grobe Fahrlässigkeit fehlen</b> – ein wichtiges Verteidigungsargument für Betreute.</p>
<h4>Aufrechnung und Darlehenstilgung (§ 43 SGB II neu ab 1.7.2026)</h4>
<p>Jobcenter können gegen Ansprüche auf Geldleistungen zur Sicherung des Lebensunterhalts aufrechnen mit Erstattungsansprüchen nach § 50 SGB X, Ersatzansprüchen nach §§ 34, 34a, Erstattungsansprüchen nach § 34b und § 41a Abs. 6 S. 3; sie müssen aufrechnen, wenn nach § 24 Abs. 2 Nr. 7 SGB X von einer Anhörung abgesehen werden kann (BGBl. 2026 I Nr. 107, Art. 1 Nr. 33).</p>
<ul><li>Höhe: Prozentsatz des Regelbedarfs, je nach Rechtsgrund 10–30 % (§ 43 Abs. 2); Aufrechnung per Verwaltungsakt, zeitlich begrenzt (§ 43 Abs. 4).</li><li>Darlehen nach § 24 Abs. 1: Tilgung durch monatliche Aufrechnung von 5 % des Regelbedarfs (§ 42a Abs. 2).</li><li>Obergrenzen bei mehreren Aufrechnungen; das Existenzminimum darf nicht dauerhaft unterschritten werden.</li></ul>`,
 f:'§ 45 vs. § 48; Erstattung § 50; neue Aufrechnungsregel.',rel:['n_ueberpr','n_wid','n_va','f9_2'],l:LK(['SGB X',45],['SGB X',48],['SGB X',50],['SGB II',43],['SGB II',40],['SGB X',24])});

N('n_wid','t_rechtsschutz','Widerspruch und Klage',{p:'§§ 84, 87, 88, 64, 66, 67 SGG',k:['SGG|84','SGG|87','SGG|88','SGG|64','SGG|66','SGG|67','SGG|183'],m:[9],src:'SGG',sum:'Widerspruch 1 Monat, Klage 1 Monat nach Widerspruchsbescheid, Untätigkeitsklage, Wiedereinsetzung, Gerichtskostenfreiheit.',
 b:`<h4>Widerspruch</h4>
<ul><li>Frist: <b>ein Monat</b> nach Bekanntgabe (§ 84 Abs. 1 SGG); schriftlich, elektronisch oder zur Niederschrift.</li><li>Bei fehlender/unrichtiger Rechtsbehelfsbelehrung: <b>ein Jahr</b> (§ 66 Abs. 2 SGG).</li><li>Fristberechnung nach § 64 SGG; endet die Frist an Samstag, Sonntag oder Feiertag, mit Ablauf des nächsten Werktages.</li><li><b>Wiedereinsetzung</b> bei unverschuldeter Fristversäumnis: Antrag binnen eines Monats nach Wegfall des Hindernisses (§ 67 SGG). Die krankheitsbedingte Unfähigkeit, Post zu öffnen, kann ein Grund sein (glaubhaft machen, ärztliches Attest).</li><li><b>Elektronisch:</b> Eine einfache Nachricht über das Jobcenter-Postfach genügte nach LSG NRW (Beschluss vom 29.4.2026, L 2 AS 91/26 B ER) nicht der Schriftform. Sicherer: Brief mit Zustellnachweis, Fax oder Niederschrift.</li></ul>
<div class="mark"><b>§ 39 SGB II, § 86a Abs. 2 Nr. 4 SGG:</b> Widerspruch und Klage gegen Bescheide, die SGB-II-Leistungen aufheben, zurücknehmen, entziehen, mindern oder zur Mitwirkung auffordern, haben <b>keine aufschiebende Wirkung</b>. Bei existenzbedrohenden Bescheiden zusätzlich <a data-go="n_eil">Eilantrag</a> prüfen.</div>
<h4>Klage</h4>
<ul><li>Frist: ein Monat nach Bekanntgabe des Widerspruchsbescheides (§ 87 SGG).</li><li>Zuständig in Dresden: Sozialgericht Dresden; Berufung zum Sächsischen Landessozialgericht (Chemnitz).</li><li>Gerichtskostenfrei für Versicherte und Leistungsempfänger (§ 183 SGG).</li><li><b>Untätigkeitsklage (§ 88):</b> nicht vor Ablauf von sechs Monaten seit dem Antrag zulässig; bei Widerspruch gilt als angemessene Frist <b>drei Monate</b>.</li></ul>
<h4>Kosten und Zugang zum Recht</h4>
<ul><li>Prozesskostenhilfe (§ 73a SGG i. V. m. §§ 114 ff. ZPO); Beratungshilfe nach dem Beratungshilfegesetz (Amtsgericht).</li><li>Kostenerstattung im erfolgreichen Widerspruchsverfahren (§ 63 SGB X).</li><li>Rechtsbehelfe gehören zur Betreuungsführung; bei komplexen Fragen Anwalt sinnvoll; abrechenbar unter den Voraussetzungen des § 1877 Abs. 3 BGB.</li></ul>`,
 f:'Fristen 1 Monat/1 Jahr; Untätigkeitsklage 6 bzw. 3 Monate; keine aufschiebende Wirkung § 39 SGB II.',
 q:['Wann ist eine Untätigkeitsklage zulässig?','Sechs Monate nach Antrag, bei unentschiedenem Widerspruch drei Monate (§ 88 SGG).'],
 rel:['n_fristen','n_eil','n_va','n_bekanntgabe','n_wieder','f9_1','f9_3'],l:LK(['SGG',84],['SGG',87],['SGG',88],['SGG',64],['SGG',66],['SGG',67],['SGG',183],['SGB X',63],['BGB',1877])});

N('n_wieder','t_rechtsschutz','Wiedereinsetzung in den vorigen Stand',{p:'§ 67 SGG',k:['SGG|67'],m:[9],src:'SGG',sum:'Antrag binnen eines Monats nach Wegfall des Hindernisses; Versäumnis nachholen.',
 b:`<p>Wer ohne Verschulden verhindert war, eine gesetzliche Frist einzuhalten, ist auf Antrag <b>wieder in den vorigen Stand einzusetzen</b> (§ 67 SGG). Der Antrag ist <b>binnen eines Monats</b> nach Wegfall des Hindernisses zu stellen; innerhalb dieser Frist ist die versäumte Handlung nachzuholen (Widerspruch einlegen) und die Verhinderung glaubhaft zu machen.</p>
<ul><li>Typisch in der Betreuung: Der Betreute konnte krankheitsbedingt die Post nicht öffnen; die Frist läuft ab Kenntnis der Betreuerin.</li><li>Nachweis über ärztliches Attest oder Betreuungsakte führen.</li><li>Parallel immer den <a data-go="n_ueberpr">Überprüfungsantrag</a> stellen – er hängt nicht von Fristen ab.</li></ul>`,
 f:'Ein Monat ab Kenntnis; Nachholung + Glaubhaftmachung.',rel:['n_wid','n_ueberpr','f9_1'],l:LK(['SGG',67])});

N('n_eil','t_rechtsschutz','Einstweiliger Rechtsschutz',{p:'§ 86b SGG',k:['SGG|86b','SGG|86a'],m:[9],src:'SGG',sum:'Anordnung der aufschiebenden Wirkung oder einstweilige Anordnung – bei Eilbedürftigkeit.',
 b:`<p><b>§ 86b Abs. 2:</b> Das Gericht der Hauptsache kann auf Antrag eine einstweilige Anordnung treffen, wenn die Gefahr besteht, dass durch eine Veränderung des bestehenden Zustands die Verwirklichung eines Rechts des Antragstellers vereitelt oder wesentlich erschwert werden könnte, und zur Regelung eines vorläufigen Zustands, wenn dies zur Abwendung wesentlicher Nachteile nötig erscheint.</p>
<div class="tw"><table><thead><tr><th>Antrag</th><th>Konstellation</th><th>Voraussetzungen</th></tr></thead><tbody>
<tr><td>Anordnung der aufschiebenden Wirkung (§ 86b Abs. 1 S. 1 Nr. 2)</td><td>Aufhebung, Minderung, Entziehung laufender Leistungen</td><td>Widerspruch eingelegt; ernstliche Zweifel an der Rechtmäßigkeit oder unbillige Härte</td></tr>
<tr><td>Einstweilige Anordnung (§ 86b Abs. 2)</td><td>erstmalige oder höhere Leistung, Versagung, Mietschulden</td><td>Anordnungsanspruch und Anordnungsgrund (Eilbedürftigkeit) glaubhaft machen</td></tr></tbody></table></div>
<p>Keine feste Frist, aber Eilbedürftigkeit: bei drohender Räumung, Energiesperre oder fehlendem Lebensunterhalt sofort handeln (Schreiben des Vermieters/Versorgers beifügen).</p>`,
 f:'Abgrenzung § 86b Abs. 1 / Abs. 2; Anordnungsanspruch + -grund.',rel:['n_wid','n_aufheb','f9_1','f9_3'],l:LK(['SGG','86b'],['SGG','86a'])});
